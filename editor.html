<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Level Workshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout idea: a workbench. Slim top bar with tabs, then a list rail, a work surface and an inspector side by side. */
:root {
  --bg: #e9edf2; --panel: #ffffff; --panel2: #f2f5f9; --line: #d2d9e3; --ink: #16202e; --ink2: #566478;
  --accent: #9a5a06; --accent-ink: #ffffff; --accent-soft: #f7e7c9; --good: #1b7f47; --warn: #9a5f00; --bad: #bd3434;
  --field: #ffffff; --shadow: 0 8px 30px rgba(20, 30, 50, .18);
  --display: 'Chakra Petch', system-ui, sans-serif; --body: 'IBM Plex Sans', system-ui, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1219; --panel: #151c26; --panel2: #1b2431; --line: #2a3544; --ink: #e5ebf4; --ink2: #8f9fb5;
    --accent: #f2b84b; --accent-ink: #1b1303; --accent-soft: #3a2e12; --good: #5fcf8e; --warn: #f0b24a; --bad: #ff7a7a;
    --field: #0f151d; --shadow: 0 8px 30px rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1219; --panel: #151c26; --panel2: #1b2431; --line: #2a3544; --ink: #e5ebf4; --ink2: #8f9fb5;
  --accent: #f2b84b; --accent-ink: #1b1303; --accent-soft: #3a2e12; --good: #5fcf8e; --warn: #f0b24a; --bad: #ff7a7a;
  --field: #0f151d; --shadow: 0 8px 30px rgba(0, 0, 0, .5); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--body); }
button, input, select, textarea { font: inherit; color: inherit; }
.app { display: flex; flex-direction: column; height: 100%; }

/* top bar */
.top { display: flex; align-items: center; gap: 18px; padding: 0 16px; height: 52px; background: var(--panel); border-bottom: 1px solid var(--line); flex: none; }
.brand { font: 700 19px var(--display); letter-spacing: .02em; display: flex; align-items: center; gap: 9px; white-space: nowrap; }
.brand i { width: 14px; height: 14px; background: var(--accent); display: inline-block; transform: rotate(45deg); border-radius: 2px; }
.tabs { display: flex; gap: 4px; height: 100%; }
.tab { border: 0; background: none; padding: 0 14px; cursor: pointer; font: 600 14px var(--display); letter-spacing: .03em; color: var(--ink2); border-bottom: 3px solid transparent; margin-top: 3px; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.grow { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 99px; padding: 2px 10px; font: 500 12px var(--mono); border: 1px solid var(--line); background: var(--panel2); color: var(--ink2); white-space: nowrap; }
.pill.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, var(--line)); }
.pill.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }

main { flex: 1; min-height: 0; display: flex; }
.cols { display: grid; width: 100%; min-height: 0; }
.cols.levels { grid-template-columns: 230px minmax(0, 1fr) 420px; }
.cols.entity { grid-template-columns: 230px minmax(0, 1fr); }
.col { min-height: 0; overflow: auto; background: var(--panel); }
.rail { border-right: 1px solid var(--line); display: flex; flex-direction: column; }
.inspector { border-left: 1px solid var(--line); }
.surface { background: var(--bg); display: flex; flex-direction: column; padding: 12px 14px; gap: 10px; }
.rail-head { padding: 12px 12px 8px; display: flex; flex-wrap: wrap; gap: 6px; }
.rail-list { flex: 1; overflow: auto; padding: 4px 8px 12px; display: flex; flex-direction: column; gap: 3px; }
.item { display: flex; align-items: center; gap: 9px; text-align: left; border: 1px solid transparent; background: none; border-radius: 6px; padding: 7px 9px; cursor: pointer; width: 100%; }
.item:hover { background: var(--panel2); }
.item[aria-current="true"] { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
.item .n { font: 500 12px var(--mono); color: var(--ink2); width: 18px; flex: none; }
.item .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.item .tag { font: 500 11px var(--mono); color: var(--ink2); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.sw { width: 18px; height: 18px; flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; cursor: pointer; }
.strip { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
.strip-item { text-align: center; width: 80px; }
.seg button { display: inline-flex; align-items: center; gap: 6px; }
.wall-list { flex-wrap: wrap; }
.wall-list button + button { border-left: 1px solid var(--line); }

/* controls */
.btn { border: 1px solid var(--line); background: var(--panel2); border-radius: 6px; padding: 5px 11px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--ink2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 2px 8px; font-size: 12px; }
.btn[disabled] { opacity: .4; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.in { background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; min-width: 0; width: 100%; }
.in:focus { border-color: var(--accent); outline: none; }
.in.num { font-family: var(--mono); font-size: 13px; }
textarea.in { resize: vertical; min-height: 54px; }
input[type="color"].in { padding: 1px 3px; height: 31px; cursor: pointer; }
input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: none; padding: 5px 12px; cursor: pointer; font-weight: 500; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.badge { font: 600 11px var(--mono); background: var(--bad); color: #fff; border-radius: 9px; padding: 0 6px; margin-left: 5px; }
.panel-pad { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.sec-title { font: 600 12px var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); margin: 4px 0 0; }
.row { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 4px 10px; align-items: center; }
.row .hint { grid-column: 2; font-size: 12px; color: var(--ink2); margin-top: -2px; }
.row.chk { grid-template-columns: 112px auto; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar .lab { font-size: 12px; color: var(--ink2); }
.inline { display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.fields2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 10px 32px; }
.fields2 > .span { grid-column: 1 / -1; }
.small { font-size: 12px; color: var(--ink2); }
.mono { font-family: var(--mono); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.card.flat { background: var(--panel2); }
.card-head { display: flex; align-items: center; gap: 6px; }
.card-head b { font: 600 14px var(--display); letter-spacing: .02em; white-space: nowrap; }
.card-head .small { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grow-row { display: grid; gap: 6px; align-items: center; }
.g-group { grid-template-columns: minmax(72px, 1fr) 50px 50px 50px 54px 24px; }
.g-group .in { padding: 4px 5px; font-size: 12.5px; }
.col-head { font: 500 11px var(--mono); color: var(--ink2); }
.issue { display: flex; gap: 8px; align-items: flex-start; padding: 6px 8px; border-radius: 6px; background: var(--panel2); border-left: 3px solid var(--line); }
.issue.error { border-left-color: var(--bad); }
.issue.warn { border-left-color: var(--warn); }
.issue b { font: 600 11px var(--mono); text-transform: uppercase; }
.issue.error b { color: var(--bad); } .issue.warn b { color: var(--warn); }
.ok-note { color: var(--good); font-weight: 500; }
.cond { border-left: 3px solid var(--accent); padding: 4px 0 4px 10px; display: flex; flex-direction: column; gap: 6px; }
.cond .cond { border-left-color: var(--line); }
.cond-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.cond-row .in { width: auto; flex: 1 1 110px; }
.cond-row .in.min { flex: 0 0 76px; }
.summary-box { font-size: 13px; background: var(--accent-soft); border-radius: 6px; padding: 8px 10px; }
.table-wrap { overflow-x: auto; }
table.up { border-collapse: collapse; width: 100%; font-size: 13px; }
table.up th { font: 500 11px var(--mono); color: var(--ink2); text-align: left; padding: 2px 4px; white-space: nowrap; }
table.up td { padding: 2px 3px; }
table.up .in { padding: 3px 5px; min-width: 58px; }
table.up td:first-child .in { min-width: 110px; }
.cv-wrap { flex: 1; min-height: 0; display: flex; align-items: flex-start; justify-content: center; position: relative; }
canvas { display: block; border-radius: 4px; }
.status { font: 12px var(--mono); color: var(--ink2); min-height: 18px; }
.hero { display: flex; gap: 14px; align-items: center; }
.hero canvas { background: #3a3d2e; border: 1px solid var(--line); flex: none; }
.files { display: flex; flex-direction: column; gap: 6px; }
.file-row { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
.file-row .path { font: 500 13px var(--mono); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.drop { border: 2px dashed var(--line); border-radius: 10px; padding: 22px; text-align: center; color: var(--ink2); cursor: pointer; background: var(--panel); }
.drop.over, .drop:hover { border-color: var(--accent); color: var(--ink); }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.wide { padding: 18px; max-width: 860px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h2 { font: 700 20px var(--display); margin: 0; letter-spacing: .01em; }

/* overlays */
.overlay { position: fixed; inset: 0; background: rgba(8, 12, 18, .66); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 14px; }
.dialog { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 18px; max-width: 460px; width: 100%; display: flex; flex-direction: column; gap: 14px; }
.dialog .btns { display: flex; justify-content: flex-end; gap: 8px; }
.play { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 12px; display: flex; flex-direction: column; gap: 8px; max-width: 100%; max-height: 100%; }
.play-bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.stat { font: 600 15px var(--mono); }
.play-cv { position: relative; display: flex; justify-content: center; overflow: auto; }
.banner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: rgba(8, 12, 18, .72); color: #fff; border-radius: 4px; }
.banner b { font: 700 32px var(--display); }
.toasts { position: fixed; left: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 6px; z-index: 80; max-width: min(460px, calc(100vw - 28px)); }
.toast { background: var(--ink); color: var(--bg); border-radius: 7px; padding: 8px 12px; font-size: 13px; box-shadow: var(--shadow); }
.toast.bad { background: var(--bad); color: #fff; }

@media (max-width: 1100px) {
  .cols.levels { grid-template-columns: 200px minmax(0, 1fr); }
  .cols.levels .inspector { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); }
  .cols.levels, .cols.entity { overflow: auto; }
}
@media (max-width: 760px) {
  main { overflow: auto; }
  .cols.levels, .cols.entity { grid-template-columns: 1fr; }
  .rail { border-right: 0; border-bottom: 1px solid var(--line); max-height: 220px; }
  .top { gap: 8px; padding: 0 10px; overflow-x: auto; }
  .brand span { display: none; }
  .row { grid-template-columns: 1fr; }
  .row .hint { grid-column: 1; }
  .cv-wrap { min-height: 320px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><i></i><span>Level Workshop</span></div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div class="grow"></div>
    <span class="pill" id="saveNote" title="Your work is kept in this browser as you edit. Export files to put it in your repo.">autosaved in this browser</span>
    <span class="pill" id="issuePill"></span>
  </header>
  <main id="main"></main>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>
// Pure game simulation. No Phaser, no DOM.
// Units: 1 = one grid cell. Positions are cell-centre based (cell [c,r] is centred at c+0.5, r+0.5).

const SHAPES = ['circle', 'square', 'triangle', 'diamond', 'hexagon', 'star'];
const TARGETING = ['first', 'last', 'strongest', 'closest'];
const ATTACK_TYPES = ['projectile', 'beam', 'pulse', 'arc', 'income'];
/** How a projectile looks in flight (only drawing differs). */
const SHOT_KINDS = ['', 'bullet', 'tracer', 'grenade', 'flask', 'rocket'];
/** A zombie with at least this much base armor counts as "armored" for armorBonus. */
const ARMORED_AT = 0.2;
/** Poison keeps getting stronger for this many seconds, then stops growing. */
const POISON_RAMP_CAP = 10;
/** A spinning-up gun starts this many times slower than its full fire rate. */
const SPIN_START = 3;
const MAX_PATHS = 3;

const DEFAULT_ATTACK = {
  type: 'projectile',
  damage: 5,
  range: 2.5,
  cooldown: 1,
  projectileSpeed: 8,
  splashRadius: 0,
  slowFactor: 1,
  slowDuration: 0,
  hitsAir: true,
  hitsGround: true,
  armorPierce: 0, // 0-0.95: fraction of the target's armor that is ignored
  shots: 1, // projectiles per volley / simultaneous beam targets
  burnDps: 0, // damage per second over time (ignores armor)
  burnDuration: 0,
  shot: '', // projectile look: bullet, tracer, grenade, flask, rocket
  armorBonus: 0, // extra damage against armored zombies (0.5 = +50%)
  poisonDps: 0, // poison: damage per second (ignores armor) ...
  poisonRamp: 0, // ... plus this much more for every second the zombie has been poisoned (up to POISON_RAMP_CAP seconds)
  poisonDuration: 0, // poison wears off this long after the last hit
  poisonSpread: 0, // a poisoned zombie that dies spreads its poison to zombies this close
  chain: 0, // arc: how many more zombies the shock jumps to
  chainRange: 1.3, // arc: how far a jump can reach
  chainFalloff: 0.8, // arc: each jump keeps this fraction of the damage
  spinUp: 0, // seconds of continuous fire to reach full fire rate (0 = fires at full rate at once)
  income: 0, // income towers: money paid every `cooldown` seconds while a wave is on
  bounty: 0, // money earned for every zombie that dies within range
};

// Upgrade-path restrictions, like Bloons TD: at most `maxPaths` paths can be used on one tower,
// and only one path may go past tier `secondaryMax`.
const DEFAULT_RULES = { maxPaths: 2, secondaryMax: 2 };

// ---------- tower tiers ----------
// A tier is a set of modifiers applied on top of the tower's base attack (and the tiers below it):
//   damage +N | range +N | cooldown xN | projectileSpeed xN | splashRadius +N
//   slowTo N (slow factor, lowest wins) | slowFactor xN (strengthens an existing slow) | slowDuration +N
//   armorPierce +N | shots +N | burnDps +N | burnDuration N (longest wins) | hitsAir true | hitsGround true
//   armorBonus +N | poisonDps +N | poisonRamp +N | poisonDuration N (longest wins) | poisonSpread +N
//   chain +N | chainRange +N | chainFalloff +N (at most 1) | spinUp xN | income +N | bounty +N
function applyTier(a, t) {
  if (t.damage) a.damage += t.damage;
  if (t.range) a.range += t.range;
  if (t.cooldown) a.cooldown *= t.cooldown;
  if (t.projectileSpeed) a.projectileSpeed *= t.projectileSpeed;
  if (t.splashRadius) a.splashRadius += t.splashRadius;
  if (t.slowDuration) a.slowDuration += t.slowDuration;
  if (t.slowTo !== undefined && t.slowTo !== null) {
    a.slowFactor = Math.min(a.slowFactor, t.slowTo);
    if (!(a.slowDuration > 0)) a.slowDuration = 2;
  }
  if (t.slowFactor && a.slowFactor < 1) a.slowFactor = Math.max(0.02, a.slowFactor * t.slowFactor);
  if (t.armorPierce) a.armorPierce = Math.min(0.95, a.armorPierce + t.armorPierce);
  if (t.shots) a.shots += t.shots;
  if (t.burnDps) {
    a.burnDps += t.burnDps;
    if (!(a.burnDuration > 0)) a.burnDuration = 3;
  }
  if (t.burnDuration) a.burnDuration = Math.max(a.burnDuration, t.burnDuration);
  if (t.hitsAir) a.hitsAir = true;
  if (t.hitsGround) a.hitsGround = true;
  if (t.armorBonus) a.armorBonus += t.armorBonus;
  if (t.poisonDps) {
    a.poisonDps += t.poisonDps;
    if (!(a.poisonDuration > 0)) a.poisonDuration = 4;
  }
  if (t.poisonRamp) {
    a.poisonRamp += t.poisonRamp;
    if (!(a.poisonDuration > 0)) a.poisonDuration = 4;
  }
  if (t.poisonDuration) a.poisonDuration = Math.max(a.poisonDuration, t.poisonDuration);
  if (t.poisonSpread) a.poisonSpread += t.poisonSpread;
  if (t.chain) a.chain += t.chain;
  if (t.chainRange) a.chainRange += t.chainRange;
  if (t.chainFalloff) a.chainFalloff = Math.min(1, a.chainFalloff + t.chainFalloff);
  if (t.spinUp) a.spinUp *= t.spinUp;
  if (t.income) a.income += t.income;
  if (t.bounty) a.bounty += t.bounty;
}

/** The tower's attack with `tiers` = [tiersOnPath0, tiersOnPath1, tiersOnPath2] applied. */
function attackAt(def, tiers) {
  const a = { ...DEFAULT_ATTACK, ...(def.attack || {}) };
  (def.paths || []).forEach((p, pi) => {
    const n = (tiers && tiers[pi]) || 0;
    for (let i = 0; i < n && i < (p.tiers || []).length; i++) applyTier(a, p.tiers[i]);
  });
  a.cooldown = Math.max(0.05, a.cooldown);
  a.damage = Math.max(0, a.damage);
  a.shots = Math.max(1, Math.round(a.shots));
  a.chain = Math.max(0, Math.round(a.chain));
  return a;
}

function describeTier(t) {
  if (t.desc) return t.desc;
  const p = [];
  const pc = (x) => Math.round(x * 100);
  const n1 = (x) => Math.round(x * 10) / 10;
  if (t.damage) p.push((t.damage > 0 ? '+' : '') + n1(t.damage) + ' damage');
  if (t.range) p.push((t.range > 0 ? '+' : '') + n1(t.range) + ' range');
  if (t.cooldown) p.push(t.cooldown < 1 ? pc(1 - t.cooldown) + '% faster fire' : pc(t.cooldown - 1) + '% slower fire');
  if (t.projectileSpeed) p.push(t.projectileSpeed > 1 ? pc(t.projectileSpeed - 1) + '% faster shots' : pc(1 - t.projectileSpeed) + '% slower shots');
  if (t.splashRadius) p.push('+' + n1(t.splashRadius) + ' splash radius');
  if (t.slowTo !== undefined && t.slowTo !== null) p.push('slows to ' + pc(t.slowTo) + '% speed');
  if (t.slowFactor) p.push('stronger slow');
  if (t.slowDuration) p.push('+' + n1(t.slowDuration) + 's slow time');
  if (t.armorPierce) p.push('ignores ' + pc(t.armorPierce) + '% more armor');
  if (t.shots) p.push('+' + t.shots + (t.shots === 1 ? ' target' : ' targets'));
  if (t.burnDps) p.push('+' + n1(t.burnDps) + ' burn damage/s');
  if (t.burnDuration) p.push('burns for ' + n1(t.burnDuration) + 's');
  if (t.hitsAir) p.push('can hit air');
  if (t.hitsGround) p.push('can hit ground');
  if (t.armorBonus) p.push('+' + pc(t.armorBonus) + '% damage to armored zombies');
  if (t.poisonDps) p.push('+' + n1(t.poisonDps) + ' poison damage/s');
  if (t.poisonRamp) p.push('poison grows +' + n1(t.poisonRamp) + '/s every second');
  if (t.poisonDuration) p.push('poison lasts ' + n1(t.poisonDuration) + 's');
  if (t.poisonSpread) p.push('poison spreads +' + n1(t.poisonSpread) + ' on death');
  if (t.chain) p.push((t.chain > 0 ? '+' : '') + t.chain + (Math.abs(t.chain) === 1 ? ' chain jump' : ' chain jumps'));
  if (t.chainRange) p.push('+' + n1(t.chainRange) + ' jump reach');
  if (t.chainFalloff) p.push('jumps keep +' + pc(t.chainFalloff) + '% more damage');
  if (t.spinUp) p.push(t.spinUp < 1 ? pc(1 - t.spinUp) + '% faster spin-up' : pc(t.spinUp - 1) + '% slower spin-up');
  if (t.income) p.push('+$' + n1(t.income) + ' per payout');
  if (t.bounty) p.push('+$' + n1(t.bounty) + ' per kill nearby');
  return p.join(', ');
}

/** The attack as lines of text for the in-game tower panel and the Team screen: headline, extras, what it can hit. */
function describeAttack(s) {
  const n1 = (x) => Math.round(x * 10) / 10;
  const pc = (x) => Math.round(x * 100);
  const lines = [];
  if (s.type === 'income') {
    lines.push('Pays $' + n1(s.income) + ' every ' + n1(s.cooldown) + 's while a wave is on');
    if (s.bounty > 0) lines.push('+$' + n1(s.bounty) + ' for every kill within ' + n1(s.range));
    else lines.push('Range ' + n1(s.range));
    return lines;
  }
  if (s.type === 'beam') lines.push('Beam ' + n1(s.damage) + '/s   Range ' + n1(s.range));
  else lines.push((s.type === 'pulse' ? 'Pulse ' : s.type === 'arc' ? 'Shock ' : 'Damage ') + n1(s.damage) + '   Range ' + n1(s.range) + '   ' + n1(1 / s.cooldown) + '/s');
  const x = [];
  if (s.shots > 1) x.push(s.type === 'beam' ? s.shots + ' targets' : s.shots + (s.type === 'arc' ? ' bolts' : ' shots'));
  if (s.type === 'arc') x.push('Chains ' + s.chain + ' (reach ' + n1(s.chainRange) + ', keeps ' + pc(s.chainFalloff) + '%)');
  if (s.splashRadius > 0) x.push('Splash ' + n1(s.splashRadius));
  if (s.slowFactor < 1) x.push('Slow to ' + pc(s.slowFactor) + '%');
  if (s.burnDps > 0) x.push('Burn ' + n1(s.burnDps) + '/s');
  if (s.poisonDuration > 0 && (s.poisonDps > 0 || s.poisonRamp > 0)) x.push('Poison ' + n1(s.poisonDps) + '/s +' + n1(s.poisonRamp) + '/s every second' + (s.poisonSpread > 0 ? ', spreads ' + n1(s.poisonSpread) : ''));
  if (s.armorPierce > 0) x.push('Pierce ' + pc(s.armorPierce) + '%');
  if (s.armorBonus > 0) x.push('+' + pc(s.armorBonus) + '% vs armored');
  if (s.spinUp > 0) x.push('Spins up in ' + n1(s.spinUp) + 's');
  if (s.bounty > 0) x.push('+$' + n1(s.bounty) + ' per kill nearby');
  if (x.length) lines.push(x.join('   '));
  const air = s.hitsAir !== false;
  const ground = s.hitsGround !== false;
  lines.push('Hits: ' + (air && ground ? 'air + ground' : air ? 'air only' : 'ground only'));
  return lines;
}

/** Old format: `upgrades` = flat list with absolute stats. Becomes one path of modifier tiers. */
function migrateTower(def) {
  if (def.paths) return def;
  const out = { ...def };
  delete out.upgrades;
  const ups = def.upgrades || [];
  if (!ups.length) {
    out.paths = [];
    return out;
  }
  const cur = { ...DEFAULT_ATTACK, ...(def.attack || {}) };
  const r = (x) => Math.round(x * 1000) / 1000;
  const tiers = ups.map((u) => {
    const t = { name: u.name || '', cost: u.cost || 0 };
    for (const f of ['damage', 'range', 'splashRadius', 'slowDuration']) {
      if (u[f] !== undefined && u[f] !== cur[f]) {
        t[f] = r(u[f] - cur[f]);
        cur[f] = u[f];
      }
    }
    for (const f of ['cooldown', 'projectileSpeed']) {
      if (u[f] !== undefined && u[f] !== cur[f]) {
        t[f] = r(u[f] / cur[f]);
        cur[f] = u[f];
      }
    }
    if (u.slowFactor !== undefined && u.slowFactor < cur.slowFactor) {
      t.slowTo = u.slowFactor;
      cur.slowFactor = u.slowFactor;
    }
    return t;
  });
  out.paths = [{ name: 'Upgrades', tiers }];
  return out;
}

// ---------- path helpers ----------

/** Every grid cell covered by a list of [col,row] waypoints (axis-aligned or not). */
function pathCells(points) {
  const out = [];
  if (!points || !points.length) return out;
  out.push([points[0][0], points[0][1]]);
  for (let i = 1; i < points.length; i++) {
    const [x0, y0] = points[i - 1];
    const [x1, y1] = points[i];
    const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0));
    for (let k = 1; k <= n; k++) {
      out.push([Math.round(x0 + ((x1 - x0) * k) / n), Math.round(y0 + ((y1 - y0) * k) / n)]);
    }
  }
  return out;
}

function buildPath(points) {
  const pts = points.map((p) => [p[0] + 0.5, p[1] + 0.5]);
  const lens = [];
  let total = 0;
  for (let i = 1; i < pts.length; i++) {
    const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    lens.push(l);
    total += l;
  }
  return { pts, lens, total };
}

function pointAt(path, d) {
  if (path.pts.length === 1) return [path.pts[0][0], path.pts[0][1]];
  if (d <= 0) return [path.pts[0][0], path.pts[0][1]];
  let rem = d;
  for (let i = 0; i < path.lens.length; i++) {
    if (rem <= path.lens[i] || i === path.lens.length - 1) {
      const t = path.lens[i] === 0 ? 0 : Math.min(1, rem / path.lens[i]);
      const a = path.pts[i];
      const b = path.pts[i + 1];
      return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
    }
    rem -= path.lens[i];
  }
  const last = path.pts[path.pts.length - 1];
  return [last[0], last[1]];
}

// ---------- zombie tiers ----------
// A zone has a strength tier (1 to MAX_TIER). Every zombie scales with the tier of the level it appears in, so the same Walker is
// tougher in Act 5 than in Act 1. Every RANK_SIZE tiers the zombies also move up a rank (Hardened, Veteran ...), which is shown on them.
const MAX_TIER = 50;
const RANK_SIZE = 10;
const RANK_NAMES = ['', 'Hardened', 'Veteran', 'Elite', 'Apex'];
/** Growth per tier step above 1. An enemy can override any of these with its own `scaling: { health, speed, armor, reward }`. */
const DEFAULT_SCALING = { health: 0.12, speed: 0.006, armor: 0.004, reward: 0.04 };
const SPEED_CAP = 1.6;
const ARMOR_CAP = 0.8;

const normTier = (t) => Math.max(1, Math.min(MAX_TIER, Math.floor(Number(t)) || 1));
const rankOf = (tier) => Math.min(RANK_NAMES.length - 1, Math.floor((normTier(tier) - 1) / RANK_SIZE));

/** An enemy's stats at a tier. Tier 1 is exactly what the enemy file says. */
function scaleEnemy(def, tier) {
  const t = normTier(tier) - 1;
  const sc = { ...DEFAULT_SCALING, ...(def.scaling || {}) };
  return {
    health: (def.health ?? 30) * (1 + sc.health * t),
    speed: (def.speed ?? 1.4) * Math.min(SPEED_CAP, 1 + sc.speed * t),
    armor: Math.min(ARMOR_CAP, (def.armor || 0) + sc.armor * t),
    reward: Math.round((def.reward || 0) * (1 + sc.reward * t)),
    score: Math.round((def.score || 0) * (1 + sc.reward * t)),
  };
}

/** "Hardened Walker" at tier 11 to 20, and so on. */
function enemyName(def, tier) {
  const r = RANK_NAMES[rankOf(tier)];
  return (r ? r + ' ' : '') + (def.name || def.id);
}

// Special abilities. Each is an optional object on the enemy file; anything left out takes these defaults.
const ABILITY_DEFAULTS = {
  scream: { interval: 5, range: 2.5, duration: 2 }, // every `interval` s towers within `range` must shoot this zombie for `duration` s
  leap: { range: 2, cooldown: 3, time: 0.5, minGain: 1 }, // jumps to a lane within `range` cells that is at least `minGain` cells closer to the exit
  ward: { range: 2.5 }, // zombies within `range` cannot die
  summon: { interval: 8, max: 6, enemies: [] }, // every `interval` s calls up to `max` zombies, [{ enemy, count }]
};
const abilityOf = (def, key) => (def && def[key] ? { ...ABILITY_DEFAULTS[key], ...(def[key] === true ? {} : def[key]) } : null);

/** What an enemy leaves behind when killed: spawnOnDeath [{ enemy, count }], or the old splitInto / splitCount. */
function deathSpawns(def) {
  const list = Array.isArray(def.spawnOnDeath) ? def.spawnOnDeath.filter((x) => x && x.enemy && x.count > 0) : [];
  if (!list.length && def.splitInto) return [{ enemy: def.splitInto, count: def.splitCount || 0 }];
  return list;
}

/** The point on a path closest to (x, y): its distance along the path, how far away it is, and where it is. */
function nearestOnPath(path, x, y) {
  let best = { d: 0, dist: Infinity, x: path.pts[0][0], y: path.pts[0][1] };
  let acc = 0;
  for (let i = 0; i < path.lens.length; i++) {
    const a = path.pts[i];
    const b = path.pts[i + 1];
    const len = path.lens[i];
    let t = 0;
    if (len > 0) t = Math.max(0, Math.min(1, ((x - a[0]) * (b[0] - a[0]) + (y - a[1]) * (b[1] - a[1])) / (len * len)));
    const px = a[0] + (b[0] - a[0]) * t;
    const py = a[1] + (b[1] - a[1]) * t;
    const dist = Math.hypot(x - px, y - py);
    if (dist < best.dist) best = { d: acc + len * t, dist, x: px, y: py };
    acc += len;
  }
  return best;
}

function byId(list) {
  const m = {};
  for (const x of list) m[x.id] = x;
  return m;
}

// ---------- the simulation ----------

// Endless mode loops the level's own waves; every extra loop adds enemies and health.
const ENDLESS_DEFAULTS = { hpGrowth: 0.35, countGrowth: 0.25 };

class Sim {
  /**
   * opts.allowed: tower ids the player may build (defaults to the level's list, or every tower)
   * opts.endless: true = waves never run out (never 'won')
   * opts.hpGrowth / opts.countGrowth: endless scaling per loop through the level's waves
   * opts.unlocked: { towerId: [tiers unlocked on path 0, 1, 2] }. Tiers beyond that cannot be bought in the level.
   *   Leave it out and every tier is available (editor playtest, tests).
   */
  constructor(level, towerDefs, enemyDefs, opts = {}) {
    this.level = level;
    this.towerDefs = byId(towerDefs.map(migrateTower));
    this.enemyDefs = byId(enemyDefs);
    this.cols = level.cols;
    this.rows = level.rows;
    this.money = level.startMoney ?? 100;
    this.lives = level.startLives ?? 20;
    this.startLives = this.lives;
    this.score = 0;
    this.kills = 0;
    this.time = 0;
    this.waveIndex = 0; // index of the NEXT wave to start
    this.status = 'playing'; // playing | won | lost
    this.towers = [];
    this.enemies = [];
    this.projectiles = [];
    this.spawnQueue = [];
    this.events = [];
    this._id = 1;
    this.endless = !!opts.endless;
    this.hpGrowth = opts.hpGrowth ?? ENDLESS_DEFAULTS.hpGrowth;
    this.countGrowth = opts.countGrowth ?? ENDLESS_DEFAULTS.countGrowth;
    this.unlocked = opts.unlocked || null;
    this.tier = normTier(opts.tier ?? level.tier ?? 1);

    this.paths = {};
    this.flyPaths = {};
    this.pathOrder = [];
    for (const p of level.paths || []) {
      if (!p.points || p.points.length < 2) continue;
      this.paths[p.id] = buildPath(p.points);
      this.flyPaths[p.id] = buildPath([p.points[0], p.points[p.points.length - 1]]);
      this.pathOrder.push(p.id);
    }

    this.pathCellSet = new Set();
    for (const p of level.paths || []) for (const c of pathCells(p.points)) this.pathCellSet.add(c[0] + ',' + c[1]);

    const allowed = opts.allowed ? opts.allowed : level.towers && level.towers.length ? level.towers : Object.keys(this.towerDefs);
    this.allowedTowers = allowed.filter((id) => this.towerDefs[id]);
  }

  // ----- building -----

  tileAt(col, row) {
    const r = this.level.tiles[row];
    return r ? r[col] : undefined;
  }

  towerAt(col, row) {
    return this.towers.find((t) => t.col === col && t.row === row) || null;
  }

  canBuild(col, row) {
    if (col < 0 || row < 0 || col >= this.cols || row >= this.rows) return false;
    if (this.tileAt(col, row) !== '.') return false;
    if (this.pathCellSet.has(col + ',' + row)) return false;
    return !this.towerAt(col, row);
  }

  buildTower(defId, col, row) {
    const def = this.towerDefs[defId];
    if (!def || !this.allowedTowers.includes(defId)) return null;
    if (this.status !== 'playing' || !this.canBuild(col, row) || this.money < def.cost) return null;
    this.money -= def.cost;
    const t = {
      id: this._id++,
      defId,
      def,
      col,
      row,
      x: col + 0.5,
      y: row + 0.5,
      tiers: [0, 0, 0], // upgrade tiers bought on each path
      cd: 0,
      spent: def.cost,
      targeting: def.targeting || 'first',
      beamTargets: [],
      aim: -Math.PI / 2, // the way it is facing (for drawing)
      shotAt: -99, // when it last fired (for recoil)
      heat: 0, // 0..1: how far a spin-up gun has got to full fire rate
      activeUntil: 0,
    };
    if (this.stats(t).type === 'income') t.cd = this.stats(t).cooldown; // the first payout comes a full wait after the wave starts
    this.towers.push(t);
    this.events.push({ type: 'build', x: t.x, y: t.y });
    return t;
  }

  /** Current attack stats of a placed tower (or { def, tiers } for a preview). */
  stats(t) {
    return attackAt(t.def, t.tiers || [0, 0, 0]);
  }

  rules(def) {
    return { ...DEFAULT_RULES, ...(def.upgradeRules || {}) };
  }

  /** The next tier on a path, or null. */
  nextTier(t, p) {
    const path = t.def.paths && t.def.paths[p];
    return (path && path.tiers[t.tiers[p]]) || null;
  }

  /** 'ok' | 'money' | 'max' | 'locked' (tier not bought with coins yet) | 'paths' (too many paths) | 'secondary' (other path already past the cap) | 'none' */
  upgradeStatus(t, p) {
    const path = t.def.paths && t.def.paths[p];
    if (!path) return 'none';
    const tier = path.tiers[t.tiers[p]];
    if (!tier) return 'max';
    if (this.unlocked && t.tiers[p] >= ((this.unlocked[t.def.id] || [])[p] || 0)) return 'locked';
    const r = this.rules(t.def);
    const next = t.tiers.slice();
    next[p]++;
    if (next.filter((x) => x > 0).length > r.maxPaths) return 'paths';
    if (next.filter((x) => x > r.secondaryMax).length > 1) return 'secondary';
    if (this.money < (tier.cost || 0)) return 'money';
    return 'ok';
  }

  upgradeTower(t, p) {
    if (this.status !== 'playing' || this.upgradeStatus(t, p) !== 'ok') return false;
    const tier = this.nextTier(t, p);
    this.money -= tier.cost || 0;
    t.spent += tier.cost || 0;
    t.tiers[p]++;
    this.events.push({ type: 'upgrade', x: t.x, y: t.y });
    return true;
  }

  sellValue(t) {
    return Math.floor(t.spent * 0.7);
  }

  sellTower(t) {
    const i = this.towers.indexOf(t);
    if (i < 0 || this.status !== 'playing') return false;
    this.towers.splice(i, 1);
    this.money += this.sellValue(t);
    return true;
  }

  // ----- waves -----

  get wavesTotal() {
    return (this.level.waves || []).length;
  }

  get allWavesStarted() {
    return !this.endless && this.waveIndex >= this.wavesTotal;
  }

  /** The wave with index i. In endless mode waves past the end loop, with more and tougher enemies. */
  waveDef(i) {
    const waves = this.level.waves || [];
    if (!waves.length) return null;
    if (i < waves.length) return { groups: waves[i].groups || [], hpMult: 1 };
    if (!this.endless) return null;
    const loop = Math.floor(i / waves.length);
    const base = waves[i % waves.length];
    return {
      groups: (base.groups || []).map((g) => ({ ...g, count: Math.ceil((g.count || 0) * (1 + this.countGrowth * loop)) })),
      hpMult: 1 + this.hpGrowth * loop,
    };
  }

  describeWave(i) {
    const w = this.waveDef(i);
    if (!w) return '';
    const counts = {};
    for (const g of w.groups) {
      const name = this.enemyDefs[g.enemy] ? enemyName(this.enemyDefs[g.enemy], this.tier) : g.enemy;
      counts[name] = (counts[name] || 0) + (g.count || 0);
    }
    const txt = Object.entries(counts)
      .map(([n, c]) => c + '× ' + n)
      .join(', ');
    return w.hpMult > 1 ? txt + '  (+' + Math.round((w.hpMult - 1) * 100) + '% health)' : txt;
  }

  startNextWave() {
    if (this.status !== 'playing' || this.allWavesStarted) return false;
    const wave = this.waveDef(this.waveIndex);
    if (!wave) return false;
    for (const g of wave.groups) {
      const pathId = g.path && this.paths[g.path] ? g.path : this.pathOrder[0];
      for (let i = 0; i < (g.count || 0); i++) {
        this.spawnQueue.push({ time: this.time + (g.delay || 0) + i * (g.interval ?? 1), enemy: g.enemy, path: pathId, hpMult: wave.hpMult });
      }
    }
    this.waveIndex++;
    this.events.push({ type: 'wave', index: this.waveIndex });
    return true;
  }

  /** opts.summonedBy: the necromancer that called this zombie (it gives no reward and is protected by it). */
  spawnEnemy(defId, pathId, d = 0, hpMult = 1, opts = {}) {
    const def = this.enemyDefs[defId];
    if (!def) return null;
    const path = (def.flying ? this.flyPaths : this.paths)[pathId] || (def.flying ? this.flyPaths : this.paths)[this.pathOrder[0]];
    if (!path) return null;
    const st = scaleEnemy(def, this.tier);
    const e = {
      id: this._id++,
      def,
      tier: this.tier,
      hp: st.health * hpMult,
      maxHp: st.health * hpMult,
      speed: st.speed,
      armor: st.armor,
      reward: opts.summonedBy ? 0 : st.reward,
      score: opts.summonedBy ? 0 : st.score,
      hpMult,
      path,
      pathId,
      d: Math.max(0, Math.min(d, path.total)),
      x: 0,
      y: 0,
      slowFactor: 1,
      slowUntil: 0,
      burnDps: 0,
      burnUntil: 0,
      poisonDps: 0,
      poisonRamp: 0,
      poisonSpread: 0,
      poisonDur: 0,
      poisonStart: 0,
      poisonUntil: 0,
      dead: false,
      summonedBy: opts.summonedBy || null,
      protector: null, // the necromancer whose ward covers this zombie right now
      lift: 0, // 0 on the ground, up to 1 at the top of a leap (for drawing)
      jump: null,
    };
    const sc = abilityOf(def, 'scream');
    const su = abilityOf(def, 'summon');
    const lp = abilityOf(def, 'leap');
    if (sc) e.screamCd = sc.interval * 0.6;
    if (su) e.summonCd = su.interval * 0.6;
    if (lp) { e.leapCd = 0; e.leapScan = 0; }
    const p = pointAt(path, e.d);
    e.x = p[0];
    e.y = p[1];
    this.enemies.push(e);
    return e;
  }

  // ----- combat helpers -----

  canTarget(stats, e) {
    return e.def.flying ? stats.hitsAir !== false : stats.hitsGround !== false;
  }

  /**
   * Up to n enemies in range, best first according to the tower's targeting rule.
   * A tower that a screamer has screamed at must shoot the screamer (if it is in range), and a tower that would shoot a zombie
   * protected by a necromancer shoots the necromancer instead (if it is in range).
   */
  pickTargets(t, stats, n = 1) {
    const inReach = (e) => !e.dead && this.canTarget(stats, e) && Math.hypot(e.x - t.x, e.y - t.y) <= stats.range;
    let list = [];
    for (const e of this.enemies) {
      if (!inReach(e)) continue;
      const dist = Math.hypot(e.x - t.x, e.y - t.y);
      let s;
      switch (t.targeting) {
        case 'last':
          s = e.path.total - e.d;
          break;
        case 'strongest':
          s = e.hp;
          break;
        case 'closest':
          s = -dist;
          break;
        default:
          s = e.d - e.path.total; // 'first': closest to the exit
      }
      list.push([s, e]);
    }
    list.sort((a, b) => b[0] - a[0]);
    let order = list.map((x) => x[1]);
    if (t.tauntUntil > this.time && t.tauntBy && inReach(t.tauntBy)) order = [t.tauntBy];
    const out = [];
    for (let e of order) {
      const n2 = this.protectorOf(e);
      if (n2 && inReach(n2)) e = n2;
      if (!out.includes(e)) out.push(e);
      if (out.length >= n) break;
    }
    return out;
  }

  pickTarget(t, stats) {
    return this.pickTargets(t, stats, 1)[0] || null;
  }

  applySlow(e, factor, duration) {
    if (!(factor < 1) || !(duration > 0) || e.def.slowImmune || e.def.statusImmune) return;
    if (e.slowUntil <= this.time || factor <= e.slowFactor) {
      e.slowFactor = factor;
      e.slowUntil = Math.max(e.slowUntil, this.time + duration);
    }
  }

  applyBurn(e, dps, duration) {
    if (!(dps > 0) || !(duration > 0) || e.def.statusImmune) return; // statusImmune: slow, burn and poison all bounce off
    if (e.burnUntil <= this.time || dps >= e.burnDps) {
      e.burnDps = dps;
      e.burnUntil = Math.max(e.burnUntil, this.time + duration);
    }
  }

  damageEnemy(e, dmg, pierce = 0) {
    if (e.dead) return;
    const armor = Math.min(0.95, (e.armor || 0) * (1 - pierce));
    e.hp -= dmg * (1 - armor);
    this.checkDeath(e);
  }

  /** The necromancer keeping this zombie alive (its ward covers it, or it was summoned by it), or null. */
  protectorOf(e) {
    const n = e.protector;
    if (n && !n.dead && n !== e) return n;
    const s = e.summonedBy;
    return s && !s.dead && s !== e ? s : null;
  }

  /** Kills an enemy whose health ran out, unless a necromancer is keeping it alive. */
  checkDeath(e) {
    if (e.dead || e.hp > 0) return;
    if (this.protectorOf(e)) e.hp = 1;
    else this.killEnemy(e);
  }

  /** Slow + burn + (optional) damage from one attack hitting one enemy. */
  hit(e, s, dmg) {
    this.damageEnemy(e, dmg * this.armorBonusFor(e, s), s.armorPierce || 0);
    this.applySlow(e, s.slowFactor, s.slowDuration);
    this.applyBurn(e, s.burnDps, s.burnDuration);
    this.applyPoison(e, s);
  }

  /** Damage multiplier of an attack against this zombie (armorBonus only counts against armored zombies). */
  armorBonusFor(e, s) {
    return s.armorBonus > 0 && (e.def.armor || 0) >= ARMORED_AT ? 1 + s.armorBonus : 1;
  }

  /** Poison: damage per second that ignores armor and keeps growing while the zombie stays poisoned. */
  applyPoison(e, s, startAt) {
    if (e.dead || e.def.statusImmune || !(s.poisonDuration > 0) || !(s.poisonDps > 0 || s.poisonRamp > 0)) return;
    if (e.poisonUntil <= this.time) e.poisonStart = startAt === undefined ? this.time : startAt;
    e.poisonDps = Math.max(e.poisonDps, s.poisonDps || 0);
    e.poisonRamp = Math.max(e.poisonRamp, s.poisonRamp || 0);
    e.poisonSpread = Math.max(e.poisonSpread, s.poisonSpread || 0);
    e.poisonDur = Math.max(e.poisonDur, s.poisonDuration);
    e.poisonUntil = Math.max(e.poisonUntil, this.time + s.poisonDuration);
  }

  /** Shock: hits the first zombie, then jumps to the nearest zombie within reach, again and again. */
  zap(t, s, first) {
    const hitSet = new Set();
    const pts = [[t.x, t.y]];
    let cur = first;
    let dmg = s.damage;
    for (let i = 0; i <= s.chain && cur; i++) {
      hitSet.add(cur);
      pts.push([cur.x, cur.y]);
      this.hit(cur, s, dmg);
      dmg *= s.chainFalloff;
      let best = null;
      let bd = s.chainRange;
      for (const o of this.enemies) {
        if (o.dead || hitSet.has(o) || !this.canTarget(s, o)) continue;
        const d = Math.hypot(o.x - cur.x, o.y - cur.y);
        if (d <= bd) {
          bd = d;
          best = o;
        }
      }
      cur = best;
    }
    this.events.push({ type: 'arc', points: pts, color: t.def.color });
  }

  /** True while a wave is on: zombies are waiting to spawn or alive. Income towers only pay then. */
  get waveActive() {
    return this.spawnQueue.length > 0 || this.enemies.some((e) => !e.dead);
  }

  killEnemy(e) {
    if (e.dead) return;
    e.dead = true;
    this.money += e.reward || 0;
    this.score += e.score || 0;
    this.kills++;
    this.events.push({ type: 'kill', x: e.x, y: e.y, color: e.def.color });
    // scrappers nearby collect a bounty
    for (const t of this.towers) {
      const s = this.stats(t);
      if (s.bounty > 0 && Math.hypot(t.x - e.x, t.y - e.y) <= s.range) {
        this.money += s.bounty;
        this.events.push({ type: 'income', x: t.x, y: t.y, amount: s.bounty, bounty: true });
      }
    }
    // a poisoned zombie that dies spreads its poison on
    if (e.poisonSpread > 0 && e.poisonUntil > this.time) {
      const sp = { poisonDps: e.poisonDps, poisonRamp: e.poisonRamp, poisonDuration: e.poisonDur, poisonSpread: e.poisonSpread };
      const started = this.time - Math.min(POISON_RAMP_CAP, this.time - e.poisonStart) * 0.5;
      for (const o of this.enemies) if (o !== e && !o.dead && Math.hypot(o.x - e.x, o.y - e.y) <= e.poisonSpread) this.applyPoison(o, sp, started);
      this.events.push({ type: 'splash', x: e.x, y: e.y, r: e.poisonSpread, color: '#9ccc3c' });
    }
    // leaves other zombies behind (a zombie king bursts into a swarm)
    const pieces = [];
    for (const sp of deathSpawns(e.def)) for (let i = 0; i < sp.count; i++) if (this.enemyDefs[sp.enemy]) pieces.push(sp.enemy);
    if (pieces.length) {
      this.events.push({ type: 'burst', x: e.x, y: e.y });
      const ratio = e.path.total ? e.d / e.path.total : 0;
      pieces.forEach((id, i) => {
        const child = this.enemyDefs[id];
        const cpath = (child.flying ? this.flyPaths : this.paths)[e.pathId];
        if (!cpath) return;
        const off = (i % 2 ? 1 : -1) * Math.ceil(i / 2) * 0.28; // fan out around where it fell
        this.spawnEnemy(id, e.pathId, Math.min(cpath.total - 0.05, ratio * cpath.total + off), e.hpMult || 1);
      });
    }
  }

  // ----- abilities -----

  scream(e, a) {
    for (const t of this.towers) if (Math.hypot(t.x - e.x, t.y - e.y) <= a.range) {
      t.tauntBy = e;
      t.tauntUntil = this.time + a.duration;
    }
    this.events.push({ type: 'scream', id: e.id, x: e.x, y: e.y, r: a.range });
  }

  summon(e, a) {
    let alive = 0;
    for (const o of this.enemies) if (!o.dead && o.summonedBy === e) alive++;
    const list = [];
    for (const g of a.enemies || []) for (let i = 0; i < (g.count || 0); i++) if (this.enemyDefs[g.enemy]) list.push(g.enemy);
    let k = 0;
    for (const id of list) {
      if (alive >= a.max) break;
      const off = (k % 2 ? 1 : -1) * (0.4 + Math.floor(k / 2) * 0.4);
      k++;
      const cpath = (this.enemyDefs[id].flying ? this.flyPaths : this.paths)[e.pathId];
      if (!cpath) continue;
      if (this.spawnEnemy(id, e.pathId, Math.max(0, Math.min(cpath.total - 0.05, e.d + off)), e.hpMult, { summonedBy: e })) alive++;
    }
    if (k) this.events.push({ type: 'summon', x: e.x, y: e.y });
  }

  /** A leaper looks for another lane that is close enough to jump to and gets it nearer the exit. */
  tryLeap(e, a) {
    if (e.def.flying) return;
    const remaining = e.path.total - e.d;
    let best = null;
    for (const id of this.pathOrder) {
      const q = this.paths[id];
      if (q === e.path) continue;
      const n = nearestOnPath(q, e.x, e.y);
      if (n.dist > a.range) continue;
      const rem = q.total - n.d;
      if (remaining - rem < a.minGain) continue;
      if (!best || rem < best.rem) best = { id, q, n, rem };
    }
    if (!best) return;
    e.jump = { t: 0, dur: Math.max(0.1, a.time), fx: e.x, fy: e.y, tx: best.n.x, ty: best.n.y, path: best.q, pathId: best.id, d: best.n.d };
    this.events.push({ type: 'leap', x: e.x, y: e.y });
  }

  // ----- main step -----

  update(dt) {
    if (this.status !== 'playing') return;
    this.time += dt;

    // spawns
    if (this.spawnQueue.length) {
      const rest = [];
      for (const s of this.spawnQueue) {
        if (s.time <= this.time) this.spawnEnemy(s.enemy, s.path, 0, s.hpMult || 1);
        else rest.push(s);
      }
      this.spawnQueue = rest;
    }

    // enemies
    for (const e of this.enemies.slice()) {
      if (e.dead) continue;
      if (e.def.regen) e.hp = Math.min(e.maxHp, e.hp + e.def.regen * dt);
      if (e.burnUntil > this.time) {
        e.hp -= e.burnDps * dt; // burning ignores armor
        this.checkDeath(e);
        if (e.dead) continue;
      }
      if (e.poisonUntil > this.time) {
        const grown = Math.min(POISON_RAMP_CAP, this.time - e.poisonStart);
        e.hp -= (e.poisonDps + e.poisonRamp * grown) * dt; // poison ignores armor and gets worse the longer it lasts
        this.checkDeath(e);
        if (e.dead) continue;
      }
      if (e.slowUntil <= this.time) e.slowFactor = 1;

      // abilities
      const sc = e.screamCd !== undefined && abilityOf(e.def, 'scream');
      if (sc && (e.screamCd -= dt) <= 0) {
        e.screamCd = sc.interval;
        this.scream(e, sc);
      }
      const su = e.summonCd !== undefined && abilityOf(e.def, 'summon');
      if (su && (e.summonCd -= dt) <= 0) {
        e.summonCd = su.interval;
        this.summon(e, su);
      }
      if (e.jump) {
        const j = e.jump;
        j.t += dt;
        const k = Math.min(1, j.t / j.dur);
        e.x = j.fx + (j.tx - j.fx) * k;
        e.y = j.fy + (j.ty - j.fy) * k;
        e.lift = Math.sin(Math.PI * k);
        if (k >= 1) {
          e.path = j.path;
          e.pathId = j.pathId;
          e.d = j.d;
          e.jump = null;
          e.lift = 0;
          e.leapCd = (abilityOf(e.def, 'leap') || ABILITY_DEFAULTS.leap).cooldown;
          this.events.push({ type: 'land', x: e.x, y: e.y });
        }
        continue; // in the air: it does not walk
      }
      const lp = e.leapCd !== undefined && abilityOf(e.def, 'leap');
      if (lp) {
        e.leapCd -= dt;
        e.leapScan -= dt;
        if (e.leapCd <= 0 && e.leapScan <= 0) {
          e.leapScan = 0.2;
          this.tryLeap(e, lp);
          if (e.jump) continue;
        }
      }

      e.d += e.speed * e.slowFactor * dt;
      if (e.d >= e.path.total) {
        e.dead = true;
        this.lives = Math.max(0, this.lives - (e.def.damage ?? 1));
        this.events.push({ type: 'leak', x: e.x, y: e.y });
        continue;
      }
      const p = pointAt(e.path, e.d);
      e.x = p[0];
      e.y = p[1];
    }

    // necromancer wards: zombies inside the range cannot die while the necromancer lives
    for (const e of this.enemies) e.protector = null;
    for (const n of this.enemies) {
      const w = !n.dead && abilityOf(n.def, 'ward');
      if (!w) continue;
      for (const e of this.enemies) if (e !== n && !e.dead && !e.protector && Math.hypot(e.x - n.x, e.y - n.y) <= w.range) e.protector = n;
    }

    // towers
    const waveOn = this.waveActive;
    for (const t of this.towers) {
      const s = this.stats(t);
      const face = (e) => {
        t.aim = Math.atan2(e.y - t.y, e.x - t.x);
      };
      if (s.type === 'beam') {
        t.beamTargets = this.pickTargets(t, s, s.shots);
        if (t.beamTargets[0]) {
          face(t.beamTargets[0]);
          t.shotAt = this.time;
        }
        for (const tgt of t.beamTargets) {
          this.damageEnemy(tgt, s.damage * this.armorBonusFor(tgt, s) * dt, s.armorPierce);
          this.applySlow(tgt, s.slowFactor, s.slowDuration || 0.2);
          this.applyBurn(tgt, s.burnDps, s.burnDuration);
          this.applyPoison(tgt, s);
        }
        continue;
      }
      if (s.type === 'income') {
        // the payout timer only runs while a wave is on, so waiting around between waves earns nothing
        if (waveOn && s.income > 0) {
          t.cd -= dt;
          if (t.cd <= 0) {
            this.money += s.income;
            this.events.push({ type: 'income', x: t.x, y: t.y, amount: s.income });
            t.shotAt = this.time;
            t.cd = s.cooldown;
          }
        }
        continue;
      }
      if (s.spinUp > 0) t.heat = Math.max(0, Math.min(1, t.heat + (t.activeUntil > this.time ? dt : -dt * 1.5) / s.spinUp));
      t.cd -= dt;
      if (t.cd > 0) continue;
      if (s.type === 'pulse') {
        let any = false;
        for (const e of this.enemies.slice()) {
          if (e.dead || !this.canTarget(s, e)) continue;
          if (Math.hypot(e.x - t.x, e.y - t.y) > s.range) continue;
          any = true;
          this.hit(e, s, s.damage);
        }
        if (any) {
          t.cd = s.cooldown;
          t.shotAt = this.time;
          this.events.push({ type: 'pulse', x: t.x, y: t.y, r: s.range, color: t.def.color });
        }
      } else if (s.type === 'arc') {
        const targets = this.pickTargets(t, s, s.shots);
        if (targets.length) {
          t.cd = s.cooldown;
          t.shotAt = this.time;
          face(targets[0]);
          for (const tgt of targets) this.zap(t, s, tgt);
        }
      } else {
        const targets = this.pickTargets(t, s, s.shots);
        if (targets.length) {
          t.cd = s.cooldown * (s.spinUp > 0 ? 1 + (SPIN_START - 1) * (1 - t.heat) : 1);
          t.activeUntil = this.time + 0.35;
          t.shotAt = this.time;
          face(targets[0]);
          for (let i = 0; i < s.shots; i++) {
            const tgt = targets[i % targets.length];
            this.projectiles.push({
              x: t.x,
              y: t.y,
              sx: t.x,
              sy: t.y,
              target: tgt,
              tx: tgt.x,
              ty: tgt.y,
              speed: s.projectileSpeed,
              damage: s.damage,
              splash: s.splashRadius,
              slowFactor: s.slowFactor,
              slowDuration: s.slowDuration,
              burnDps: s.burnDps,
              burnDuration: s.burnDuration,
              armorPierce: s.armorPierce,
              armorBonus: s.armorBonus,
              poisonDps: s.poisonDps,
              poisonRamp: s.poisonRamp,
              poisonDuration: s.poisonDuration,
              poisonSpread: s.poisonSpread,
              kind: s.shot || '',
              hitsAir: s.hitsAir !== false,
              hitsGround: s.hitsGround !== false,
              color: t.def.color,
              done: false,
            });
          }
          this.events.push({ type: 'shot', x: t.x, y: t.y });
        }
      }
    }

    // projectiles
    for (const p of this.projectiles) {
      if (p.target && !p.target.dead) {
        p.tx = p.target.x;
        p.ty = p.target.y;
      }
      const dx = p.tx - p.x;
      const dy = p.ty - p.y;
      const dist = Math.hypot(dx, dy);
      const step = p.speed * dt;
      if (dist <= step || dist < 0.001) {
        p.x = p.tx;
        p.y = p.ty;
        this.projectileHit(p);
        p.done = true;
      } else {
        p.x += (dx / dist) * step;
        p.y += (dy / dist) * step;
      }
    }
    this.projectiles = this.projectiles.filter((p) => !p.done);
    this.enemies = this.enemies.filter((e) => !e.dead);

    // end conditions
    if (this.lives <= 0) {
      this.status = 'lost';
      this.events.push({ type: 'lose' });
    } else if (this.allWavesStarted && this.spawnQueue.length === 0 && this.enemies.length === 0) {
      this.status = 'won';
      this.score += this.lives * 10;
      this.events.push({ type: 'win' });
    }
  }

  projectileHit(p) {
    if (p.splash > 0) {
      this.events.push({ type: 'splash', x: p.tx, y: p.ty, r: p.splash, color: p.color });
      for (const e of this.enemies.slice()) {
        if (e.dead) continue;
        if (e.def.flying ? !p.hitsAir : !p.hitsGround) continue;
        if (Math.hypot(e.x - p.tx, e.y - p.ty) <= p.splash) this.hit(e, p, p.damage);
      }
    } else if (p.target && !p.target.dead) {
      this.hit(p.target, p, p.damage);
    }
  }

  drainEvents() {
    const e = this.events;
    this.events = [];
    return e;
  }

  /** 1 star for a win, 2 if at least half the lives are left, 3 if no lives were lost. */
  stars() {
    if (this.status !== 'won') return 0;
    if (this.lives >= this.startLives) return 3;
    if (this.lives >= Math.ceil(this.startLives / 2)) return 2;
    return 1;
  }
}

// Level unlock conditions. A condition is a small JSON object:
//   {"type":"always"}
//   {"type":"levelComplete","level":"meadow"}
//   {"type":"levelStars","level":"meadow","min":3}
//   {"type":"levelScore","level":"meadow","min":1500}
//   {"type":"totalStars","min":6}
//   {"type":"levelsCompleted","min":3}
//   {"type":"totalScore","min":5000}
//   {"type":"all","conditions":[ ... ]}   every sub-condition must pass
//   {"type":"any","conditions":[ ... ]}   at least one must pass

const CONDITION_TYPES = ['always', 'levelComplete', 'levelStars', 'levelScore', 'totalStars', 'levelsCompleted', 'totalScore', 'all', 'any'];

function rec(save, id) {
  return (save && save.levels && save.levels[id]) || {};
}

function sum(save, key) {
  let n = 0;
  for (const id in (save && save.levels) || {}) n += save.levels[id][key] || 0;
  return n;
}

function isUnlocked(c, save) {
  if (!c || c.type === 'always') return true;
  switch (c.type) {
    case 'levelComplete':
      return !!rec(save, c.level).completed;
    case 'levelStars':
      return (rec(save, c.level).stars || 0) >= (c.min ?? 1);
    case 'levelScore':
      return (rec(save, c.level).bestScore || 0) >= (c.min ?? 0);
    case 'totalStars':
      return sum(save, 'stars') >= (c.min ?? 0);
    case 'totalScore':
      return sum(save, 'bestScore') >= (c.min ?? 0);
    case 'levelsCompleted': {
      let n = 0;
      for (const id in (save && save.levels) || {}) if (save.levels[id].completed) n++;
      return n >= (c.min ?? 0);
    }
    case 'all':
      return (c.conditions || []).every((x) => isUnlocked(x, save));
    case 'any':
      return !(c.conditions || []).length || c.conditions.some((x) => isUnlocked(x, save));
    default:
      return true;
  }
}

/** Human-readable list of what is still missing (only unmet leaf conditions). */
function describeMissing(c, save, names = {}) {
  if (isUnlocked(c, save)) return [];
  const nm = (id) => names[id] || id;
  switch (c.type) {
    case 'levelComplete':
      return ['Complete ' + nm(c.level)];
    case 'levelStars':
      return ['Earn ' + (c.min ?? 1) + '★ on ' + nm(c.level)];
    case 'levelScore':
      return ['Score ' + c.min + ' on ' + nm(c.level)];
    case 'totalStars':
      return ['Collect ' + c.min + '★ in total'];
    case 'totalScore':
      return ['Reach ' + c.min + ' total score'];
    case 'levelsCompleted':
      return ['Complete ' + c.min + ' levels'];
    case 'all':
      return (c.conditions || []).flatMap((x) => describeMissing(x, save, names));
    case 'any': {
      const opts = (c.conditions || []).map((x) => describeMissing(x, save, names).join(' + '));
      return [opts.join('  OR  ')];
    }
    default:
      return [];
  }
}

// Game-wide rules that sit above single levels: story order, coins, owned towers and the team loadout.



const DEFAULT_GAME = {
  teamSlots: 4, // how many towers a player brings into a level
  startCoins: 0,
  repeatRewardPct: 25, // replaying a cleared level pays this % of its reward
  endlessCoinsPerWave: 5,
  endlessHpGrowth: 0.35, // extra enemy health per loop through the level's waves in endless mode
  endlessCountGrowth: 0.25, // extra enemies per loop
};
const DEFAULT_LEVEL_REWARD = 50;

const clampNum = (v, d, lo, hi) => {
  const x = Number(v);
  const y = Number.isFinite(x) && v !== '' && v !== null && v !== undefined ? x : d;
  return Math.min(hi, Math.max(lo, y));
};

function normGame(g) {
  g = g || {};
  return {
    teamSlots: Math.round(clampNum(g.teamSlots, DEFAULT_GAME.teamSlots, 1, 10)),
    startCoins: Math.round(clampNum(g.startCoins, DEFAULT_GAME.startCoins, 0, 1e9)),
    repeatRewardPct: Math.round(clampNum(g.repeatRewardPct, DEFAULT_GAME.repeatRewardPct, 0, 1000)),
    endlessCoinsPerWave: Math.round(clampNum(g.endlessCoinsPerWave, DEFAULT_GAME.endlessCoinsPerWave, 0, 1e6)),
    endlessHpGrowth: clampNum(g.endlessHpGrowth, DEFAULT_GAME.endlessHpGrowth, 0, 10),
    endlessCountGrowth: clampNum(g.endlessCountGrowth, DEFAULT_GAME.endlessCountGrowth, 0, 10),
  };
}

// ---------- story: levels in order, each unlocked by finishing the one before ----------

const isDone = (save, id) => !!(save && save.levels && save.levels[id] && save.levels[id].completed);

/** Level i is open when the previous level is complete and its own (optional) extra rule passes. */
function storyUnlocked(levels, i, save) {
  const l = levels[i];
  if (!l) return false;
  if (i > 0 && !isDone(save, levels[i - 1].id)) return false;
  return isUnlocked(l.unlock, save);
}

function storyMissing(levels, i, save, names) {
  const out = [];
  if (i > 0 && !isDone(save, levels[i - 1].id)) out.push('Complete ' + levels[i - 1].name);
  if (!isUnlocked(levels[i].unlock, save)) out.push(...describeMissing(levels[i].unlock, save, names));
  return out;
}

// ---------- acts: story chapters that group levels ----------

const DEFAULT_ACT_COLOR = '#6aa7e0';

/** An act as the game uses it: id, name, description and an accent colour. */
function normAct(a) {
  a = a || {};
  const c = String(a.color == null ? '' : a.color).trim();
  return {
    id: a.id == null ? '' : String(a.id),
    name: a.name || a.id || 'Act',
    description: a.description ? String(a.description) : '',
    color: /^#[0-9a-f]{6}$/i.test(c) ? c.toLowerCase() : DEFAULT_ACT_COLOR,
  };
}

/**
 * Levels grouped by act, in act order: [{ act, entries: [{ level, index }] }]. `index` is the level's place in the
 * whole story (which is what unlocks by). Acts with no levels are left out. Levels with no act, or an unknown one,
 * go in a last group with act = null.
 */
function groupByAct(levels, acts) {
  const groups = (acts || []).map((act) => ({ act, entries: [] }));
  const other = { act: null, entries: [] };
  levels.forEach((level, index) => {
    const g = groups.find((x) => x.act.id === level.act);
    (g || other).entries.push({ level, index });
  });
  const out = groups.filter((g) => g.entries.length);
  if (other.entries.length) out.push(other);
  return out;
}

/** Progress through a group of levels: how many are cleared, stars, and whether its first level is open. */
function actSummary(group, levels, save) {
  let cleared = 0;
  let stars = 0;
  for (const { level } of group.entries) {
    const r = save && save.levels && save.levels[level.id];
    if (r && r.completed) cleared++;
    if (r) stars += r.stars || 0;
  }
  const first = group.entries[0];
  return { cleared, total: group.entries.length, stars, maxStars: group.entries.length * 3, open: !!first && storyUnlocked(levels, first.index, save) };
}

// ---------- coins ----------

const coinsOf = (save, game) => (save && Number.isFinite(save.coins) ? save.coins : game.startCoins);

/** Coins for winning a story level: full reward the first time, a smaller share on replays. */
function storyCoins(level, game, alreadyCleared) {
  const r = Math.max(0, Math.round(level.reward ?? DEFAULT_LEVEL_REWARD));
  return alreadyCleared ? Math.floor((r * game.repeatRewardPct) / 100) : r;
}

/** Coins for an endless run: pays for every wave you got through (not the one that beat you). */
function endlessCoins(game, waveReached) {
  return Math.max(0, waveReached - 1) * game.endlessCoinsPerWave;
}

// ---------- owned towers and the team ----------

const towerPrice = (def) => Math.max(0, Math.round(Number(def.price) || 0));

/** Tower ids the player owns: free ones plus anything bought. Data order. */
function ownedIds(towers, save) {
  const bought = new Set((save && save.owned) || []);
  return towers.filter((t) => towerPrice(t) === 0 || bought.has(t.id)).map((t) => t.id);
}

/** The player's team: their saved choice (owned towers only, within the slot limit), or the first owned towers. */
function teamIds(towers, save, game) {
  const owned = ownedIds(towers, save);
  if (save && Array.isArray(save.team)) {
    const seen = new Set();
    const kept = save.team.filter((id) => owned.includes(id) && !seen.has(id) && seen.add(id)).slice(0, game.teamSlots);
    // a saved team whose towers no longer exist (the roster changed) falls back to the first owned towers instead of leaving the player with nothing
    return kept.length || !save.team.length ? kept : owned.slice(0, game.teamSlots);
  }
  return owned.slice(0, game.teamSlots);
}

// ---------- upgrade tiers bought with coins ----------
// Every tier has a coin `price` (0 = free). A tier can only be used in a level once the player has bought it
// on the Team screen. Tiers are bought in order along each path.

const tierPrice = (tier) => Math.max(0, Math.round(Number(tier && tier.price) || 0));

/** For each path of a tower: how many tiers (from the start) the player has unlocked. Free tiers at the front come for nothing. */
function unlockedTiers(def, save) {
  const saved = (save && save.tiers && save.tiers[def.id]) || [];
  return (migrateTower(def).paths || []).map((p, i) => {
    const tiers = p.tiers || [];
    let n = Math.max(0, Math.min(tiers.length, Math.floor(Number(saved[i]) || 0)));
    while (n < tiers.length && tierPrice(tiers[n]) === 0) n++;
    return n;
  });
}

/** { towerId: [unlockedOnPath0, ...] } for a list of towers, as the Sim wants it. */
function unlockedMap(towers, save) {
  const m = {};
  for (const t of towers) m[t.id] = unlockedTiers(t, save);
  return m;
}

/** 'owned' | 'buy' (the next one to buy on its path) | 'later' (an earlier tier on the path comes first). */
function tierState(def, pathIndex, tierIndex, save) {
  const n = unlockedTiers(def, save)[pathIndex] || 0;
  return tierIndex < n ? 'owned' : tierIndex === n ? 'buy' : 'later';
}

/** Which towers can be built in a level: the team, narrowed by the level's own list. Never empty if avoidable. */
function availableTowers(level, towers, save, game) {
  const allowed = level.towers && level.towers.length ? level.towers : towers.map((t) => t.id);
  const owned = ownedIds(towers, save);
  const pick = (ids) => allowed.filter((id) => ids.includes(id));
  const a = pick(teamIds(towers, save, game));
  if (a.length) return a;
  const b = pick(owned).slice(0, game.teamSlots); // team has nothing this level allows: pick for them
  if (b.length) return b;
  // the level allows none of the towers the player owns: they still only get towers they own, never ones they have not bought
  if (owned.length) return owned.slice(0, game.teamSlots);
  return allowed.filter((id) => towers.some((t) => t.id === id));
}

// Zones: the look of a level's ground. A zone sets the grass colours and style, up to four kinds of path and up to
// six kinds of wall (each with its own colours and style). Levels paint walls with the tile characters
// '#' (wall 1), '2' (wall 2) ... '6' (wall 6); '.' is open, buildable ground. Each path of a level picks which of the
// zone's path types it is drawn with (`surface`, 0 = the first). Building walls join up: touching tiles of one wall type
// become one bigger building.
// Drawing is engine-agnostic: it talks to a "painter" with three calls, so the same code draws the game
// map (Phaser), the level-select previews and the editor (canvas).
//   painter.rect(x, y, w, h, '#rrggbb', alpha)
//   painter.circle(x, y, radius, '#rrggbb', alpha)
//   painter.line(x1, y1, x2, y2, width, '#rrggbb', alpha)



const GRASS_STYLES = ['plain', 'speckle', 'tiles', 'stripes'];
const PATH_STYLES = ['plain', 'cobble', 'road', 'planks', 'rails', 'dirt', 'gravel', 'sand', 'snow', 'bridge', 'tiles', 'grating', 'mud', 'flesh', 'ice'];
const WALL_STYLES = ['block', 'rock', 'tree', 'crate', 'brick', 'fence', 'water', 'bush', 'metal', 'mound', 'house', 'cabin', 'warehouse', 'skyscraper', 'shop', 'tent', 'ruins', 'silo', 'ice', 'barricade'];
/** The wall styles that are buildings (touching tiles of one type merge into one bigger building). */
const BUILDING_STYLES = ['house', 'cabin', 'warehouse', 'skyscraper', 'shop', 'barricade'];
const MAX_WALLS = 6;
const MAX_SURFACES = 4;
const WALL_CHARS = '#23456';

/** Index (0-based) of the wall type a tile character stands for, or -1 if it is not a wall. */
const wallIndex = (ch) => WALL_CHARS.indexOf(ch);
/** The tile character that paints wall type i (0-based). */
const wallChar = (i) => WALL_CHARS.charAt(i);

const DEFAULT_PATH = { name: 'Path', color: '#4c5157', inner: '#575d64', style: 'plain' };
const DEFAULT_WALL = { name: 'Wall', color: '#4a4f55', inner: '#5b6168', style: 'block' };

/** What a level looks like when it has no zone: scorched ground, concrete, asphalt. */
const DEFAULT_ZONE = {
  id: '',
  name: 'Scorched Ground',
  description: '',
  variant: '',
  tier: 1, // zombie strength: every zombie scales with the zone's tier (1 to 50)
  grassA: '#3a3d2e',
  grassB: '#35382a',
  grassStyle: 'plain',
  paths: [{ ...DEFAULT_PATH }],
  walls: [{ ...DEFAULT_WALL }],
};

function zoneColor(v, fallback) {
  let s = String(v == null ? '' : v).trim();
  if (/^#[0-9a-f]{3}$/i.test(s)) s = '#' + s.slice(1).split('').map((x) => x + x).join('');
  return /^#[0-9a-f]{6}$/i.test(s) ? s.toLowerCase() : fallback;
}

/** One path type, with anything missing filled in. */
function normPath(w, i = 0) {
  w = w || {};
  return {
    name: w.name ? String(w.name) : 'Path ' + (i + 1),
    color: zoneColor(w.color, DEFAULT_PATH.color),
    inner: zoneColor(w.inner, DEFAULT_PATH.inner),
    style: PATH_STYLES.includes(w.style) ? w.style : DEFAULT_PATH.style,
  };
}

/** One wall type, with anything missing filled in. */
function normWall(w, i = 0) {
  w = w || {};
  return {
    name: w.name ? String(w.name) : 'Wall ' + (i + 1),
    color: zoneColor(w.color, DEFAULT_WALL.color),
    inner: zoneColor(w.inner, DEFAULT_WALL.inner),
    style: WALL_STYLES.includes(w.style) ? w.style : DEFAULT_WALL.style,
  };
}

/** Fills in anything missing so a zone is always complete. Old zones with one wall (wall / wallInner / wallStyle) become a one-entry `walls` list. */
function normZone(z) {
  z = z || {};
  const D = DEFAULT_ZONE;
  let walls;
  if (Array.isArray(z.walls) && z.walls.length) walls = z.walls.slice(0, MAX_WALLS).map(normWall);
  else if (z.wall !== undefined || z.wallInner !== undefined || z.wallStyle !== undefined) walls = [normWall({ name: 'Wall', color: z.wall, inner: z.wallInner, style: z.wallStyle }, 0)];
  else walls = [{ ...DEFAULT_WALL }];
  // old zones had one path (path / pathInner / pathStyle): it becomes a one-entry `paths` list
  let paths;
  if (Array.isArray(z.paths) && z.paths.length) paths = z.paths.slice(0, MAX_SURFACES).map(normPath);
  else if (z.path !== undefined || z.pathInner !== undefined || z.pathStyle !== undefined) paths = [normPath({ name: 'Path', color: z.path, inner: z.pathInner, style: z.pathStyle }, 0)];
  else paths = [{ ...DEFAULT_PATH }];
  return {
    id: z.id == null ? D.id : String(z.id),
    name: z.name || z.id || D.name,
    description: z.description ? String(z.description) : '',
    variant: z.variant ? String(z.variant) : '',
    tier: normTier(z.tier),
    grassA: zoneColor(z.grassA, D.grassA),
    grassB: zoneColor(z.grassB, D.grassB),
    grassStyle: GRASS_STYLES.includes(z.grassStyle) ? z.grassStyle : D.grassStyle,
    paths,
    walls,
  };
}

/** The zone a level uses (already-normalised zones keyed by id), or the default look. */
function zoneFor(level, zonesById) {
  return (level && zonesById && zonesById[level.zone]) || DEFAULT_ZONE;
}

/** The zombie strength tier a level plays at: its own `tier`, else its zone's, else 1. */
function tierFor(level, zone) {
  return normTier(level && level.tier ? level.tier : zone && zone.tier ? zone.tier : 1);
}

/** Which path type (0-based) each path cell of a level is drawn with: a Map "col,row" -> surface. The first path to cover a cell wins. */
function levelPathMap(level) {
  const m = new Map();
  for (const pth of (level && level.paths) || []) {
    const sf = Math.max(0, Math.min(MAX_SURFACES - 1, Math.floor(Number(pth.surface)) || 0));
    for (const [c, r] of pathCells(pth.points)) if (!m.has(c + ',' + r)) m.set(c + ',' + r, sf);
  }
  return m;
}

/** The highest path type (1-based) any path of a level asks for; 1 if none says. */
function pathTypesUsed(level) {
  let max = 1;
  for (const pth of (level && level.paths) || []) max = Math.max(max, (Math.floor(Number(pth.surface)) || 0) + 1);
  return max;
}

/** The highest wall type (1-based) a level's tiles use; 0 if it has no walls. */
function wallsUsed(tiles) {
  let max = 0;
  for (const row of tiles || []) for (const ch of row) max = Math.max(max, wallIndex(ch) + 1);
  return max;
}

/** Blends colour a toward colour b by t (0..1). */
function mixHex(a, b, t) {
  const p = (s) => [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16));
  const x = p(a);
  const y = p(b);
  return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, '0')).join('');
}

// Stable pseudo-random number per tile so decoration doesn't flicker or move between frames.
function tileRand(c, r, k) {
  let h = (Math.imul(c, 374761393) + Math.imul(r, 668265263) + Math.imul(k + 1, 2147483647)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

/** Which way a path tile runs: 'h' (only left/right neighbours), 'v' (only up/down) or 'x' (corner, junction, end). */
function runOf(pathSet, c, r) {
  const has = (dc, dr) => pathSet.has(c + dc + ',' + (r + dr));
  const horiz = has(-1, 0) || has(1, 0);
  const vert = has(0, -1) || has(0, 1);
  return horiz && !vert ? 'h' : vert && !horiz ? 'v' : 'x';
}

function drawPathTile(p, pd, pathSet, x, y, T, c, r) {
  const inset = Math.max(2, Math.round(T * 0.07));
  const col = pd.color;
  const inn = pd.inner;
  p.rect(x, y, T, T, col, 1);
  const run = runOf(pathSet, c, r);
  const lw = (f) => Math.max(1, T * f);
  // (u, v) -> pixels, where u runs along the path and v across it
  const at = (u, v) => (run === 'v' ? [x + T * v, y + T * u] : [x + T * u, y + T * v]);
  const alongLine = (v, w, color, alpha = 1, u0 = 0, u1 = 1) => { const [x1, y1] = at(u0, v); const [x2, y2] = at(u1, v); p.line(x1, y1, x2, y2, w, color, alpha); };
  switch (pd.style) {
    case 'cobble':
      for (let k = 0; k < 4; k++) {
        const sx = x + T * (k % 2 ? 0.53 : 0.08) + (tileRand(c, r, k) - 0.5) * T * 0.05;
        const sy = y + T * (k > 1 ? 0.53 : 0.08) + (tileRand(c, r, k + 4) - 0.5) * T * 0.05;
        p.rect(sx, sy, T * 0.39, T * 0.39, inn, 1);
      }
      break;
    case 'road': {
      const marking = mixHex(inn, '#ffffff', 0.5);
      const w = Math.max(2, T * 0.08);
      if (run === 'h') p.rect(x + T * 0.28, y + T / 2 - w / 2, T * 0.44, w, marking, 1);
      else if (run === 'v') p.rect(x + T / 2 - w / 2, y + T * 0.28, w, T * 0.44, marking, 1);
      else p.rect(x + T / 2 - w, y + T / 2 - w, w * 2, w * 2, marking, 1);
      break;
    }
    case 'planks':
      // boards lie across the direction of travel
      for (let k = 0; k < 4; k++) {
        const o = T * (0.03 + 0.245 * k);
        if (run === 'h') p.rect(x + o, y + T * 0.04, T * 0.21, T * 0.92, inn, 1);
        else p.rect(x + T * 0.04, y + o, T * 0.92, T * 0.21, inn, 1);
      }
      break;
    case 'rails': {
      const steel = mixHex(inn, '#ffffff', 0.45);
      for (const f of [0.16, 0.5, 0.84]) {
        if (run === 'v') p.rect(x + T * 0.18, y + T * f - T * 0.04, T * 0.64, T * 0.08, inn, 1);
        else p.rect(x + T * f - T * 0.04, y + T * 0.18, T * 0.08, T * 0.64, inn, 1);
      }
      for (const f of [0.36, 0.64]) {
        if (run === 'v') p.line(x + T * f, y, x + T * f, y + T, lw(0.06), steel, 1);
        else p.line(x, y + T * f, x + T, y + T * f, lw(0.06), steel, 1);
      }
      break;
    }
    case 'dirt': {
      // two wheel ruts and a few stones
      if (run === 'x') p.circle(x + T / 2, y + T / 2, T * 0.3, inn, 0.7);
      else for (const f of [0.33, 0.67]) alongLine(f, lw(0.14), inn, 0.75);
      for (let k = 0; k < 4; k++) p.circle(x + (0.1 + tileRand(c, r, k + 40) * 0.8) * T, y + (0.1 + tileRand(c, r, k + 50) * 0.8) * T, lw(0.03), mixHex(col, '#000000', 0.25), 0.8);
      break;
    }
    case 'gravel':
      for (let k = 0; k < 11; k++) {
        const tone = k % 3 === 0 ? mixHex(inn, '#000000', 0.25) : k % 3 === 1 ? inn : mixHex(inn, '#ffffff', 0.2);
        p.circle(x + (0.08 + tileRand(c, r, k + 60) * 0.84) * T, y + (0.08 + tileRand(c, r, k + 80) * 0.84) * T, T * (0.035 + tileRand(c, r, k + 100) * 0.035), tone, 1);
      }
      break;
    case 'sand': {
      for (let k = 0; k < 3; k++) {
        const v = 0.2 + k * 0.28 + (tileRand(c, r, k + 110) - 0.5) * 0.08;
        const u0 = 0.05 + tileRand(c, r, k + 120) * 0.3;
        alongLine(v, lw(0.045), inn, 0.85, u0, u0 + 0.35 + tileRand(c, r, k + 130) * 0.2);
      }
      for (let k = 0; k < 3; k++) p.circle(x + (0.1 + tileRand(c, r, k + 140) * 0.8) * T, y + (0.1 + tileRand(c, r, k + 150) * 0.8) * T, lw(0.025), mixHex(col, '#ffffff', 0.3), 1);
      break;
    }
    case 'snow': {
      p.rect(x + inset, y + inset, T - inset * 2, T - inset * 2, inn, 0.6);
      const dent = mixHex(col, '#6a8aa5', 0.5);
      const [fx, fy] = at(0.3, 0.38);
      p.circle(fx, fy, lw(0.06), dent, 1);
      if (run !== 'x') { const [gx, gy] = at(0.7, 0.62); p.circle(gx, gy, lw(0.06), dent, 1); }
      for (let k = 0; k < 3; k++) p.circle(x + (0.1 + tileRand(c, r, k + 160) * 0.8) * T, y + (0.1 + tileRand(c, r, k + 170) * 0.8) * T, lw(0.02), '#ffffff', 1);
      break;
    }
    case 'bridge': {
      // planks across the way, with a rail and posts on both edges
      for (let k = 0; k < 4; k++) {
        const o = T * (0.03 + 0.245 * k);
        if (run === 'v') p.rect(x + T * 0.04, y + o, T * 0.92, T * 0.21, inn, 1);
        else p.rect(x + o, y + T * 0.04, T * 0.21, T * 0.92, inn, 1);
      }
      if (run !== 'x') {
        const rail = mixHex(inn, '#000000', 0.45);
        for (const v of [0.05, 0.95]) {
          alongLine(v, lw(0.09), rail, 1);
          for (const u of [0.25, 0.75]) { const [px, py] = at(u, v); p.circle(px, py, lw(0.075), mixHex(rail, '#ffffff', 0.2), 1); }
        }
      }
      break;
    }
    case 'tiles':
      for (let k = 0; k < 4; k++) {
        const light = (k + c + r) % 2 ? mixHex(inn, '#ffffff', 0.07) : mixHex(inn, '#000000', 0.07);
        p.rect(x + T * (k % 2 ? 0.52 : 0.04), y + T * (k > 1 ? 0.52 : 0.04), T * 0.44, T * 0.44, light, 1);
      }
      break;
    case 'grating': {
      for (let k = 1; k < 5; k++) {
        p.line(x + (T * k) / 5, y + inset * 0.5, x + (T * k) / 5, y + T - inset * 0.5, lw(0.05), inn, 0.95);
        p.line(x + inset * 0.5, y + (T * k) / 5, x + T - inset * 0.5, y + (T * k) / 5, lw(0.05), inn, 0.95);
      }
      for (const [bx, by] of [[0.1, 0.1], [0.9, 0.1], [0.1, 0.9], [0.9, 0.9]]) p.circle(x + bx * T, y + by * T, lw(0.035), mixHex(inn, '#ffffff', 0.3), 1);
      break;
    }
    case 'mud':
      for (let k = 0; k < 3; k++) {
        const bx = x + (0.2 + tileRand(c, r, k + 180) * 0.6) * T;
        const by = y + (0.2 + tileRand(c, r, k + 190) * 0.6) * T;
        p.circle(bx, by, T * (0.14 + tileRand(c, r, k + 200) * 0.1), inn, 0.85);
        p.circle(bx - T * 0.03, by - T * 0.03, lw(0.04), mixHex(inn, '#ffffff', 0.28), 0.6);
      }
      for (let k = 0; k < 3; k++) p.circle(x + (0.1 + tileRand(c, r, k + 210) * 0.8) * T, y + (0.1 + tileRand(c, r, k + 220) * 0.8) * T, lw(0.025), mixHex(col, '#000000', 0.3), 0.9);
      break;
    case 'flesh': {
      for (let k = 0; k < 3; k++) {
        const v0 = 0.2 + k * 0.3;
        const v1 = v0 + (tileRand(c, r, k + 230) - 0.5) * 0.22;
        const v2 = v0 + (tileRand(c, r, k + 240) - 0.5) * 0.22;
        const pts = [at(0, v0), at(0.35, v1), at(0.7, v2), at(1, v0)];
        for (let i = 0; i < 3; i++) p.line(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1], lw(0.06), inn, 0.9);
      }
      for (let k = 0; k < 3; k++) {
        const lx = x + (0.15 + tileRand(c, r, k + 250) * 0.7) * T;
        const ly = y + (0.15 + tileRand(c, r, k + 260) * 0.7) * T;
        p.circle(lx, ly, lw(0.08), mixHex(inn, '#ffffff', 0.15), 1);
        p.circle(lx - lw(0.02), ly - lw(0.02), lw(0.03), mixHex(inn, '#ffffff', 0.55), 0.8);
      }
      break;
    }
    case 'ice': {
      p.rect(x + inset, y + inset, T - inset * 2, T - inset * 2, inn, 0.35);
      p.line(x + T * 0.15, y + T * 0.85, x + T * 0.5, y + T * 0.5, lw(0.05), '#ffffff', 0.6);
      p.line(x + T * 0.45, y + T * 0.9, x + T * 0.8, y + T * 0.55, lw(0.05), '#ffffff', 0.5);
