      const crack = mixHex(col, '#2a5a80', 0.45);
      const a0 = tileRand(c, r, 270) * 6.283;
      const cx = x + T * 0.5;
      const cy = y + T * 0.5;
      p.line(cx, cy, cx + Math.cos(a0) * T * 0.4, cy + Math.sin(a0) * T * 0.4, lw(0.03), crack, 0.9);
      p.line(cx, cy, cx + Math.cos(a0 + 2.2) * T * 0.3, cy + Math.sin(a0 + 2.2) * T * 0.3, lw(0.03), crack, 0.9);
      break;
    }
    default: // plain
      p.rect(x + inset, y + inset, T - inset * 2, T - inset * 2, inn, 1);
  }
}

/** The roof rectangle of a building tile: it reaches the tile edge on sides where the same building continues. */
function roofBox(x, y, T, nb, padF) {
  const pad = T * padF;
  const l = nb.L ? 0 : pad;
  const u = nb.U ? 0 : pad;
  const rr = nb.R ? 0 : pad;
  const d = nb.D ? 0 : pad;
  return [x + l, y + u, T - l - rr, T - u - d];
}

function drawWallTile(p, w, ground, x, y, T, c, r, nb) {
  const inset = Math.max(2, Math.round(T * 0.07));
  const col = w.color;
  const inn = w.inner;
  switch (w.style) {
    case 'rock': {
      p.rect(x, y, T, T, ground, 1);
      const blobs = [[0.36, 0.6, 0.25], [0.64, 0.52, 0.27], [0.5, 0.3, 0.2]];
      blobs.forEach(([bx, by, br], k) => {
        const jx = (tileRand(c, r, k) - 0.5) * 0.08;
        const jy = (tileRand(c, r, k + 9) - 0.5) * 0.08;
        p.circle(x + (bx + jx) * T + T * 0.03, y + (by + jy) * T + T * 0.04, br * T, col, 1);
        p.circle(x + (bx + jx) * T, y + (by + jy) * T, br * T * 0.82, inn, 1);
      });
      break;
    }
    case 'tree':
      p.rect(x, y, T, T, ground, 1);
      p.circle(x + T * 0.55, y + T * 0.8, T * 0.3, '#000000', 0.22);
      p.rect(x + T * 0.43, y + T * 0.52, T * 0.14, T * 0.34, col, 1);
      p.circle(x + T * 0.5, y + T * 0.4, T * 0.35, inn, 1);
      p.circle(x + T * 0.4, y + T * 0.3, T * 0.14, mixHex(inn, '#ffffff', 0.18), 1);
      break;
    case 'crate': {
      p.rect(x, y, T, T, col, 1);
      p.rect(x + inset, y + inset, T - inset * 2, T - inset * 2, inn, 1);
      const lw = Math.max(1, T * 0.06);
      p.line(x + inset, y + inset, x + T - inset, y + T - inset, lw, col, 1);
      p.line(x + T - inset, y + inset, x + inset, y + T - inset, lw, col, 1);
      break;
    }
    case 'brick': {
      p.rect(x, y, T, T, col, 1);
      const g = Math.max(1, T * 0.035);
      const bh = T / 3;
      for (let k = 0; k < 3; k++) {
        const cuts = k % 2 ? [0, 0.25, 0.75, 1] : [0, 0.5, 1];
        for (let i = 0; i < cuts.length - 1; i++) {
          const shade = (tileRand(c, r, k * 4 + i) - 0.5) * 0.16;
          const bx = x + cuts[i] * T;
          const bw = (cuts[i + 1] - cuts[i]) * T;
          p.rect(bx + g, y + k * bh + g, bw - 2 * g, bh - 2 * g, mixHex(inn, shade > 0 ? '#ffffff' : '#000000', Math.abs(shade)), 1);
        }
      }
      break;
    }
    case 'fence': {
      p.rect(x, y, T, T, ground, 1);
      p.rect(x, y + T * 0.28, T, T * 0.09, col, 1);
      p.rect(x, y + T * 0.64, T, T * 0.09, col, 1);
      for (let k = 0; k < 4; k++) {
        const px = x + T * (0.06 + k * 0.24);
        p.rect(px + T * 0.02, y + T * 0.14, T * 0.17, T * 0.76, '#000000', 0.2);
        p.rect(px, y + T * 0.1, T * 0.17, T * 0.76, inn, 1);
        p.rect(px, y + T * 0.1, T * 0.17, T * 0.07, mixHex(inn, '#ffffff', 0.22), 1);
      }
      break;
    }
    case 'water': {
      p.rect(x, y, T, T, col, 1);
      for (let k = 0; k < 3; k++) {
        const lx = x + T * (0.08 + tileRand(c, r, k) * 0.35);
        const ly = y + T * (0.2 + k * 0.28 + (tileRand(c, r, k + 5) - 0.5) * 0.1);
        const len = T * (0.25 + tileRand(c, r, k + 10) * 0.22);
        p.line(lx, ly, lx + len, ly, Math.max(1.5, T * 0.045), inn, 0.85);
      }
      break;
    }
    case 'bush':
      p.rect(x, y, T, T, ground, 1);
      p.circle(x + T * 0.52, y + T * 0.78, T * 0.3, '#000000', 0.2);
      [[0.34, 0.58, 0.25], [0.66, 0.58, 0.25], [0.5, 0.36, 0.27]].forEach(([bx, by, br]) => {
        p.circle(x + bx * T, y + by * T, br * T, col, 1);
        p.circle(x + bx * T, y + by * T - T * 0.02, br * T * 0.84, inn, 1);
      });
      p.circle(x + T * 0.42, y + T * 0.3, Math.max(1.5, T * 0.05), mixHex(inn, '#ffffff', 0.3), 1);
      p.circle(x + T * 0.62, y + T * 0.5, Math.max(1.5, T * 0.04), mixHex(inn, '#ffffff', 0.3), 1);
      break;
    case 'metal': {
      p.rect(x, y, T, T, col, 1);
      p.rect(x + inset, y + inset, T - inset * 2, T - inset * 2, inn, 1);
      for (let k = 1; k <= 3; k++) {
        const lx = x + inset + (k * (T - inset * 2)) / 4;
        p.line(lx, y + inset, lx, y + T - inset, Math.max(1, T * 0.05), col, 0.9);
      }
      break;
    }
    case 'mound':
      p.rect(x, y, T, T, ground, 1);
      p.circle(x + T * 0.5, y + T * 0.82, T * 0.34, '#000000', 0.18);
      [[0.5, 0.36, 0.24], [0.3, 0.62, 0.25], [0.7, 0.62, 0.25], [0.5, 0.68, 0.27]].forEach(([bx, by, br]) => {
        p.circle(x + bx * T, y + by * T, br * T, col, 1);
        p.circle(x + bx * T, y + by * T - T * 0.02, br * T * 0.86, inn, 1);
      });
      break;
    case 'house': {
      // gabled roof seen from above. Edge colour = walls and eaves, inner = roof. Touching house tiles share one roof.
      p.rect(x, y, T, T, col, 1);
      const [rx, ry, rw, rh] = roofBox(x, y, T, nb, 0.07);
      p.rect(rx, ry, rw, rh, inn, 1);
      p.rect(rx, y + T * 0.5, rw, ry + rh - (y + T * 0.5), '#000000', 0.12);
      for (const f of [0.17, 0.33, 0.67, 0.83]) p.rect(rx, y + T * f, rw, Math.max(1, T * 0.025), mixHex(inn, '#000000', 0.2), 1);
      p.rect(rx, y + T * 0.47, rw, T * 0.06, mixHex(inn, '#ffffff', 0.28), 1);
      if (tileRand(c, r, 301) < 0.4) {
        p.rect(x + T * 0.64, y + T * 0.12, T * 0.16, T * 0.2, mixHex(col, '#000000', 0.25), 1);
        p.rect(x + T * 0.67, y + T * 0.15, T * 0.1, T * 0.14, '#1c1c1c', 1);
      }
      break;
    }
    case 'cabin': {
      // log walls: horizontal logs with round ends where the building stops
      p.rect(x, y, T, T, col, 1);
      for (let k = 0; k < 5; k++) {
        const ly = y + (k * T) / 5;
        const log = k % 2 ? mixHex(inn, '#000000', 0.12) : inn;
        const lx0 = nb.L ? x : x + T * 0.06;
        const lx1 = nb.R ? x + T : x + T * 0.94;
        p.rect(lx0, ly + T * 0.02, lx1 - lx0, T / 5 - T * 0.04, log, 1);
        p.rect(lx0, ly + T * 0.02, lx1 - lx0, T * 0.03, mixHex(log, '#ffffff', 0.18), 1);
        if (!nb.L) p.circle(x + T * 0.06, ly + T / 10, T * 0.07, mixHex(inn, '#ffffff', 0.25), 1);
        if (!nb.R) p.circle(x + T * 0.94, ly + T / 10, T * 0.07, mixHex(inn, '#ffffff', 0.25), 1);
      }
      if (tileRand(c, r, 302) < 0.3) p.rect(x + T * 0.66, y + T * 0.1, T * 0.15, T * 0.2, '#2a2a2a', 1);
      break;
    }
    case 'warehouse': {
      // flat corrugated roof with vents
      p.rect(x, y, T, T, col, 1);
      const [rx, ry, rw, rh] = roofBox(x, y, T, nb, 0.06);
      p.rect(rx, ry, rw, rh, inn, 1);
      for (let k = 0; k < 6; k++) p.line(x + (T * (k + 0.5)) / 6, ry, x + (T * (k + 0.5)) / 6, ry + rh, Math.max(1, T * 0.02), col, 0.5);
      if (tileRand(c, r, 303) < 0.45) {
        p.circle(x + T * 0.5, y + T * 0.5, T * 0.19, col, 1);
        p.circle(x + T * 0.5, y + T * 0.5, T * 0.14, mixHex(inn, '#000000', 0.25), 1);
        p.line(x + T * 0.38, y + T * 0.5, x + T * 0.62, y + T * 0.5, Math.max(1, T * 0.03), col, 1);
        p.line(x + T * 0.5, y + T * 0.38, x + T * 0.5, y + T * 0.62, Math.max(1, T * 0.03), col, 1);
      }
      if (!nb.D) p.rect(rx, y + T - T * 0.1, rw, T * 0.04, '#000000', 0.22);
      break;
    }
    case 'skyscraper': {
      // roof with stepped setbacks, plant boxes and an occasional helipad
      p.rect(x, y, T, T, col, 1);
      const [rx, ry, rw, rh] = roofBox(x, y, T, nb, 0.07);
      p.rect(rx, ry, rw, rh, inn, 1);
      const sx = nb.L ? x : x + T * 0.2;
      const sy = nb.U ? y : y + T * 0.2;
      const ex = nb.R ? x + T : x + T * 0.8;
      const ey = nb.D ? y + T : y + T * 0.8;
      p.rect(sx, sy, ex - sx, ey - sy, mixHex(inn, '#ffffff', 0.12), 1);
      p.rect(sx, sy, ex - sx, Math.max(1, T * 0.03), mixHex(inn, '#ffffff', 0.35), 1);
      if (tileRand(c, r, 304) < 0.25) {
        p.circle(x + T * 0.5, y + T * 0.5, T * 0.28, col, 1);
        p.circle(x + T * 0.5, y + T * 0.5, T * 0.23, mixHex(inn, '#ffffff', 0.18), 1);
        p.rect(x + T * 0.42, y + T * 0.42, T * 0.16, T * 0.16, col, 1);
      } else {
        p.rect(x + T * (0.3 + tileRand(c, r, 305) * 0.2), y + T * (0.3 + tileRand(c, r, 306) * 0.2), T * 0.22, T * 0.18, col, 1);
        p.circle(x + T * 0.72, y + T * 0.7, Math.max(1.5, T * 0.04), '#e53935', 1);
      }
      break;
    }
    case 'shop': {
      // flat roof with a striped awning along the front (bottom)
      p.rect(x, y, T, T, col, 1);
      const [rx, ry, rw, rh] = roofBox(x, y, T, nb, 0.06);
      p.rect(rx, ry, rw, rh, inn, 1);
      p.rect(x + T * 0.12, y + T * 0.18, T * 0.2, T * 0.16, mixHex(inn, '#000000', 0.25), 1);
      if (!nb.D) {
        for (let k = 0; k < 5; k++) p.rect(x + (T * k) / 5, y + T * 0.64, T / 5, T * 0.3, (c * 5 + k) % 2 ? '#f4f0e6' : col, 1);
        p.rect(x, y + T * 0.94, T, T * 0.06, '#000000', 0.25);
      }
      break;
    }
    case 'tent':
      p.rect(x, y, T, T, ground, 1);
      p.rect(x + T * 0.1, y + T * 0.14, T * 0.8, T * 0.72, '#000000', 0.18);
      p.rect(x + T * 0.08, y + T * 0.1, T * 0.8, T * 0.38, inn, 1);
      p.rect(x + T * 0.08, y + T * 0.48, T * 0.8, T * 0.38, mixHex(inn, '#000000', 0.18), 1);
      p.line(x + T * 0.08, y + T * 0.48, x + T * 0.88, y + T * 0.48, Math.max(1.5, T * 0.06), col, 1);
      for (const [gx, gy, hx, hy] of [[0.08, 0.48, 0.0, 0.3], [0.88, 0.48, 1.0, 0.3], [0.08, 0.86, 0.0, 0.98], [0.88, 0.86, 1.0, 0.98]]) {
        p.line(x + gx * T, y + gy * T, x + hx * T, y + hy * T, Math.max(1, T * 0.025), col, 0.7);
        p.circle(x + hx * T, y + hy * T, Math.max(1.2, T * 0.03), col, 1);
      }
      p.rect(x + T * 0.42, y + T * 0.62, T * 0.12, T * 0.24, mixHex(inn, '#000000', 0.45), 1);
      break;
    case 'ruins': {
      // broken wall stubs and scattered rubble
      p.rect(x, y, T, T, ground, 1);
      for (let k = 0; k < 2; k++) {
        const wx = x + T * (0.08 + tileRand(c, r, 310 + k) * 0.35);
        const wy = y + T * (0.12 + k * 0.45 + tileRand(c, r, 320 + k) * 0.1);
        const ww = T * (0.28 + tileRand(c, r, 330 + k) * 0.3);
        p.rect(wx + T * 0.02, wy + T * 0.03, ww, T * 0.15, '#000000', 0.25);
        p.rect(wx, wy, ww, T * 0.15, col, 1);
        p.rect(wx + T * 0.02, wy + T * 0.02, ww - T * 0.04, T * 0.08, inn, 1);
      }
      for (let k = 0; k < 7; k++) p.circle(x + (0.08 + tileRand(c, r, k + 340) * 0.84) * T, y + (0.08 + tileRand(c, r, k + 350) * 0.84) * T, T * (0.03 + tileRand(c, r, k + 360) * 0.05), k % 2 ? col : inn, 1);
      break;
    }
    case 'silo':
      p.rect(x, y, T, T, ground, 1);
      p.circle(x + T * 0.56, y + T * 0.58, T * 0.44, '#000000', 0.22);
      p.circle(x + T * 0.5, y + T * 0.5, T * 0.46, col, 1);
      p.circle(x + T * 0.5, y + T * 0.5, T * 0.38, inn, 1);
      p.circle(x + T * 0.5, y + T * 0.5, T * 0.26, mixHex(inn, '#000000', 0.12), 1);
      p.circle(x + T * 0.5, y + T * 0.5, T * 0.09, col, 1);
      p.line(x + T * 0.5, y + T * 0.5, x + T * 0.5 + T * 0.34, y + T * 0.5 - T * 0.2, Math.max(1, T * 0.04), col, 1);
      break;
    case 'ice': {
      p.rect(x, y, T, T, ground, 1);
      p.circle(x + T * 0.5, y + T * 0.55, T * 0.4, col, 0.85);
      for (let k = 0; k < 6; k++) {
        const a = -2.6 + k * 0.45 + (tileRand(c, r, 370 + k) - 0.5) * 0.3;
        const len = T * (0.28 + tileRand(c, r, 380 + k) * 0.18);
        p.line(x + T * 0.5, y + T * 0.6, x + T * 0.5 + Math.cos(a) * len, y + T * 0.6 + Math.sin(a) * len, Math.max(2, T * 0.1), k % 2 ? inn : mixHex(inn, '#ffffff', 0.3), 1);
      }
      p.circle(x + T * 0.4, y + T * 0.42, Math.max(1.5, T * 0.05), '#ffffff', 0.9);
      break;
    }
    case 'barricade': {
      // concrete barrier with hazard stripes; touching barricades run together
      p.rect(x, y, T, T, ground, 1);
      const bx0 = nb.L ? x : x + T * 0.08;
      const bx1 = nb.R ? x + T : x + T * 0.92;
      p.rect(bx0, y + T * 0.38, bx1 - bx0, T * 0.3, '#000000', 0.2);
      p.rect(bx0, y + T * 0.32, bx1 - bx0, T * 0.32, col, 1);
      for (let k = 0; k < 5; k++) {
        const sx = x + T * (0.02 + 0.2 * k);
        if (sx < bx0 || sx + T * 0.14 > bx1) continue;
        p.line(sx, y + T * 0.62, sx + T * 0.14, y + T * 0.34, Math.max(1.5, T * 0.07), (c * 5 + k) % 2 ? inn : col, 1);
      }
      p.rect(bx0, y + T * 0.32, bx1 - bx0, Math.max(1, T * 0.03), mixHex(col, '#ffffff', 0.3), 1);
      break;
    }
    default: // block
      p.rect(x, y, T, T, col, 1);
      p.rect(x + inset, y + inset, T - inset * 2, T - inset * 2, inn, 1);
  }
}

function drawGroundTile(p, z, x, y, T, c, r, ground, specLight, specDark) {
  p.rect(x, y, T, T, ground, 1);
  if (z.grassStyle === 'speckle') {
    for (let k = 0; k < 4; k++) {
      p.circle(x + (0.1 + tileRand(c, r, k + 20) * 0.8) * T, y + (0.1 + tileRand(c, r, k + 30) * 0.8) * T, Math.max(1, T * 0.035), k % 2 ? specLight : specDark, 1);
    }
  } else if (z.grassStyle === 'tiles') {
    const lw = Math.max(1, T * 0.025);
    p.line(x + T / 2, y, x + T / 2, y + T, lw, specDark, 0.45);
    p.line(x, y + T / 2, x + T, y + T / 2, lw, specDark, 0.45);
    p.line(x, y, x + T, y, lw, specDark, 0.45);
    p.line(x, y, x, y + T, lw, specDark, 0.45);
  } else if (z.grassStyle === 'stripes') {
    p.rect(x, y, T, T / 2, '#000000', 0.07);
  }
}

/**
 * Paints every tile of a level.
 * tiles: the level's rows ('.' open, '#' / '2'..'6' walls). pathSet: the path cells, a Set of "col,row" strings, or a Map
 * "col,row" -> path type (see levelPathMap) so each path can use a different one of the zone's path types.
 * (ox, oy): where tile (0,0) starts. T: tile size in pixels.
 */
function drawTerrain(p, zone, tiles, pathSet, ox, oy, T) {
  const z = zone && zone.walls ? zone : DEFAULT_ZONE;
  const paths = z.paths && z.paths.length ? z.paths : DEFAULT_ZONE.paths;
  const specLight = mixHex(z.grassA, '#ffffff', 0.14);
  const specDark = mixHex(z.grassA, '#000000', 0.2);
  const surfaces = pathSet instanceof Map ? pathSet : null;
  for (let r = 0; r < tiles.length; r++) {
    const row = tiles[r];
    for (let c = 0; c < row.length; c++) {
      const x = ox + c * T;
      const y = oy + r * T;
      const ground = (r + c) % 2 ? z.grassB : z.grassA;
      const wi = wallIndex(row[c]);
      const key = c + ',' + r;
      if (pathSet && pathSet.has(key)) drawPathTile(p, paths[(surfaces && surfaces.get(key)) || 0] || paths[0], pathSet, x, y, T, c, r);
      else if (wi >= 0) {
        const same = (cc, rr) => rr >= 0 && rr < tiles.length && tiles[rr][cc] === row[c] && !(pathSet && pathSet.has(cc + ',' + rr));
        const nb = { L: same(c - 1, r), R: same(c + 1, r), U: same(c, r - 1), D: same(c, r + 1) };
        drawWallTile(p, z.walls[wi] || z.walls[0], ground, x, y, T, c, r, nb);
      } else drawGroundTile(p, z, x, y, T, c, r, ground, specLight, specDark);
    }
  }
}

// Zombie looks. Everything is drawn from circles and lines through a "painter" (the same small interface the terrain uses),
// so the game (Phaser) and the Level Workshop (canvas) draw identical zombies, and sprites can replace this later.
//
//   look      the body plan: crawler, walker, runner, brute, armored, hazmat, king, screamer, leaper, necromancer, bird ('' = a plain shape)
//   colours   skin, clothes, detail (wounds, veins), set per enemy
//   variant   a reskin applied on top (snowy, muddy ...): a tint plus overlays like snow or moss. A zone or a level picks one.
//
// painter: circle(x, y, r, color, alpha), line(x1, y1, x2, y2, width, color, alpha)



const LOOKS = ['crawler', 'walker', 'runner', 'brute', 'armored', 'hazmat', 'king', 'screamer', 'leaper', 'necromancer', 'bird'];
/** Gear a variant can put on every zombie's head (parka hood, hard hat, straw hat ...). */
const OUTFITS = ['hood', 'hardhat', 'brimhat', 'beanie', 'helmet', 'hazmat', 'cap', 'scarf'];
/** Colour of the mark that shows a zombie's rank (rank 0 has none). */
const RANK_COLORS = ['', '#b0753a', '#c4ccd4', '#e0b83a', '#d83a3a'];
const EXTRAS = ['snow', 'frost', 'mud', 'moss', 'soot', 'blood', 'toxic', 'fungus', 'flesh', 'leaves', 'dust'];
/** Zombies are drawn a little larger than their hit circle so the details read. */
const ZOMBIE_SCALE = 1.35;
/** Variant id that forces the plain look (used by a level to cancel its zone's variant). */
const NO_VARIANT = 'none';
const DEFAULT_TINT = { color: '#ffffff', amount: 0 };

const HEX = /^#[0-9a-f]{6}$/i;
const hexOr = (v, d) => (typeof v === 'string' && HEX.test(v.trim()) ? v.trim().toLowerCase() : d);
const clamp01 = (n) => Math.max(0, Math.min(1, Number.isFinite(n) ? n : 0));

/** A variant with anything missing filled in. */
function normVariant(v) {
  v = v || {};
  const t = v.tint || {};
  return {
    id: String(v.id == null ? '' : v.id),
    name: v.name ? String(v.name) : String(v.id || 'Variant'),
    description: v.description ? String(v.description) : '',
    tint: { color: hexOr(t.color, DEFAULT_TINT.color), amount: clamp01(Number(t.amount)) },
    extras: Array.isArray(v.extras) ? v.extras.filter((x, i, a) => EXTRAS.includes(x) && a.indexOf(x) === i) : [],
    outfit: OUTFITS.includes(v.outfit) ? v.outfit : '',
    gear: hexOr(v.gear, ''),
  };
}

/**
 * The colours and overlays to draw an enemy with. `variants` is a map id -> variant.
 * Order: the enemy's own colours, then the variant's tint and overlays, then the enemy's own override for that variant (if it has one).
 */
function resolveLook(def, variantId, variants) {
  const skin0 = hexOr(def.color, '#7cb342');
  const out = {
    look: LOOKS.includes(def.look) ? def.look : '',
    skin: skin0,
    cloth: hexOr(def.clothes, mixHex(skin0, '#2b3340', 0.6)),
    detail: hexOr(def.detail, '#a3242b'),
    extras: [],
    outfit: '',
    gear: '',
  };
  const v = variantId && variantId !== NO_VARIANT && variants ? variants[variantId] : null;
  if (v) {
    const nv = normVariant(v);
    if (nv.tint.amount > 0) {
      out.skin = mixHex(out.skin, nv.tint.color, nv.tint.amount);
      out.cloth = mixHex(out.cloth, nv.tint.color, nv.tint.amount);
    }
    out.extras = nv.extras.slice();
    out.outfit = nv.outfit;
    out.gear = nv.gear;
  }
  const ov = variantId && def.variants ? def.variants[variantId] : null;
  if (ov) {
    if (ov.color) out.skin = hexOr(ov.color, out.skin);
    if (ov.clothes) out.cloth = hexOr(ov.clothes, out.cloth);
    if (ov.detail) out.detail = hexOr(ov.detail, out.detail);
    if (Array.isArray(ov.extras)) out.extras = ov.extras.filter((x) => EXTRAS.includes(x));
    if (ov.outfit !== undefined) out.outfit = OUTFITS.includes(ov.outfit) ? ov.outfit : ''; // '' = this zombie does not wear the variant's gear
    if (ov.gear) out.gear = hexOr(ov.gear, out.gear);
  }
  if (out.outfit && !out.gear) out.gear = '#8a8a8a';
  return out;
}

/** Which variant a level plays with: the level's own, else its zone's. 'none' on a level forces the plain look. */
function variantFor(level, zone) {
  const own = level && level.variant;
  if (own) return own === NO_VARIANT ? '' : own;
  return (zone && zone.variant) || '';
}

/** The direction an enemy is walking, in radians (screen coordinates). */
function zombieAngle(e) {
  const a = pointAt(e.path, e.d);
  const b = pointAt(e.path, e.d + 0.08);
  let dx = b[0] - a[0];
  let dy = b[1] - a[1];
  if (Math.abs(dx) + Math.abs(dy) < 1e-6) {
    const c = pointAt(e.path, Math.max(0, e.d - 0.08));
    dx = a[0] - c[0];
    dy = a[1] - c[1];
  }
  return dx || dy ? Math.atan2(dy, dx) : 0;
}

/** Walking pose from the distance travelled, so feet stop when the zombie is slowed or held. */
const zombiePhase = (e) => e.d * 3.4 + (e.id % 7);

// ---------- drawing ----------

function rng(seed) {
  let s = (seed >>> 0) + 0x9e3779b9;
  return () => {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** Draws in the zombie's own space: forward is +x, units are the zombie's radius. */
function pen(p, cx, cy, R, ang) {
  const c = Math.cos(ang);
  const s = Math.sin(ang);
  const X = (x, y) => cx + (x * c - y * s) * R;
  const Y = (x, y) => cy + (x * s + y * c) * R;
  return {
    dot: (x, y, r, col, a = 1) => p.circle(X(x, y), Y(x, y), Math.max(0.6, r * R), col, a),
    seg: (x1, y1, x2, y2, w, col, a = 1) => p.line(X(x1, y1), Y(x1, y1), X(x2, y2), Y(x2, y2), Math.max(1, w * R), col, a),
    limb(x1, y1, x2, y2, w, col, a = 1) {
      this.seg(x1, y1, x2, y2, w, col, a);
      this.dot(x1, y1, w / 2, col, a);
      this.dot(x2, y2, w / 2, col, a);
    },
  };
}

const shade = (c, k) => mixHex(c, '#000000', k);
const light = (c, k) => mixHex(c, '#ffffff', k);

/** Standing zombies share one body; the parameters change the build. Returns where overlays can go. */
function humanoid(q, pal, ph, P) {
  const s1 = Math.sin(ph);
  const legC = shade(pal.cloth, 0.3);
  // legs and feet
  for (const s of [-1, 1]) {
    const fx = P.tx - 0.28 + P.stride * Math.sin(ph + (s > 0 ? 0 : Math.PI));
    q.limb(P.tx - 0.1, s * P.legY * 0.8, fx, s * P.legY, P.legW, legC);
    q.dot(fx, s * P.legY, P.footR, P.boot || shade(pal.skin, 0.35));
  }
  // torso and shoulders
  q.dot(P.tx, 0, P.torso, pal.cloth);
  q.dot(P.tx, -P.sh * 0.55, P.torso * 0.82, pal.cloth);
  q.dot(P.tx, P.sh * 0.55, P.torso * 0.82, pal.cloth);
  // arms reaching forward
  for (const s of [-1, 1]) {
    const swing = Math.sin(ph + (s > 0 ? 0 : Math.PI)) * P.armSwing;
    const sx = P.sx;
    const sy = s * P.sh;
    const ex = sx + P.armLen * 0.5 + swing * 0.4;
    const ey = s * (P.sh + 0.12);
    const hx = sx + P.armLen + swing * 0.5;
    const hy = s * (P.sh * 0.72) + swing * 0.12;
    q.dot(sx, sy, P.shR, pal.cloth);
    q.limb(sx, sy, ex, ey, P.armW, pal.cloth);
    q.limb(ex, ey, hx, hy, P.armW * 0.85, P.sleeve || pal.skin);
    q.dot(hx, hy, P.handR, P.glove || light(pal.skin, 0.06));
    if (P.claws) for (const a of [-0.35, 0, 0.35]) q.seg(hx, hy, hx + 0.32 * Math.cos(a), hy + 0.32 * Math.sin(a) + s * 0.04, 0.05, '#e8e4d4');
  }
  // head
  if (P.hair !== false) q.dot(P.hx - 0.07, 0, P.hr * 0.95, shade(pal.skin, 0.55), 0.9);
  q.dot(P.hx, 0, P.hr, pal.skin);
  if (P.hair !== false) q.dot(P.hx - 0.1, s1 * 0.04, P.hr * 0.6, shade(pal.skin, 0.62), 0.85);
  for (const s of [-1, 1]) q.dot(P.hx + P.hr * 0.72, s * P.hr * 0.38, 0.06, P.eye || '#efe56a');
  // wounds
  q.dot(P.tx - 0.04, P.torso * 0.35, 0.1, pal.detail, 0.95);
  q.dot(P.hx + 0.02, -P.hr * 0.55, 0.07, pal.detail, 0.9);
  if (P.scars) for (const s of [-1, 1]) q.seg(P.tx - 0.25, s * 0.25, P.tx + 0.15, s * 0.5, 0.05, pal.detail, 0.9);
  return {
    head: [P.hx, 0, P.hr],
    parts: [[P.tx, 0, P.torso], [P.sx, -P.sh, P.shR], [P.sx, P.sh, P.shR], [P.tx, -P.sh * 0.55, P.torso * 0.8], [P.tx, P.sh * 0.55, P.torso * 0.8]],
  };
}

/** Gear worn on the head (and sometimes the body): a variant puts it on every zombie, and a zombie can opt out. */
function outfit(q, name, gear, A) {
  const [hx, hy, hr] = A.head;
  const dark = shade(gear, 0.3);
  const lite = light(gear, 0.3);
  const eyes = () => { for (const s of [-1, 1]) q.dot(hx + hr * 0.72, hy + s * hr * 0.38, 0.05, '#efe56a'); };
  switch (name) {
    case 'hood':
      q.dot(hx - 0.06, hy, hr * 1.2, dark);
      q.dot(hx - 0.04, hy, hr * 1.1, gear);
      q.dot(hx + hr * 0.42, hy, hr * 0.58, A.skin || '#9a9a7a');
      for (let k = -4; k <= 4; k++) { const a = k * 0.3; q.dot(hx + hr * 0.38 + hr * 0.7 * Math.cos(a), hy + hr * 0.7 * Math.sin(a), 0.075, '#f4f1ea'); }
      break;
    case 'hardhat':
      q.dot(hx - 0.02, hy, hr * 1.02, dark);
      q.dot(hx - 0.02, hy, hr * 0.9, gear);
      q.seg(hx - hr * 0.75, hy, hx + hr * 0.7, hy, 0.07, lite, 0.9);
      q.dot(hx + hr * 0.85, hy, hr * 0.42, dark);
      break;
    case 'brimhat':
      q.dot(hx, hy, hr * 1.75, dark, 0.95);
      q.dot(hx, hy, hr * 1.62, gear, 0.97);
      q.dot(hx, hy, hr * 0.85, dark);
      q.dot(hx, hy, hr * 0.74, lite);
      break;
    case 'beanie':
      q.dot(hx - 0.02, hy, hr * 1.0, dark);
      q.dot(hx - 0.02, hy, hr * 0.88, gear);
      q.dot(hx - 0.02, hy, 0.1, lite);
      break;
    case 'helmet':
      q.dot(hx - 0.02, hy, hr * 1.08, shade(gear, 0.4));
      q.dot(hx - 0.02, hy, hr * 0.98, gear);
      q.seg(hx - hr * 0.8, hy - hr * 0.5, hx + hr * 0.8, hy + hr * 0.5, 0.04, dark, 0.9);
      q.seg(hx - hr * 0.8, hy + hr * 0.5, hx + hr * 0.8, hy - hr * 0.5, 0.04, dark, 0.9);
      q.dot(hx + hr * 0.7, hy, hr * 0.3, dark, 0.9);
      break;
    case 'hazmat':
      for (const pt of A.parts) q.dot(pt[0], pt[1], pt[2] * 0.95, gear, 0.6);
      q.dot(hx - 0.02, hy, hr * 1.2, dark);
      q.dot(hx - 0.02, hy, hr * 1.1, gear);
      q.dot(hx + hr * 0.45, hy, hr * 0.62, '#12302e', 0.95);
      q.dot(hx + hr * 0.4, hy - hr * 0.22, hr * 0.2, '#8fe8d8', 0.6);
      q.dot(hx + hr * 0.98, hy + hr * 0.35, 0.1, '#3a3d40');
      break;
    case 'cap':
      q.dot(hx - 0.02, hy, hr * 0.95, dark);
      q.dot(hx - 0.02, hy, hr * 0.84, gear);
      q.seg(hx + hr * 0.45, hy, hx + hr * 1.2, hy, 0.22, dark);
      break;
    case 'scarf':
      for (let k = 0; k < 7; k++) { const a = 2.0 + k * 0.38; q.dot(hx + hr * 0.9 * Math.cos(a), hy + hr * 0.9 * Math.sin(a), 0.11, k % 2 ? gear : dark); }
      q.limb(hx - hr * 0.8, hy + 0.1, hx - hr * 1.7, hy + 0.34, 0.12, gear);
      q.limb(hx - hr * 0.8, hy + 0.1, hx - hr * 1.6, hy - 0.05, 0.1, dark);
      break;
    default:
  }
  if (name === 'hood' || name === 'hazmat') eyes();
}

/** Overlays that make a variant: snow, mud, moss and so on, scattered over the body (steady for a given seed). */
function overlay(q, name, A, rnd) {
  const [hx, hy, hr] = A.head;
  const spot = () => {
    const pt = A.parts[Math.floor(rnd() * A.parts.length)];
    const a = rnd() * 6.283;
    const d = Math.sqrt(rnd()) * pt[2] * 0.8;
    return [pt[0] + Math.cos(a) * d, pt[1] + Math.sin(a) * d, pt];
  };
  const each = (n, fn) => { for (let i = 0; i < n; i++) { const [x, y, pt] = spot(); fn(x, y, pt, i); } };
  switch (name) {
    case 'snow':
      q.dot(hx - 0.05, hy, hr * 0.8, '#f2f8fc', 0.96);
      q.dot(hx + 0.06, hy - hr * 0.3, hr * 0.28, '#ffffff');
      for (const pt of A.parts) q.dot(pt[0] - pt[2] * 0.15, pt[1], pt[2] * 0.52, '#eef5fa', 0.92);
      each(6, (x, y) => q.dot(x, y, 0.04 + rnd() * 0.04, '#ffffff'));
      break;
    case 'frost':
      for (const pt of A.parts) q.dot(pt[0], pt[1], pt[2] * 0.9, '#a8dcf5', 0.28);
      q.dot(hx, hy, hr * 0.9, '#a8dcf5', 0.3);
      each(5, (x, y) => q.dot(x, y, 0.06, '#e2f6ff', 0.95));
      each(5, (x, y) => { const a = rnd() * 6.283; q.seg(x, y, x + Math.cos(a) * 0.2, y + Math.sin(a) * 0.2, 0.05, '#aee4ff', 0.95); });
      break;
    case 'mud':
      each(8, (x, y) => q.dot(x, y, 0.07 + rnd() * 0.1, rnd() < 0.5 ? '#6b4a2b' : '#4f3820', 0.92));
      q.dot(hx - 0.05, hy + hr * 0.3, hr * 0.28, '#5a3f24', 0.9);
      break;
    case 'moss':
      each(5, (x, y) => { q.dot(x, y, 0.12 + rnd() * 0.06, '#4f8a3a', 0.92); q.dot(x + 0.03, y - 0.03, 0.06, '#86c85e'); });
      q.dot(hx - 0.1, hy + hr * 0.4, hr * 0.38, '#4f8a3a', 0.9);
      break;
    case 'soot':
      each(5, (x, y) => q.dot(x, y, 0.14 + rnd() * 0.08, '#1b1b1d', 0.55));
      q.dot(hx, hy, hr * 0.7, '#1b1b1d', 0.4);
      each(3, (x, y) => { q.dot(x, y, 0.08, '#ff7a1a', 0.3); q.dot(x, y, 0.035, '#ffc24a'); });
      break;
    case 'blood':
      each(7, (x, y) => q.dot(x, y, 0.06 + rnd() * 0.08, rnd() < 0.6 ? '#8f1c1c' : '#c62828', 0.95));
      each(2, (x, y) => q.seg(x, y, x + 0.05, y + 0.2, 0.04, '#8f1c1c', 0.9));
      q.dot(hx + hr * 0.5, hy, hr * 0.3, '#8f1c1c', 0.9);
      break;
    case 'toxic':
      each(5, (x, y) => { q.dot(x, y, 0.16, '#9be32a', 0.3); q.dot(x, y, 0.06, '#d2ff6a'); });
      each(2, (x, y) => q.seg(x, y, x, y + 0.2, 0.05, '#7ac11a', 0.9));
      q.dot(hx, hy, hr, '#9be32a', 0.22);
      break;
    case 'fungus':
      each(3, (x, y) => {
        q.seg(x, y, x - 0.08, y - 0.06, 0.05, '#e8dcc8');
        q.dot(x - 0.1, y - 0.07, 0.1, '#a860e8');
        q.dot(x - 0.12, y - 0.09, 0.035, '#e6ccff');
      });
      each(5, (x, y) => q.dot(x, y, 0.03, '#4af0d0', 0.85));
      break;
    case 'flesh':
      each(3, (x, y) => {
        const a = rnd() * 6.283;
        const mx = x + Math.cos(a) * 0.2;
        const my = y + Math.sin(a) * 0.2;
        q.seg(x, y, mx, my, 0.07, '#c04a6a');
        q.seg(mx, my, mx + Math.cos(a + 0.9) * 0.15, my + Math.sin(a + 0.9) * 0.15, 0.05, '#c04a6a');
      });
      each(3, (x, y) => q.dot(x, y, 0.09, '#d86a82'));
      break;
    case 'leaves': {
      const cols = ['#d9822b', '#b8501c', '#e0b83a', '#9a3a1c'];
      each(6, (x, y, pt, i) => q.dot(x, y, 0.05 + rnd() * 0.04, cols[i % 4]));
      q.dot(hx - 0.04, hy - hr * 0.3, 0.07, cols[0]);
      q.dot(hx + 0.04, hy + hr * 0.3, 0.06, cols[2]);
      break;
    }
    case 'dust':
      each(5, (x, y) => q.dot(x, y, 0.12 + rnd() * 0.08, '#d8c08a', 0.45));
      q.dot(hx - 0.05, hy, hr * 0.8, '#d8c08a', 0.35);
      break;
    default:
  }
}

/**
 * Draws one zombie. `pal` comes from resolveLook(). Options: angle (radians, facing), phase (walking pose), seed (keeps
 * the overlays steady), flying (a larger, softer shadow), lift (0 to 1, a leap: the body rises off its shadow),
 * fx (0 to 1, a screamer's sound waves), rank (0 to 4, draws the rank mark).
 */
function drawZombie(p, pal, cx, cy, R, o = {}) {
  const ang = o.angle || 0;
  const lift = Math.max(0, Math.min(1, o.lift || 0));
  const rank = o.rank || 0;
  if (rank > 0 && RANK_COLORS[rank]) {
    const rc = RANK_COLORS[rank];
    p.circle(cx, cy + R * 0.1, R * 1.3, rc, 0.22);
    p.circle(cx, cy + R * 0.1, R * 1.05, rc, 0.16);
  }
  p.circle(cx + R * (o.flying ? 0.35 : 0.08), cy + R * (o.flying ? 0.7 : 0.14), R * (o.flying ? 0.6 : 0.85) * (1 - lift * 0.25), '#000000', (o.flying ? 0.2 : 0.22) * (1 - lift * 0.4));
  const by = cy - lift * R * 0.9;
  const RR = R * (1 + lift * 0.22);
  const q = pen(p, cx, by, RR, ang);
  const draw = LOOK_DRAW[pal.look];
  let A;
  if (draw) A = draw(q, pal, o.phase == null ? 0.7 : o.phase, { fx: o.fx || 0, lift });
  else {
    q.dot(0, 0, 0.8, pal.skin);
    A = { head: [0.2, 0, 0.4], parts: [[0, 0, 0.8]] };
  }
  A.skin = pal.skin;
  if (pal.outfit && pal.gear && !(pal.look === 'armored' || pal.look === 'hazmat' || pal.look === 'king' || pal.look === 'necromancer') && !(pal.look === 'screamer' && (pal.outfit === 'hood' || pal.outfit === 'hazmat'))) outfit(q, pal.outfit, pal.gear, A);
  if (pal.extras && pal.extras.length) {
    const rnd = rng((o.seed || 1) * 7919);
    for (const x of pal.extras) overlay(q, x, A, rnd);
  }
  if (rank > 0 && RANK_COLORS[rank]) {
    // one pip per rank under the zombie
    for (let i = 0; i < rank; i++) {
      const px = cx + (i - (rank - 1) / 2) * R * 0.42;
      p.circle(px, cy + R * 1.28, R * 0.16, '#101418', 0.9);
      p.circle(px, cy + R * 1.28, R * 0.11, RANK_COLORS[rank], 1);
    }
  }
}

// Tower looks. Every tower is a small operator (or a machine) drawn from circles and lines through a "painter"
// (the same tiny interface the terrain and zombies use), so the game (Phaser) and the Level Workshop (canvas) draw the same thing.
//
//   look      the design: marksman, sniper, demolitionist, flamethrower, toxicologist, minigunner, scrapper, tesla
//             ('' = a plain coloured shape, so towers made in the editor still work)
//   color     the main colour of the uniform / casing
//   tiers     [path 0, path 1, path 2]: bought upgrades show up on the model (scopes, bigger tanks, more barrels ...)
//
// painter: circle(x, y, r, color, alpha), line(x1, y1, x2, y2, width, color, alpha)


const TOWER_LOOKS = ['marksman', 'sniper', 'demolitionist', 'flamethrower', 'toxicologist', 'minigunner', 'scrapper', 'tesla'];

const tShade = (c, k) => mixHex(c, '#000000', k);
const tLight = (c, k) => mixHex(c, '#ffffff', k);
const T_HEX = /^#[0-9a-f]{6}$/i;
const T_SKIN = '#e0b48c';
const T_BLACK = '#1d2127';
const T_METAL = '#59636e';
const T_STEEL = '#9aa5b0';
const T_BRASS = '#d8ae3c';

/** Draws in the tower's own space: forward is +x, units are the tower's radius. */
function tPen(p, cx, cy, R, ang) {
  const c = Math.cos(ang);
  const s = Math.sin(ang);
  const X = (x, y) => cx + (x * c - y * s) * R;
  const Y = (x, y) => cy + (x * s + y * c) * R;
  return {
    dot: (x, y, r, col, a = 1) => p.circle(X(x, y), Y(x, y), Math.max(0.6, r * R), col, a),
    seg: (x1, y1, x2, y2, w, col, a = 1) => p.line(X(x1, y1), Y(x1, y1), X(x2, y2), Y(x2, y2), Math.max(1, w * R), col, a),
    limb(x1, y1, x2, y2, w, col, a = 1) {
      this.seg(x1, y1, x2, y2, w, col, a);
      this.dot(x1, y1, w / 2, col, a);
      this.dot(x2, y2, w / 2, col, a);
    },
    // a rounded bar: a thick line with round ends
    bar(x1, y1, x2, y2, w, col, a = 1) {
      this.limb(x1, y1, x2, y2, w, col, a);
    },
  };
}

/** A hard-looking tRing of dots around the tower in world space (sandbags, drums, insulators ...). */
function tRing(p, cx, cy, R, n, rad, r, col, rim, from = 0, span = Math.PI * 2) {
  for (let i = 0; i < n; i++) {
    const a = from + (span * i) / Math.max(1, n - (span >= Math.PI * 2 ? 0 : 1));
    const x = cx + Math.cos(a) * rad * R;
    const y = cy + Math.sin(a) * rad * R;
    p.circle(x, y + R * 0.04, r * R, rim, 0.9);
    p.circle(x, y, r * R * 0.82, col, 1);
  }
}

function tDisc(p, cx, cy, R, col, a = 1, k = 1.18) {
  p.circle(cx + R * 0.06, cy + R * 0.12, R * k, '#000000', 0.2 * a);
  p.circle(cx, cy, R * k, col, a);
}

const tFlash = (q, x, y, size, kick, col = '#ffe08a') => {
  if (kick < 0.45) return;
  q.dot(x, y, size * kick, col, 0.9);
  q.dot(x, y, size * 0.5 * kick, '#ffffff', 1);
  for (const a of [-0.5, 0, 0.5]) q.seg(x, y, x + Math.cos(a) * size * 1.6 * kick, y + Math.sin(a) * size * 1.6 * kick, 0.07, col, 0.8);
};

// ---------- the soldier everybody shares ----------

/** Shoulders, torso, tHelmet. `P` tunes the build; `hands` are drawn by each look. Returns nothing. */
function tBody(q, c, P = {}) {
  const t = P.torso || 0.46;
  const sh = P.sh || 0.5;
  if (P.pack !== false) q.dot(-0.62, 0, P.packR || 0.34, tShade(c.main, 0.4));
  q.dot(-0.12, 0, t, c.main);
  q.dot(-0.1, -sh, P.shR || 0.27, c.main);
  q.dot(-0.1, sh, P.shR || 0.27, c.main);
  q.dot(-0.1, -sh, (P.shR || 0.27) * 0.55, tLight(c.main, 0.12));
  q.dot(-0.1, sh, (P.shR || 0.27) * 0.55, tLight(c.main, 0.12));
}

function tHelmet(q, c, x = 0.1, r = 0.36, col) {
  const h = col || tShade(c.main, 0.25);
  q.dot(x, -r * 0.95, 0.07, T_SKIN);
  q.dot(x, r * 0.95, 0.07, T_SKIN);
  q.dot(x, 0, r, h);
  q.dot(x - 0.04, 0, r * 0.62, tLight(h, 0.14));
  q.seg(x - r * 0.1, -r * 0.7, x - r * 0.1, r * 0.7, 0.06, tShade(h, 0.4), 0.7);
}

    const tw = lv[0] >= 4 ? 0.46 : 0.36;
    const tanks = lv[0] >= 2 ? [-0.3, 0, 0.3] : [-0.22, 0.22];
    for (const y of tanks) {
      q.seg(-1.0, y, -0.3, y, tw, '#9e2b17');

    q.seg(-0.3, 0.1, 0.3, 0.42, 0.09, '#1e2226');

    const jets = lv[2] >= 4 ? 3 : lv[2] >= 2 ? 2 : lv[2] >= 1 ? 2 : 1;
    const reach = 0.11 * (lv[2] || 0) + (lv[0] >= 1 ? 0.06 : 0);

      q.seg(0.15 - rec, y, tipX, y, 0.17, '#2d3238');

    }
    q.limb(-0.1, 0.52, 0.28, 0.38, 0.2, c.main);
    q.dot(0.28, 0.38, 0.11, '#3b3f44');
    q.limb(-0.1, -0.52, 0.6, -0.04, 0.2, c.main);
    q.dot(0.6, -0.04, 0.11, '#3b3f44');
    // gas mask
    tHelmet(q, c, 0.08, 0.36, '#4a4f55');
    q.dot(0.4, 0, 0.17, '#2b2f33');
    q.dot(0.52, 0, 0.09, '#555b62');
    q.dot(0.3, -0.16, 0.1, '#ffcf66');
    q.dot(0.3, 0.16, 0.1, '#ffcf66');
    q.seg(0.4, 0.1, -0.2, 0.2, 0.06, '#1e2226', 0.9);
  },

  toxicologist(q, c, o) {
    const lv = o.tiers;
    // a glow that gets stronger with the potency path
    if (lv[0] >= 2) q.dot(0, 0, 1.5, '#9ccc3c', 0.1 + 0.03 * lv[0]);
    tBody(q, c, { torso: 0.46, packR: 0.1, pack: false });
    // tank with bubbling green liquid
    q.dot(-0.7, 0, 0.5, '#2d4a24');
    q.dot(-0.7, 0, 0.4, '#6fae2d');
    for (const [x, y, r] of [[-0.62, -0.14, 0.09], [-0.8, 0.12, 0.07], [-0.55, 0.16, 0.06]]) q.dot(x, y, r, '#d4f58a', 0.9);
    q.seg(-0.4, 0.16, 0.25, 0.4, 0.07, '#222', 0.9);
    // belt of vials

    // arms: the flask is held forward until it is thrown

      q.dot(fx, fy, 0.25 + big, '#cfe8a0', 0.55);

    q.dot(0.52, 0, 0.1, '#3a3a3a');
    q.dot(0.42, -0.24, 0.09, '#9a9a9a');

  minigunner(q, c, o) {
    const lv = o.tiers;
    const rec = o.kick * 0.1;
    tBody(q, c, { torso: 0.56, shR: 0.34, sh: 0.58, packR: 0.1, pack: false });

    q.dot(-0.78, 0, 0.52, '#2c333a');
    q.dot(-0.78, 0, 0.4, '#4a545e');
    q.dot(-0.78, 0, 0.14, T_BRASS);
    q.seg(-0.5, 0.24, 0.2, 0.34, 0.13, lv[0] >= 3 ? '#b6c2cc' : T_BRASS, 0.95);

    if (lv[2] >= 3) {
      for (const s of [-1, 1]) {

    // the gun: a housing and a spinning bundle of barrels
    const n = 3 + (lv[1] >= 3 ? 1 : 0) + (lv[1] >= 4 ? 1 : 0) + (lv[1] >= 5 ? 1 : 0);

    q.seg(0.08 - rec, -0.12, 0.7 - rec, -0.12, 0.08, '#4a545e');

      const y = Math.sin(a) * rad;
      const shade2 = 0.2 + 0.25 * (Math.cos(a) * 0.5 + 0.5);
      q.seg(0.8 - rec, y, len, y, 0.1, tLight(T_METAL, shade2 * 0.6));

    q.seg(1.0 - rec, -rad - 0.05, 1.0 - rec, rad + 0.05, 0.07, '#1f252b');
    q.seg(len - 0.04, -rad - 0.05, len - 0.04, rad + 0.05, 0.07, '#1f252b');

    q.limb(-0.1, -0.58, 0.55 - rec, -0.34, 0.22, c.main);

    q.seg(0.32, -0.12, 0.32, 0.12, 0.04, '#6fb3d6', 0.7);

  scrapper(q, c, o, p, cx, cy, R) {
    const lv = o.tiers;
    const k = o.kick;
    // the worker (he mostly faces up the road)
    tBody(q, c, { torso: 0.46, packR: 0.1, pack: false });
    q.dot(-0.55, 0, 0.36, '#4a3d2e');

    q.limb(-0.1, -0.5, 0.35, -0.32, 0.2, tShade(c.main, 0.15));
    q.dot(0.35, -0.32, 0.11, T_SKIN);
    // cap with goggles pushed up
    q.dot(0.08, -0.33, 0.07, T_SKIN);
    q.dot(0.08, 0.33, 0.07, T_SKIN);
    q.dot(0.08, 0, 0.37, '#3b4048');
    q.dot(0.02, 0, 0.24, '#4a525c');
    q.seg(0.4, -0.22, 0.4, 0.22, 0.09, '#2a2e33');
    q.dot(0.2, -0.13, 0.09, '#d8c46a');
    q.dot(0.2, 0.13, 0.09, '#d8c46a');
    // the scrap cart beside him: the pile grows with the salvage path
    const cxl = 0.15;

    const show = 4 + Math.min(5, lv[0]);
    pile.slice(0, show).forEach(([x, y, r, col]) => q.dot(cxl + x, cyl + y * 0.7, r, col));
    if (lv[0] >= 4) for (const [x, y] of [[0.1, 0.0], [-0.25, -0.05], [0.35, 0.1]]) q.dot(cxl + x, cyl + y, 0.12, T_BRASS);
    if (lv[0] >= 5) q.dot(cxl, cyl, 0.32, T_BRASS, 0.55);
    // logistics: a conveyor and a crane
    if (lv[1] >= 2) {
      q.seg(cxl + 0.9, cyl - 0.1, cxl + 1.5, cyl - 0.5, 0.22, '#3a3f46');
      for (let i = 0; i < 3; i++) q.dot(cxl + 1.0 + i * 0.2, cyl - 0.18 - i * 0.13, 0.05, T_STEEL);
    }
    if (lv[1] >= 4) {
      q.seg(cxl - 0.9, cyl + 0.4, cxl - 0.2, cyl - 0.9, 0.12, '#e8a317');
      q.dot(cxl - 0.2, cyl - 0.9, 0.12, '#222');
    }
    // scavenging: loot sack, dog tags, a lamp
    if (lv[2] >= 1) q.dot(-0.9, 0.9, 0.3, '#8a7a5a');
    if (lv[2] >= 1) q.dot(-0.9, 0.7, 0.1, '#6a5a3a');
    if (lv[2] >= 3) for (let i = 0; i < 3; i++) q.dot(-0.3 + i * 0.16, 0.62, 0.05, '#d9d9d9');
    if (lv[2] >= 4) {
      q.dot(0.9, 0.95, 0.18, '#444');
      q.dot(0.9, 0.95, 0.1, '#ffe08a');
    }
    // coins pop out when he gets paid
    if (k > 0) for (let i = 0; i < 4; i++) q.dot(cxl - 0.3 + i * 0.25, cyl - 0.4 - k * (0.5 + 0.2 * i), 0.1, T_BRASS, k);

  tesla(q, c, o, p, cx, cy, R) {
    const lv = o.tiers;
    const k = o.kick;
    const charge = Math.max(k, 0.25 + 0.12 * Math.sin(o.t * 6));
    // satellite pylons: one per conductor tier
    const sat = Math.min(4, lv[1]);
    for (let i = 0; i < sat; i++) {
      const a = Math.PI / 4 + (i * Math.PI) / 2;
      const x = Math.cos(a) * 1.2;
      const y = Math.sin(a) * 1.2;
      q.dot(x, y, 0.2, '#353c46');
      q.dot(x, y, 0.13, '#b87333');
      q.dot(x, y, 0.07, tLight('#7fd0ff', k * 0.6), 1);
      q.seg(x * 0.8, y * 0.8, x * 0.4, y * 0.4, 0.04, '#7fd0ff', 0.35 + 0.4 * k);
    }
    // base, windings, toroid
    q.dot(0, 0, 0.98, '#2c323b');
    q.dot(0, 0, 0.9, '#3d4652');
    const rings = 3 + Math.min(3, lv[0]);
    for (let i = 0; i < rings; i++) q.dot(0, 0, 0.82 - i * 0.1, i % 2 ? '#8a5428' : '#c88441');
    q.dot(0, 0, 0.82 - rings * 0.1, '#2a2f37');
    // electrodes (more speed tiers: more of them)
    const prongs = 4 + Math.min(4, lv[2]);
    for (let i = 0; i < prongs; i++) {
      const a = o.t * 0.6 + (i * Math.PI * 2) / prongs;
      q.seg(Math.cos(a) * 0.3, Math.sin(a) * 0.3, Math.cos(a) * 0.62, Math.sin(a) * 0.62, 0.07, T_STEEL);
      q.dot(Math.cos(a) * 0.64, Math.sin(a) * 0.64, 0.07, tLight('#7fd0ff', charge * 0.5));
    }
    q.dot(0, 0, 0.34, '#8d98a4');
    q.dot(0, 0, 0.26, tLight('#9fdcff', charge * 0.7));
    q.dot(-0.07, -0.08, 0.1, '#ffffff', 0.9);
    if (k > 0.3) q.dot(0, 0, 1.1 * k + 0.4, '#7fd0ff', 0.18 * k);
    // idle crackle
    const f = Math.floor(o.t * 11);
    for (let i = 0; i < 2; i++) {
      const a = f * 2.4 + i * 3.1;
      q.seg(0, 0, Math.cos(a) * 0.85, Math.sin(a) * 0.85, 0.04, '#bfe9ff', 0.45);
    }
  },
};

/** Base each design stands on, in world space (not rotated). */
const TPAD = {
  marksman(p, cx, cy, R, c) {
    tDisc(p, cx, cy, R, '#313829', 0.9, 1.15);
    tRing(p, cx, cy, R, 11, 1.05, 0.24, '#a39868', '#5e5638');
  },
  sniper(p, cx, cy, R, c) {
    tDisc(p, cx, cy, R, '#2f3627', 0.9, 1.15);
    tRing(p, cx, cy, R, 7, 1.1, 0.26, '#9a8f63', '#5a5236', Math.PI * 0.65, Math.PI * 1.25);
    tRing(p, cx, cy, R, 7, 1.1, 0.26, '#9a8f63', '#5a5236', -Math.PI * 0.6, Math.PI * 1.2);
  },
  demolitionist(p, cx, cy, R, c) {
    tDisc(p, cx, cy, R, '#2a2c30', 0.95, 1.15);
    for (let i = 0; i < 14; i++) {
      const a = (i * Math.PI * 2) / 14;
      p.circle(cx + Math.cos(a) * R * 1.07, cy + Math.sin(a) * R * 1.07, R * 0.13, i % 2 ? '#e6b800' : '#1b1b1b', 1);
    }
  },
  flamethrower(p, cx, cy, R, c) {
    tDisc(p, cx, cy, R, '#241f1c', 0.95, 1.15);
    p.circle(cx, cy, R * 0.95, '#3a2a20', 0.5);
    tRing(p, cx, cy, R, 4, 1.06, 0.22, '#8a2a1a', '#4a1710', Math.PI * 0.25, Math.PI * 1.5);
  },
  toxicologist(p, cx, cy, R, c) {
    tDisc(p, cx, cy, R, '#26331d', 0.95, 1.15);
    p.circle(cx + R * 0.1, cy + R * 0.05, R * 0.92, '#4a7a2a', 0.35);
    for (const [a, r] of [[0.4, 0.12], [1.9, 0.09], [3.3, 0.11], [4.6, 0.08], [5.6, 0.1]]) p.circle(cx + Math.cos(a) * R * 1.0, cy + Math.sin(a) * R * 1.0, r * R, '#b8f06c', 0.8);
  },
  minigunner(p, cx, cy, R, c) {
    tDisc(p, cx, cy, R, '#2b3138', 0.95, 1.15);
    tRing(p, cx, cy, R, 8, 1.07, 0.15, '#5a6672', '#242a30');
    tRing(p, cx, cy, R, 3, 0.9, 0.2, '#6a5a2a', '#3a3015', Math.PI * 0.85, Math.PI * 0.6);
  },
  scrapper(p, cx, cy, R, c) {
    tDisc(p, cx, cy, R, '#3a3226', 0.95, 1.18);
    for (const [a, r, col] of [[0.5, 0.1, '#7a7f86'], [1.6, 0.08, '#a56a3a'], [2.7, 0.1, '#5e646b'], [3.9, 0.09, '#8a5a30'], [5.1, 0.1, '#8a8f96'], [5.8, 0.07, '#b1b6bd']]) p.circle(cx + Math.cos(a) * R * 1.05, cy + Math.sin(a) * R * 1.05, r * R, col, 1);
  },
  tesla(p, cx, cy, R, c) {
    tDisc(p, cx, cy, R, '#2b3139', 0.95, 1.3);
    tRing(p, cx, cy, R, 8, 1.28, 0.1, '#d8dde2', '#6a737d');
  },
};

/** True when `look` is a design this file can draw. */
const hasTowerLook = (look) => TOWER_LOOKS.includes(look);

/**
 * Draws one tower. Returns false (and draws nothing) when the tower has no design, so the caller can draw its plain shape instead.
 * o: angle (radians, where it is aiming), kick (1 right after firing, down to 0), tiers [a, b, c], heat (0..1, a spin-up gun),
 *    t (seconds, for little animations), pad (false = leave the base out, for small icons)
 */
function drawTower(p, def, cx, cy, R, o = {}) {
  const look = def && def.look;
  if (!hasTowerLook(look)) return false;
  const main = def.color && T_HEX.test(def.color) ? def.color.toLowerCase() : '#8a9a5b';
  const c = { main };
  const opts = {
    kick: Math.max(0, Math.min(1, o.kick || 0)),
    tiers: [0, 1, 2].map((i) => (o.tiers && o.tiers[i]) || 0),
    heat: Math.max(0, Math.min(1, o.heat || 0)),
    t: o.t || 0,
  };
  if (o.pad !== false && TPAD[look]) TPAD[look](p, cx, cy, R, c);
  // machines and workers that do not aim keep a fixed pose
  const fixed = look === 'scrapper' ? -0.7 : look === 'tesla' ? 0 : null;
  const ang = fixed === null ? o.angle || 0 : fixed;
  const q = tPen(p, cx, cy, look === 'scrapper' ? R * 0.82 : R, ang);
  // soft shadow under the figure
  if (look !== 'tesla') p.circle(cx + R * 0.08, cy + R * 0.14, R * 0.8, '#000000', 0.16);
  TLOOK[look](q, c, opts, p, cx, cy, R);
  return true;
}






/**
 * Returns [{level:'error'|'warn', msg}] for a level. Used by the game (console) and the editor.
 * zones: the available zones (objects with id, name and walls), or null to skip the zone checks.
 * actIds: the available act ids, or null to skip the act check.
 * variantIds: the available zombie variant ids, or null to skip that check.
 */
function validateLevel(level, towers, enemies, levelIds = [], zones = null, actIds = null, variantIds = null) {
  const out = [];
  const err = (msg) => out.push({ level: 'error', msg });
  const warn = (msg) => out.push({ level: 'warn', msg });
  const towerIds = towers.map((t) => t.id);
  const enemyIds = enemies.map((e) => e.id);

  if (!level.id) err('Level has no id.');
  if (!level.cols || !level.rows) err('Grid size is missing.');
  if (!Array.isArray(level.tiles) || level.tiles.length !== level.rows || level.tiles.some((r) => r.length !== level.cols)) {
    err('Tile rows do not match the grid size.');
  }

  const paths = level.paths || [];
  if (!paths.length) err('Add at least one path.');
  const pathIds = new Set();
  for (const p of paths) {
    if (pathIds.has(p.id)) err('Duplicate path id "' + p.id + '".');
    pathIds.add(p.id);
    if (!p.points || p.points.length < 2) {
      err('Path ' + p.id + ' needs at least 2 points (start and end).');
      continue;
    }
    for (const pt of p.points) {
      if (pt[0] < 0 || pt[1] < 0 || pt[0] >= level.cols || pt[1] >= level.rows) err('Path ' + p.id + ' leaves the grid.');
    }
    if (p.surface !== undefined && !(Number.isInteger(p.surface) && p.surface >= 0 && p.surface < MAX_SURFACES)) warn('Path ' + p.id + ' has surface ' + p.surface + ', which is not a path type from 0 to ' + (MAX_SURFACES - 1) + '; the first path type is used.');
    const cells = pathCells(p.points);
    const free = cells.filter(() => true).length;
    if (!free) err('Path ' + p.id + ' is empty.');
  }

  if (Array.isArray(level.tiles) && /[^.#2-6]/.test(level.tiles.join(''))) warn('The tile grid has characters other than . # 2 3 4 5 6; they are treated as blocked ground.');
  const zone = zones && level.zone ? zones.find((z) => z.id === level.zone) : null;
  if (level.zone && zones && !zone) warn('Zone "' + level.zone + '" does not exist, so the default look is used.');
  if (level.tier !== undefined && level.tier !== '' && !(Number.isInteger(level.tier) && level.tier >= 1 && level.tier <= MAX_TIER)) warn('Tier ' + level.tier + ' is not a whole number from 1 to ' + MAX_TIER + ', so the zone\'s tier is used.');
  const used = wallsUsed(level.tiles);
  const have = zone && zone.walls ? zone.walls.length : 1;
  if (used > have) warn('The level paints wall type ' + used + ', but ' + (zone ? 'zone "' + zone.name + '"' : 'the default look') + ' only has ' + have + ' wall type' + (have === 1 ? '' : 's') + '. Extra walls are drawn like wall type 1.');
  const pUsed = pathTypesUsed(level);
  const pHave = zone && zone.paths ? zone.paths.length : 1;
  if (pUsed > pHave) warn('A path uses path type ' + pUsed + ', but ' + (zone ? 'zone "' + zone.name + '"' : 'the default look') + ' only has ' + pHave + ' path type' + (pHave === 1 ? '' : 's') + '. Extra path types are drawn like path type 1.');
  if (level.act && actIds && !actIds.includes(level.act)) warn('Act "' + level.act + '" does not exist, so the level is listed under Other levels.');

  if (level.variant && level.variant !== NO_VARIANT && variantIds && !variantIds.includes(level.variant)) warn('Zombie variant "' + level.variant + '" does not exist, so the zone\'s look is used.');

  const allowed = level.towers || [];
  if (!allowed.length) warn('No towers selected; all towers will be allowed.');
  for (const id of allowed) if (!towerIds.includes(id)) err('Allowed tower "' + id + '" does not exist.');

  const waves = level.waves || [];
  if (!waves.length) err('Add at least one wave.');
  waves.forEach((w, i) => {
    if (!(w.groups || []).length) warn('Wave ' + (i + 1) + ' has no enemies.');
    for (const g of w.groups || []) {
      if (!enemyIds.includes(g.enemy)) err('Wave ' + (i + 1) + ' uses missing enemy "' + g.enemy + '".');
      if (g.path && !pathIds.has(g.path)) err('Wave ' + (i + 1) + ' uses missing path "' + g.path + '".');
      if (!(g.count > 0)) warn('Wave ' + (i + 1) + ' has a group with count 0.');
    }

  const cheapest = Math.min(...towers.filter((t) => pool.includes(t.id)).map((t) => t.cost));
  if (isFinite(cheapest) && level.startMoney < cheapest) warn('Starting money is below the cheapest tower cost.');

  const checkCond = (c) => {
    if (!c) return;
    if (c.level) {

      else if (levelIds.length && !levelIds.includes(c.level)) err('Unlock rule refers to missing level "' + c.level + '".');

}

/**
 * Checks for the enemy files: spawn references that point nowhere or loop forever, and ability settings that cannot work.
 * Returns [{ enemy: id, level: 'error'|'warn', msg }].
 */
function validateEnemies(enemies) {
  const out = [];
  const ids = new Set(enemies.map((e) => e.id));
  const add = (e, level, msg) => out.push({ enemy: e.id, level, msg });
  for (const e of enemies) {
    for (const sp of deathSpawns(e)) if (!ids.has(sp.enemy)) add(e, 'warn', 'It leaves behind "' + sp.enemy + '" when killed, but there is no such enemy.');
    const su = abilityOf(e, 'summon');
    if (su) {
      for (const g of su.enemies || []) if (!ids.has(g.enemy)) add(e, 'warn', 'It summons "' + g.enemy + '", but there is no such enemy.');
      if (!(su.enemies || []).length) add(e, 'warn', 'It can summon, but the list of zombies to summon is empty.');
    }
    for (const key of Object.keys(ABILITY_DEFAULTS)) {
      const a = abilityOf(e, key);
      if (!a) continue;
      for (const [k, v] of Object.entries(a)) if (typeof ABILITY_DEFAULTS[key][k] === 'number' && !(Number.isFinite(v) && v > 0)) add(e, 'warn', 'Its ' + key + ' ' + k + ' must be more than 0.');

    if (e.leap && e.flying) add(e, 'warn', 'Flying zombies do not leap (they already fly straight to the exit).');
  }
  // a zombie that bursts into zombies that burst into it again would never stop
  const next = (id) => deathSpawns(enemies.find((x) => x.id === id) || {}).map((x) => x.enemy);
  for (const e of enemies) {
    const seen = new Set();
    const walk = (id) => {
      if (id === e.id && seen.size) return true;
      if (seen.has(id)) return false;
      seen.add(id);
      return next(id).some(walk);
    };
    if (next(e.id).some(walk)) add(e, 'error', 'Its death spawns lead back to itself, so killing it would never end.');
  }
  return out;
}

function validateTower(t, enemiesUnused) {
  const out = [];
  if (!t.id) out.push({ level: 'error', msg: 'Tower has no id.' });
  if (!SHAPES.includes(t.shape)) out.push({ level: 'warn', msg: 'Unknown shape.' });
  if (!t.attack || !ATTACK_TYPES.includes(t.attack.type)) out.push({ level: 'error', msg: 'Unknown attack type.' });

}

/** Checks for the game-wide settings (data/game.json plus tower prices). Same shape as validateLevel. */
function validateGame(game, towers) {
  const out = [];
  const err = (msg) => out.push({ level: 'error', msg });
  const warn = (msg) => out.push({ level: 'warn', msg });
  const free = towers.filter((t) => !(Number(t.price) > 0));
  if (!towers.length) err('There are no towers.');
  else if (!free.length) err('Every tower costs coins, so a new player would have nothing to build. Make at least one tower free (price 0).');
  if (game.teamSlots < 1) err('Team slots must be at least 1.');
  else if (free.length > game.teamSlots) warn(free.length + ' towers are free but the team only has ' + game.teamSlots + ' slots, so some free towers will start on the bench.');
  if (towers.length && towers.length <= game.teamSlots) warn('There are no more towers than team slots, so the team choice does not matter yet.');
  return out;
}

/** Checks on tower files: returns [{ tower, level: 'warn', msg }]. */
function validateTowers(towers) {
  const out = [];
  for (const t of towers || []) {
    const a = { ...DEFAULT_ATTACK, ...(t.attack || {}) };
    const warn = (msg) => out.push({ tower: t.id, level: 'warn', msg: (t.name || t.id) + ': ' + msg });
    if (t.look && !TOWER_LOOKS.includes(t.look)) warn('unknown design "' + t.look + '", so it is drawn as a plain shape.');
    if (a.shot && !SHOT_KINDS.includes(a.shot)) warn('unknown shot look "' + a.shot + '".');
    if (!ATTACK_TYPES.includes(a.type)) warn('unknown attack type "' + a.type + '".');
    if (a.type === 'income') {
      if (!(a.income > 0)) warn('it earns no money: income is 0.');
      if (!(a.cooldown > 0)) warn('the payout interval must be above 0.');
    } else {
      const poison = a.poisonDps > 0 || a.poisonRamp > 0;
      if (poison && !(a.poisonDuration > 0)) warn('it has poison damage but poison never lasts: set a poison duration.');
      if (!(a.damage > 0) && !(a.burnDps > 0) && !poison && !(a.slowFactor < 1)) warn('it does no damage, burn, poison or slow.');
      if (a.type === 'arc' && a.chain > 0 && !(a.chainRange > 0)) warn('the shock chains but has no jump reach.');
    }
    for (const p of t.paths || []) for (const x of p.tiers || []) {
      if (a.type === 'income' && x.damage) warn('tier "' + x.name + '" adds damage, which an income tower never uses.');
      if (x.chain && a.type !== 'arc') warn('tier "' + x.name + '" adds chain jumps, which only an arc tower uses.');
      if (x.income && a.type !== 'income') warn('tier "' + x.name + '" adds income, which only an income tower pays.');
    }
  }
  return out;
}

// ---------- import ----------
async function importFiles(fileList) {

    }

      const t = normTower(d);

    }

      const e = normEnemy(d);

    }
    else if (isObj && typeof d.id === 'string' && ('extras' in d || 'tint' in d) && !('health' in d) && !('attack' in d)) {
      const v = normVariantE(d);
      report.push(f.name + ': zombie variant "' + v.name + '"' + (upsert(S.variants, v) ? ' (replaced)' : ' (added)'));
    }
    else if (isObj && typeof d.id === 'string' && typeof d.name === 'string' && 'color' in d && !('shape' in d)) {
      const a = normActE(d);

    }

    else if (isObj && isBundle(d.enemies)) { S.enemies = d.enemies.map(normEnemy); report.push(f.name + ': ' + S.enemies.length + ' enemies (old single-file format)'); }
    else if (isObj && isIndex(d.levels)) { orders.levels = d.levels; report.push(f.name + ': level order (' + d.levels.length + ')'); }
    else if (isObj && isIndex(d.towers)) { orders.towers = d.towers; report.push(f.name + ': tower order (' + d.towers.length + ')'); }
    else if (isObj && isIndex(d.variants)) { orders.variants = d.variants; report.push(f.name + ': variant order (' + d.variants.length + ')'); }
    else if (isObj && isIndex(d.acts)) { orders.acts = d.acts; report.push(f.name + ': act order (' + d.acts.length + ')'); }
    else if (isObj && isIndex(d.zones)) { orders.zones = d.zones; report.push(f.name + ': zone order (' + d.zones.length + ')'); }
    else if (isObj && isIndex(d.enemies)) { orders.enemies = d.enemies; report.push(f.name + ': enemy order (' + d.enemies.length + ')'); }
    else if (isObj && typeof d.teamSlots === 'number') { S.game = normGame(d); report.push(f.name + ': game settings'); }

  if (orders.levels) S.levels = reorder(S.levels, orders.levels);
  if (orders.towers) S.towers = reorder(S.towers, orders.towers);
  if (orders.enemies) S.enemies = reorder(S.enemies, orders.enemies);
  if (orders.zones) S.zones = reorder(S.zones, orders.zones);
  if (orders.acts) S.acts = reorder(S.acts, orders.acts);
  if (orders.variants) S.variants = reorder(S.variants, orders.variants);
  S.levels = sortByAct(S.levels, S.acts);
  ui.li = Math.min(ui.li, S.levels.length - 1);
  ui.ti = Math.min(ui.ti, S.towers.length - 1);
  ui.ei = Math.min(ui.ei, S.enemies.length - 1);
  ui.ai = Math.max(0, Math.min(ui.ai, S.acts.length - 1));
  ui.vi = Math.max(0, Math.min(ui.vi, S.variants.length - 1));
  schedSave();
  ui.report = report;
  renderTab();
  return report;
}

function shapePath(ctx, shape, x, y, r) {

  else if (shape === 'diamond') { ctx.moveTo(x, y - r * 1.15); ctx.lineTo(x + r * 0.8, y); ctx.lineTo(x, y + r * 1.15); ctx.lineTo(x - r * 0.8, y); ctx.closePath(); }
  else if (shape === 'hexagon') { for (let i = 0; i < 6; i++) { const a = (i * Math.PI) / 3; ctx[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * r, y + Math.sin(a) * r); } ctx.closePath(); }
