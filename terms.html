<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terms - Powerscaling Database</title>
  <link rel="stylesheet" href="site.css">
  <style>
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--border-color); margin-bottom: 20px; }
    .tab { background: none; border: none; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--text-muted); padding: 10px 16px; cursor: pointer; font-size: 0.95rem; }
    .tab:hover { color: var(--text-main); }
    .tab[aria-selected="true"] { color: #fff; border-bottom-color: var(--accent); }
    .subtabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .subtabs .tab { border: 1px solid var(--border-color); border-radius: 6px; padding: 6px 12px; font-size: 0.9rem; margin-bottom: 0; }
    .subtabs .tab[aria-selected="true"] { background: var(--tag-bg); color: #fff; border-color: var(--accent); }
    .tier-table { width: 100%; border-collapse: collapse; }
    .tier-table th, .tier-table td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border-color); }
    .tier-table th { color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; }
    .tier-table td:first-child { color: #fff; white-space: nowrap; width: 1%; }
  </style>
</head>
<body>
  <nav class="site-nav">
    <a class="brand" href="index.html">Powerscaling Database</a>
    <div class="links">
      <a href="index.html">Home</a>
      <a href="database.html">Characters</a>
      <a href="compare.html">Compare</a>
      <a href="calculators.html">Calculators</a>
      <a href="terms.html" aria-current="page">Terms</a>
    </div>
  </nav>
  <main class="container">
    <header>
      <h1>Terms</h1>
    </header>

    <div class="tabs" id="tabs" role="tablist"></div>
    <div id="panels"></div>
  </main>
  <script>
    // Every tier without a "+", from weakest to strongest (the "+" versions are left out on purpose)
    const TIERS = ["11-C", "11-B", "11-A", "Low 10-C", "10-C", "10-B", "10-A", "9-C", "9-B", "9-A", "8-C", "High 8-C", "8-B", "8-A", "Low 7-C", "7-C", "High 7-C", "Low 7-B", "7-B", "7-A", "High 7-A", "6-C", "High 6-C", "Low 6-B", "6-B", "High 6-B", "6-A", "High 6-A", "5-C", "Low 5-B", "5-B", "5-A", "High 5-A", "Low 4-C", "4-C", "High 4-C", "4-B", "4-A", "3-C", "3-B", "3-A", "High 3-A", "Low 2-C", "2-C", "2-C (X UNIVERSES)", "2-B", "2-A", "Low 1-C", "1-C (X DIMENSIONS)", "High 1-C (X DIMENSIONS)", "1-B (X DIMENSIONS)", "High 1-B", "Low 1-A", "1-A (X LAYERS)", "High 1-A (X LAYERS)", "0"];

    function tierHtml() {
      const rows = TIERS.map((t) => `<tr><td>${t}</td><td class="muted">&mdash;</td></tr>`).join('');
      return `<h2>Tier</h2><p class="muted">From weakest to strongest.</p>
        <table class="tier-table"><thead><tr><th>Tier</th><th>Description</th></tr></thead><tbody>${rows}</tbody></table>`;
    }

    // Top-level tabs ("groups"), each with its own row of sub-tabs. Put each sub-tab's content in its panel when you're ready.
    const GROUPS = [
      {
        id: 'tiering-system',
        title: 'Tiering System',
        tabs: [
          { id: 'tier', title: 'Tier', html: tierHtml() },
          { id: 'attack-potency', title: 'Attack Potency' },
          { id: 'speed', title: 'Speed' },
          { id: 'lifting-strength', title: 'Lifting Strength' },
          { id: 'striking-strength', title: 'Striking Strength' },
          { id: 'durability', title: 'Durability' },
          { id: 'intelligence', title: 'Intelligence' },
          { id: 'range', title: 'Range' },
          { id: 'stamina', title: 'Stamina' }
        ]
      }
    ];

    const byId = (id) => document.getElementById(id);

    GROUPS.forEach((g) => {
      const top = document.createElement('button');
      top.className = 'tab';
      top.id = 'tab-' + g.id;
      top.textContent = g.title;
      top.setAttribute('role', 'tab');
      top.addEventListener('click', () => { location.hash = '#' + g.id; });
      byId('tabs').appendChild(top);

      const box = document.createElement('div');
      box.id = 'group-' + g.id;
      const sub = document.createElement('div');
      sub.className = 'subtabs';
      sub.setAttribute('role', 'tablist');
      box.appendChild(sub);

      g.tabs.forEach((t) => {
        const btn = document.createElement('button');
        btn.className = 'tab';
        btn.id = 'tab-' + g.id + '-' + t.id;
        btn.textContent = t.title;
        btn.setAttribute('role', 'tab');
        btn.addEventListener('click', () => { location.hash = '#' + g.id + '/' + t.id; });
        sub.appendChild(btn);

        const panel = document.createElement('section');
        panel.className = 'panel';
        panel.id = 'panel-' + g.id + '-' + t.id;
        panel.innerHTML = t.html || `<h2>${t.title}</h2><p class="muted">Coming soon.</p>`;
        box.appendChild(panel);
      });
      byId('panels').appendChild(box);
    });

    // Links look like terms.html#tiering-system/speed
    function showTab() {
      const [gid, tid] = location.hash.slice(1).split('/');
      const group = GROUPS.find((g) => g.id === gid) || GROUPS[0];
      const tab = group.tabs.find((t) => t.id === tid) || group.tabs[0];
      GROUPS.forEach((g) => {
        byId('group-' + g.id).hidden = g !== group;
        byId('tab-' + g.id).setAttribute('aria-selected', String(g === group));
      });
      group.tabs.forEach((t) => {
        byId('panel-' + group.id + '-' + t.id).hidden = t !== tab;
        byId('tab-' + group.id + '-' + t.id).setAttribute('aria-selected', String(t === tab));
      });
    }
    window.addEventListener('hashchange', showTab);
    showTab();
  </script>
</body>
</html>
