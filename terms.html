<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terms - Powerscaling Database</title>
  <link rel="stylesheet" href="site.css">
  <style>
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--border-color); margin-bottom: 20px; }
    .tab { background: none; border: none; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--text-muted); padding: 10px 16px; cursor: pointer; font-size: 0.95rem; }
    .tab:hover { color: var(--text-main); }
    .tab[aria-selected="true"] { color: #fff; border-bottom-color: var(--accent); }
    .subtabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .subtabs .tab { border: 1px solid var(--border-color); border-radius: 6px; padding: 6px 12px; font-size: 0.9rem; margin-bottom: 0; }
    .subtabs .tab[aria-selected="true"] { background: var(--tag-bg); color: #fff; border-color: var(--accent); }
    .panel h3 { color: #fff; margin: 24px 0 6px; font-size: 1.05rem; }
    .panel h3.flash { color: var(--accent); }
    .panel h3 { scroll-margin-top: 16px; }
  </style>
</head>
<body>
  <nav class="site-nav">
    <a class="brand" href="index.html">Powerscaling Database</a>
    <div class="links">
      <a href="index.html">Home</a>
      <a href="database.html">Characters</a>
      <a href="compare.html">Compare</a>
      <a href="cards.html">Cards</a>
      <a href="calculators.html">Calculators</a>
      <a href="terms.html" aria-current="page">Terms</a>
    </div>
  </nav>
  <main class="container">
    <header>
      <h1>Terms</h1>
    </header>

    <div class="tabs" id="tabs" role="tablist"></div>
    <div id="panels"></div>
  </main>
  <!-- TIER TAB CONTENT: under each tier, replace the bold placeholder text with its description -->
  <template id="content-tier">
    <h2>Tier</h2>
    <p class="muted">Tier descriptions are adapted from the <a href="https://vsbattles.fandom.com/wiki/Tiering_System" target="_blank" rel="noopener">VS Battles Wiki tiering system</a> (CC BY-SA).</p>
    <h3 id="tier-11-c">11-C</h3>
    <p>Low Hypoverse. Can destroy or create a 0-D construct, or affect reality three levels beneath 3-D reality. Also covers anything weaker.</p>
    <h3 id="tier-11-b">11-B</h3>
    <p>Hypoverse. Can destroy or create an existentially inferior 1-D construct, or operate two levels beneath 3-D reality.</p>
    <h3 id="tier-11-a">11-A</h3>
    <p>High Hypoverse. Can destroy or create inferior 2-D constructs, or operate one level beneath 3-D reality.</p>
    <h3 id="tier-low-10-c">Low 10-C</h3>
    <p><b>DESCRIPTION HERE</b></p>
    <h3 id="tier-10-c">10-C</h3>
    <p>Below Average Human. The strength of below-average humans, small children or small animals.</p>
    <h3 id="tier-10-b">10-B</h3>
    <p>Human. The strength of an average human.</p>
    <h3 id="tier-10-a">10-A</h3>
    <p>Athlete. The strength of trained fighters or fit individuals.</p>
    <h3 id="tier-9-c">9-C</h3>
    <p>Street level. Olympic-level athletes or trained martial artists, and larger animals. The name does not mean destroying a street.</p>
    <h3 id="tier-9-b">9-B</h3>
    <p>Wall level. Can significantly damage very resistant materials such as stone, steel or structural walls.</p>
    <h3 id="tier-9-a">9-A</h3>
    <p>Small Building level. Can destroy rooms or small structures such as houses.</p>
    <h3 id="tier-8-c">8-C</h3>
    <p>Building level. Can destroy medium-sized buildings such as factories or supermarkets.</p>
    <h3 id="tier-high-8-c">High 8-C</h3>
    <p>Large Building level. Can destroy large buildings such as skyscrapers.</p>
    <h3 id="tier-8-b">8-B</h3>
    <p>City Block level. Can destroy urban city blocks.</p>
    <h3 id="tier-8-a">8-A</h3>
    <p>Multi-City Block level. Can destroy multiple city blocks.</p>
    <h3 id="tier-low-7-c">Low 7-C</h3>
    <p>Small Town level. Can destroy small towns.</p>
    <h3 id="tier-7-c">7-C</h3>
    <p>Town level. Can destroy towns.</p>
    <h3 id="tier-high-7-c">High 7-C</h3>
    <p>Large Town level. Can destroy large towns.</p>
    <h3 id="tier-low-7-b">Low 7-B</h3>
    <p>Small City level. Can destroy small cities.</p>
    <h3 id="tier-7-b">7-B</h3>
    <p>City level. Can destroy cities.</p>
    <h3 id="tier-7-a">7-A</h3>
    <p>Mountain level. Can destroy mountains.</p>
    <h3 id="tier-high-7-a">High 7-A</h3>
    <p>Large Mountain level. Can destroy large mountains.</p>
    <h3 id="tier-6-c">6-C</h3>
    <p>Island level. Can destroy islands.</p>
    <h3 id="tier-high-6-c">High 6-C</h3>
    <p>Large Island level. Can destroy large islands.</p>
    <h3 id="tier-low-6-b">Low 6-B</h3>
    <p>Small Country level. Can destroy small countries.</p>
    <h3 id="tier-6-b">6-B</h3>
    <p>Country level. Can destroy countries.</p>
    <h3 id="tier-high-6-b">High 6-B</h3>
    <p>Large Country level. Can destroy large countries.</p>
    <h3 id="tier-6-a">6-A</h3>
    <p>Continent level. Can destroy a continent.</p>
    <h3 id="tier-high-6-a">High 6-A</h3>
    <p>Multi-Continent level. Can destroy multiple continents.</p>
    <h3 id="tier-5-c">5-C</h3>
    <p>Moon level. Can destroy a moon or a similar object.</p>
    <h3 id="tier-low-5-b">Low 5-B</h3>
    <p>Small Planet level. Can destroy a small planet.</p>
    <h3 id="tier-5-b">5-B</h3>
    <p>Planet level. Can create or destroy a planet.</p>
    <h3 id="tier-5-a">5-A</h3>
    <p>Large Planet level. Can create or destroy large ice giants such as Uranus and Neptune.</p>
    <h3 id="tier-high-5-a">High 5-A</h3>
    <p>Dwarf Star level. Can create or destroy very small stars.</p>
    <h3 id="tier-low-4-c">Low 4-C</h3>
    <p>Small Star level. Can create or destroy small stars.</p>
    <h3 id="tier-4-c">4-C</h3>
    <p>Star level. Can create or destroy stars.</p>
    <h3 id="tier-high-4-c">High 4-C</h3>
    <p>Large Star level. Can create or destroy large stars.</p>
    <h3 id="tier-4-b">4-B</h3>
    <p>Solar System level. Can create or destroy a solar system.</p>
    <h3 id="tier-4-a">4-A</h3>
    <p>Multi-Solar System level. Can create or destroy multiple solar systems.</p>
    <h3 id="tier-3-c">3-C</h3>
    <p>Galaxy level. Can create or destroy a galaxy, counting the space between celestial bodies.</p>
    <h3 id="tier-3-b">3-B</h3>
    <p>Multi-Galaxy level. Can create or destroy multiple galaxies, counting that space.</p>
    <h3 id="tier-3-a">3-A</h3>
    <p>Universe level. Can destroy all celestial bodies in a universe-sized 3-D space, or significantly affect a comparable universe or pocket dimension.</p>
    <h3 id="tier-high-3-a">High 3-A</h3>
    <p>High Universe level. Demonstrates infinite energy on a 3-D scale, or affects infinite 3-D space.</p>
    <h3 id="tier-low-2-c">Low 2-C</h3>
    <p>Universe level+. Affects a space larger than an infinite 3-D space, such as a universal-scale space-time continuum or a large extra-dimensional bulk.</p>
    <h3 id="tier-2-c">2-C</h3>
    <p>Low Multiverse level. Affects or destroys multiverses of roughly 2 to 1,000 space-time continuums.</p>
    <h3 id="tier-2-c-x-universes">2-C (X UNIVERSES)</h3>
    <p>Low Multiverse level. Affects or destroys multiverses of roughly 2 to 1,000 space-time continuums. X is the number of universes the character is shown to affect.</p>
    <h3 id="tier-2-b">2-B</h3>
    <p>Multiverse level. Affects multiverses of 1,001 or more finite continuums.</p>
    <h3 id="tier-2-a">2-A</h3>
    <p>Multiverse level+. Affects a countably infinite number of continuums.</p>
    <h3 id="tier-low-1-c">Low 1-C</h3>
    <p>Low Complex Multiverse level. Affects spaces one to two levels of infinity above a standard universe.</p>
    <h3 id="tier-1-c-x-dimensions">1-C (X DIMENSIONS)</h3>
    <p>Complex Multiverse level. Affects spaces three to five levels above a standard universe. X is the number of dimensions.</p>
    <h3 id="tier-high-1-c-x-dimensions">High 1-C (X DIMENSIONS)</h3>
    <p>High Complex Multiverse level. Affects spaces six to seven levels above a standard universe. X is the number of dimensions.</p>
    <h3 id="tier-1-b-x-dimensions">1-B (X DIMENSIONS)</h3>
    <p>Hyperverse level. Affects spaces eight or more finite levels above a standard universe. X is the number of dimensions.</p>
    <h3 id="tier-high-1-b">High 1-B</h3>
    <p>High Hyperverse level. Affects a countably infinite number of size levels above a universe.</p>
    <h3 id="tier-low-1-a">Low 1-A</h3>
    <p>Low Outerverse level. Affects structures with uncountably infinite dimensions (aleph-1).</p>
    <h3 id="tier-1-a-x-layers">1-A (X LAYERS)</h3>
    <p>Outerverse level. Affects structures with aleph-2 dimensions. A character an infinite number of steps above the baseline is rated Outerverse level+. X is the number of layers.</p>
    <h3 id="tier-high-1-a-x-layers">High 1-A (X LAYERS)</h3>
    <p>High Outerverse level. Affects structures beyond what the 1-A framework allows, such as inaccessible cardinals. X is the number of layers.</p>
    <h3 id="tier-0">0</h3>
    <p>Boundless. Affects structures that exceed all of High 1-A, with no upper endpoint. Being “omnipotent” alone is not enough to qualify, though it can support other evidence.</p>
  </template>

  <script>
    // Top-level tabs ("groups"), each with its own row of sub-tabs. To write a tab, add a <template id="content-TABID"> block in the HTML like the Tier one.
    const GROUPS = [
      {
        id: 'tiering-system',
        title: 'Tiering System',
        tabs: [
          { id: 'tier', title: 'Tier' },
          { id: 'attack-potency', title: 'Attack Potency' },
          { id: 'speed', title: 'Speed' },
          { id: 'lifting-strength', title: 'Lifting Strength' },
          { id: 'striking-strength', title: 'Striking Strength' },
          { id: 'durability', title: 'Durability' },
          { id: 'intelligence', title: 'Intelligence' },
          { id: 'range', title: 'Range' },
          { id: 'stamina', title: 'Stamina' }
        ]
      }
    ];

    const byId = (id) => document.getElementById(id);

    GROUPS.forEach((g) => {
      const top = document.createElement('button');
      top.className = 'tab';
      top.id = 'tab-' + g.id;
      top.textContent = g.title;
      top.setAttribute('role', 'tab');
      top.addEventListener('click', () => { location.hash = '#' + g.id; });
      byId('tabs').appendChild(top);

      const box = document.createElement('div');
      box.id = 'group-' + g.id;
      const sub = document.createElement('div');
      sub.className = 'subtabs';
      sub.setAttribute('role', 'tablist');
      box.appendChild(sub);

      g.tabs.forEach((t) => {
        const btn = document.createElement('button');
        btn.className = 'tab';
        btn.id = 'tab-' + g.id + '-' + t.id;
        btn.textContent = t.title;
        btn.setAttribute('role', 'tab');
        btn.addEventListener('click', () => { location.hash = '#' + g.id + '/' + t.id; });
        sub.appendChild(btn);

        const panel = document.createElement('section');
        panel.className = 'panel';
        panel.id = 'panel-' + g.id + '-' + t.id;
        const tpl = byId('content-' + t.id);   // content comes from a <template id="content-TABID"> in the HTML
        panel.innerHTML = tpl ? tpl.innerHTML : `<h2>${t.title}</h2><p class="muted">Coming soon.</p>`;
        box.appendChild(panel);
      });
      byId('panels').appendChild(box);
    });

    // Links look like terms.html#tiering-system/speed
    function showTab() {
      const [gid, tid, anchor] = location.hash.slice(1).split('/');
      const group = GROUPS.find((g) => g.id === gid) || GROUPS[0];
      const tab = group.tabs.find((t) => t.id === tid) || group.tabs[0];
      GROUPS.forEach((g) => {
        byId('group-' + g.id).hidden = g !== group;
        byId('tab-' + g.id).setAttribute('aria-selected', String(g === group));
      });
      group.tabs.forEach((t) => {
        byId('panel-' + group.id + '-' + t.id).hidden = t !== tab;
        byId('tab-' + group.id + '-' + t.id).setAttribute('aria-selected', String(t === tab));
      });
      // Links like terms.html#tiering-system/tier/low-10-c scroll to that tier's description
      const target = anchor && byId('tier-' + anchor);
      if (target && !target.closest('[hidden]')) {
        target.scrollIntoView({ block: 'start' });
        target.classList.add('flash');
        setTimeout(() => target.classList.remove('flash'), 2000);
      }
    }
    window.addEventListener('hashchange', showTab);
    showTab();
  </script>
</body>
</html>
