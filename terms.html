    .tab:hover { color: var(--text-main); }
    .tab[aria-selected="true"] { color: #fff; border-bottom-color: var(--accent); }
    .subtabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .subtabs .tab { border: 1px solid var(--border-color); border-radius: 6px; padding: 6px 12px; font-size: 0.9rem; margin-bottom: 0; }
    .subtabs .tab[aria-selected="true"] { background: var(--tag-bg); color: #fff; border-color: var(--accent); }
    .panel h3 { color: #fff; margin: 24px 0 6px; font-size: 1.05rem; }
  </style>

  <script>
    // Top-level tabs ("groups"), each with its own row of sub-tabs. To write a tab, add a <template id="content-TABID"> block in the HTML like the Tier one.
    const GROUPS = [
      {
        id: 'tiering-system',
        title: 'Tiering System',
        tabs: [
          { id: 'tier', title: 'Tier' },
          { id: 'attack-potency', title: 'Attack Potency' },
          { id: 'speed', title: 'Speed' },
          { id: 'lifting-strength', title: 'Lifting Strength' },
          { id: 'striking-strength', title: 'Striking Strength' },
          { id: 'durability', title: 'Durability' },
          { id: 'intelligence', title: 'Intelligence' },
          { id: 'range', title: 'Range' },
          { id: 'stamina', title: 'Stamina' }
        ]
      }
    ];

    const byId = (id) => document.getElementById(id);

    GROUPS.forEach((g) => {
      const top = document.createElement('button');
      top.className = 'tab';
      top.id = 'tab-' + g.id;
      top.textContent = g.title;
      top.setAttribute('role', 'tab');
      top.addEventListener('click', () => { location.hash = '#' + g.id; });
      byId('tabs').appendChild(top);

      const box = document.createElement('div');
      box.id = 'group-' + g.id;
      const sub = document.createElement('div');
      sub.className = 'subtabs';
      sub.setAttribute('role', 'tablist');
      box.appendChild(sub);

      g.tabs.forEach((t) => {
        const btn = document.createElement('button');
        btn.className = 'tab';
        btn.id = 'tab-' + g.id + '-' + t.id;
        btn.textContent = t.title;
        btn.setAttribute('role', 'tab');
        btn.addEventListener('click', () => { location.hash = '#' + g.id + '/' + t.id; });
        sub.appendChild(btn);

        const panel = document.createElement('section');
        panel.className = 'panel';
        panel.id = 'panel-' + g.id + '-' + t.id;
        const tpl = byId('content-' + t.id);   // content comes from a <template id="content-TABID"> in the HTML
        panel.innerHTML = tpl ? tpl.innerHTML : `<h2>${t.title}</h2><p class="muted">Coming soon.</p>`;
        box.appendChild(panel);
      });
      byId('panels').appendChild(box);
    });

    // Links look like terms.html#tiering-system/speed
    function showTab() {
      const [gid, tid] = location.hash.slice(1).split('/');
      const group = GROUPS.find((g) => g.id === gid) || GROUPS[0];
      const tab = group.tabs.find((t) => t.id === tid) || group.tabs[0];
      GROUPS.forEach((g) => {
        byId('group-' + g.id).hidden = g !== group;
        byId('tab-' + g.id).setAttribute('aria-selected', String(g === group));
      });
      group.tabs.forEach((t) => {
        byId('panel-' + group.id + '-' + t.id).hidden = t !== tab;
        byId('tab-' + group.id + '-' + t.id).setAttribute('aria-selected', String(t === tab));
      });
    }
    window.addEventListener('hashchange', showTab);
    showTab();
  </script>
