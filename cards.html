<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cards - Powerscaling Database</title>
  <link rel="stylesheet" href="site.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <script src="tiers.js"></script>
  <style>
    .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 16px; }
    .coins { font-size: 1.1rem; color: #fff; background: var(--card-bg); border: 1px solid #f5c518; border-radius: 8px; padding: 6px 14px; }
    .coins b { color: #f5c518; }
    .btn { background: var(--tag-bg); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 18px; cursor: pointer; font-size: 1rem; }
    .btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .btn.primary { background: var(--tier-badge); border-color: var(--tier-badge); color: #fff; font-weight: 600; }
    .sort { background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 8px; padding: 6px 10px; font-size: 0.85rem; }
    .btn.small { padding: 5px 10px; font-size: 0.8rem; }
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--border-color); margin-bottom: 20px; }
    .tab { background: none; border: none; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--text-muted); padding: 10px 16px; cursor: pointer; font-size: 0.95rem; }
    .tab:hover { color: var(--text-main); }
    .tab[aria-selected="true"] { color: #fff; border-bottom-color: var(--accent); }
    h2.sec { color: #fff; font-size: 1.15rem; margin: 6px 0 14px; }
    .cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 18px; margin-bottom: 28px; }
    .packs { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
    .shop-item, .own-item { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
    .shop-item .btn, .own-item .btn { width: 100%; max-width: 220px; }

    /* A card pack: foil wrapper with crimped top and bottom edges */
    .pk { --c1: #2b5cff; --c2: #7a2bff; position: relative; width: 100%; max-width: 190px; aspect-ratio: 5 / 7; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(160deg, var(--c1), var(--c2)); box-shadow: 0 8px 20px rgba(0,0,0,0.55), inset 0 0 0 3px rgba(255,255,255,0.5); }
    .pk::before, .pk::after { content: ''; position: absolute; left: 0; right: 0; height: 16px; background: repeating-linear-gradient(90deg, rgba(0,0,0,0.35) 0 2px, rgba(255,255,255,0.25) 2px 4px); }
    .pk::before { top: 0; }
    .pk::after { bottom: 0; }
    .pk-shine { position: absolute; inset: 0; background-size: 250% 100%; animation: sheen 4s linear infinite;
      background-image: linear-gradient(115deg, transparent 35%, rgba(255,255,255,0.35) 48%, transparent 60%); }
    .pk-label { position: relative; width: 82%; text-align: center; color: #fff; padding: 10px 12px; background: rgba(0,0,0,0.35); border: 2px solid rgba(255,255,255,0.7); border-radius: 8px; text-shadow: 0 2px 4px rgba(0,0,0,0.6); }
    .pk-star { font-size: 1.6rem; color: #ffe27a; line-height: 1; }
    .pk-name { font-weight: 800; font-size: 1.1rem; line-height: 1.15; margin: 4px 0; text-transform: uppercase; letter-spacing: 0.03em; }
    .pk-size { font-size: 0.72rem; letter-spacing: 0.12em; opacity: 0.9; }
    .pk-count { position: absolute; top: 22px; right: 8px; z-index: 3; background: rgba(0,0,0,0.75); color: #fff; border-radius: 6px; padding: 2px 8px; font-weight: 700; font-size: 0.85rem; }
    .pk.shake { animation: shake 1s ease-in-out both; }

    /* Every card has a white border */
    .tcard { position: relative; overflow: hidden; background: var(--card-bg); border: 4px solid #fff; border-radius: 14px; padding: 8px; color: var(--text-main); }
    .art { aspect-ratio: 4 / 5; background: #000; border-radius: 8px; overflow: hidden; }
    .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .tcard h3 { color: #fff; margin: 10px 2px 6px; font-size: 1.05rem; }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
    .chip { background: var(--tag-bg); border: 1px solid var(--border-color); border-radius: 5px; padding: 1px 7px; font-size: 0.7rem; }
    .stat { background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 6px; padding: 5px 8px; margin-top: 5px; font-size: 0.85rem; color: #fff; }
    .stat span { display: block; font-size: 0.65rem; text-transform: uppercase; color: var(--text-muted); }
    .count, .new { position: absolute; top: 12px; z-index: 2; border-radius: 6px; padding: 2px 8px; font-size: 0.8rem; font-weight: 700; background: rgba(0,0,0,0.75); color: #fff; }
    .count { right: 12px; }
    .new { left: 12px; background: #238636; }
    .tcard .btn { width: 100%; margin-top: 8px; padding: 7px; font-size: 0.85rem; }

    /* Rarer versions (they stack) */
    .tcard.shiny img { filter: invert(1); }
    .tcard.foil { box-shadow: 0 0 12px 2px rgba(120,210,255,0.7), 0 0 26px 6px rgba(200,120,255,0.45); }
    .tcard.foil::after { content: ''; position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; background-size: 250% 100%; animation: sheen 3s linear infinite;
      background-image: linear-gradient(115deg, transparent 30%, rgba(255,255,255,0.28) 45%, rgba(120,220,255,0.25) 50%, rgba(255,120,255,0.25) 55%, transparent 70%); }
    @keyframes sheen { from { background-position: 150% 0; } to { background-position: -100% 0; } }
    .tcard.goldborder { border-color: #f5c518; }
    .tcard.fullgold { background: linear-gradient(135deg, #e0b030, #9a6f0a); text-shadow: 0 1px 2px rgba(0,0,0,0.6); }
    .tcard.fullgold .stat, .tcard.fullgold .chip { background: rgba(255,215,90,0.55); border-color: #f5c518; }
    /* Pack opening: the pack shakes, then cards are dealt face down and flip when clicked */
    .pack-wrap { grid-column: 1 / -1; display: flex; justify-content: center; padding: 20px 0; }
    @keyframes shake { 0%, 100% { transform: rotate(0); } 10% { transform: rotate(-4deg); } 20% { transform: rotate(4deg); } 30% { transform: rotate(-5deg); } 40% { transform: rotate(5deg); }
      50% { transform: rotate(-6deg) scale(1.05); } 60% { transform: rotate(6deg) scale(1.08); } 80% { transform: scale(1.15); filter: brightness(1.6); } 100% { transform: scale(1.3); opacity: 0; filter: brightness(2.5); } }
    .flip { perspective: 900px; cursor: pointer; animation: deal 0.4s ease both; animation-delay: calc(var(--i) * 90ms); }
    @keyframes deal { from { transform: translateY(-40px) scale(0.8); opacity: 0; } to { transform: none; opacity: 1; } }
    .flip-inner { display: grid; transition: transform 0.6s; transform-style: preserve-3d; }
    .flip.flipped .flip-inner { transform: rotateY(180deg); }
    .face { grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .face.front { transform: rotateY(180deg); }
    .face.back { display: flex; align-items: center; justify-content: center; text-align: center; padding: 10px; color: #fff; font-weight: 700; border-radius: 14px; border: 4px solid #fff;
      background: repeating-linear-gradient(45deg, #1b2a52, #1b2a52 10px, #22366b 10px, #22366b 20px); }
    /* the back of a card hints at how good it is */
    .flip.glow-2 .face.back { box-shadow: 0 0 16px 4px #4da3ff; }
    .flip.glow-3 .face.back { box-shadow: 0 0 16px 4px #2bd6c0; }
    .flip.glow-4 .face.back { box-shadow: 0 0 16px 4px #b46bff; }
    .flip.glow-5 .face.back { box-shadow: 0 0 18px 5px #ff9f2e; }
    .flip.glow-6 .face.back { box-shadow: 0 0 18px 5px #ff4d4d; }
    .flip.glow-7 .face.back { box-shadow: 0 0 20px 6px #ff4db8; }
    .flip.glow-8 .face.back { box-shadow: 0 0 24px 8px #fff3b0; }
    .flip.glow-9 .face.back { box-shadow: 0 0 28px 10px #ff4dff; animation: rainbow 2s linear infinite; }
    @keyframes rainbow { to { filter: hue-rotate(360deg); } }
    .flip.glow-gold .face.back { box-shadow: 0 0 22px 7px #ffd24a; }
    .flip.flipped[class*="glow-"] .face.front .tcard { animation: hit 0.9s ease-out; }
    @keyframes hit { 0% { filter: brightness(2.6) saturate(1.6); } 100% { filter: none; } }
  </style>
</head>
<body>
  <nav class="site-nav">
    <a class="brand" href="index.html">Powerscaling Database</a>
    <div class="links">
      <a href="index.html">Home</a>
      <a href="database.html">Characters</a>
      <a href="compare.html">Compare</a>
      <a href="cards.html" aria-current="page">Cards</a>
      <a href="calculators.html">Calculators</a>
      <a href="terms.html">Terms</a>
    </div>
  </nav>

  <main class="container">
    <header>
      <h1>Cards</h1>
      <p class="muted">Buy packs in the Shop, open them, and collect character cards. The stronger the character, the rarer the card.</p>
    </header>

    <div class="bar">
      <div class="coins">Coins: <b id="coins">0</b></div>
      <span class="muted" id="status">Loading characters...</span>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab" id="tab-shop" role="tab">Shop</button>
      <button class="tab" id="tab-packs" role="tab">Open Packs</button>
      <button class="tab" id="tab-collection" role="tab">My Collection</button>
    </div>

    <section id="panel-shop">
      <h2 class="sec">Packs</h2>
      <div class="cgrid packs" id="shop-packs"></div>
      <h2 class="sec">Cards <span class="muted" id="card-timer" style="font-size:0.85rem"></span></h2>
      <div class="cgrid" id="shop-cards"></div>
    </section>

    <section id="panel-packs" hidden>
      <div class="cgrid packs" id="owned"></div>
      <div id="pack-box" hidden>
        <div class="bar"><h2 class="sec" style="margin:0">Latest pack <span class="muted" style="font-size:0.85rem">click a card to flip it</span></h2><button class="btn small" id="reveal" hidden>Reveal all</button></div>
        <div class="cgrid pack" id="pack"></div>
      </div>
    </section>

    <section id="panel-collection" hidden>
      <div class="bar">
        <h2 class="sec" style="margin:0">Your collection <span class="muted" id="stats"></span></h2>
        <select id="sort" class="sort" aria-label="Sort cards">
          <option value="rarity">Sort: rarest first</option>
          <option value="az">Sort: A to Z</option>
          <option value="za">Sort: Z to A</option>
          <option value="price-desc">Sort: price, high to low</option>
          <option value="price-asc">Sort: price, low to high</option>
        </select>
        <button class="btn small" id="sell-dupes">Sell all duplicates</button>
        <button class="btn small" id="reset" style="margin-left:auto">Reset everything</button>
      </div>
      <div class="cgrid" id="collection"></div>
    </section>
  </main>

  <script>
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQWRS4v9F9SJ-Y4wUOO3efaf3UXCItz8EX4wK4QV6lnHX37MQMrchewnvjC9IcwYnehddX5VjBAzUxi/pub?gid=2100327724&single=true&output=csv';

    // =====================  SETTINGS YOU CAN CHANGE  =====================
    const START_COINS = 100;       // coins a new player starts with
    const CARD_SHOP_SIZE = 6;      // how many cards are for sale in the Shop at a time
    const CARD_SHOP_MINUTES = 30;  // the cards for sale change this often
    const CARD_BUY_MARKUP = 4;     // buying a card in the Shop costs this many times what it sells for

    // Rarities: [name, short name, chance a pulled card is this rarity (%), coin value, first tier it covers]
    // A character's rarity comes from its tier: each rarity runs from its "first tier" up to just before the next one.
    const RARITIES = [
      ['Common',     'C',  70,    2,     null],           // Wall level and below
      ['Uncommon',   'UC', 18,    6,     '9-B+'],         // Wall+ up to Large Building level
      ['Rare',       'R',  8.3,   16,    'High 8-C+'],    // Large Building+ up to Multi-City Block+
      ['Super Rare', 'SR', 2.5,   40,    'Low 7-C'],      // Tier 7
      ['Epic',       'E',  0.9,   100,   '6-C'],          // Tier 6
      ['Legendary',  'L',  0.2,   350,   '5-C'],          // Tier 5
      ['Mythic',     'M',  0.083, 1000,  'Low 4-C'],      // Tiers 4 and 3
      ['Beyond',     'B',  0.033, 2500,  'Low 2-C'],      // Tier 2
      ['Celestial',  'CE', 0.010, 10000, 'Low 1-C'],      // Tier 1 (all the outerversal tiers)
      ['Divine',     'D',  0.002, 50000, '0'],            // Tier 0
    ].map(([name, abbr, chance, value, from]) => ({ name, abbr, chance: chance / 100, value, min: from ? parseTierWeight(from) : 0 }));

    // Finishes: [code, name, chance each card gets it (%), sell value multiplier]. Each is rolled separately, so they can stack
    // (and their multipliers multiply together).
    const VARIANTS = [['s', 'Shiny', 4, 3], ['f', 'Foil', 12, 1.5], ['b', 'Gold Border', 1.5, 6], ['g', 'Full Gold', 0.3, 20]].map(([c, n, pct, mult]) => [c, n, pct / 100, mult]);

    // =====================  PACKS  =====================
    // id: unique short name (letters/numbers/dashes)   size: how many cards you get
    // cost: coins to buy it (0 = free)                 cooldown: for a FREE pack, a new one arrives this often (seconds);
    //                                                   for a paid pack, the wait before you can buy another (0 = no wait)
    // hold: the most of this pack you can keep in Open Packs. Leave it out for unlimited (paid packs) or 1 (free packs with a wait).
    const PACKS = [
      { id: 'basic', name: 'Basic Pack', desc: 'A free pack every minute. Holds up to 3.', size: 3, cost: 0, cooldown: 60, hold: 3 },
      { id: 'mega', name: 'Mega Pack', desc: 'Ten cards in one go.', size: 10, cost: 100, cooldown: 0 },

      // ---- ADD YOUR OWN PACKS HERE. Copy this example, remove the // at the start of each line, and edit it. ----
      // { id: 'dragon-ball', name: 'Dragon Ball Pack', desc: 'Only Dragon Ball characters.', size: 5, cost: 50, cooldown: 0,
      //   folder: 'Dragon Ball',                   // optional: only characters in this folder. Use a path for a sub-folder: 'Dragon Ball, Saiyan Saga'
      //   // folder: ['Marvel', 'DC'],             // ...or a list of folders. Use 'Not Sorted' for characters with no folder
      //   characters: ['Goku (Raditz Saga)'],      // optional: only these characters (names must match the sheet)
      //   minTier: '7-C', maxTier: '4-B',          // optional: only tiers from this one up to this one (from your tier list)
      //   colors: ['#e5392e', '#ff9f2e'],            // optional: the two colours of the pack artwork
      //   luck: 1.5 },                             // optional: above 1 = rarer cards show up more often (1 = normal)
    ];
    const PALETTE = [['#2b5cff', '#7a2bff'], ['#e5392e', '#ff9f2e'], ['#13a67b', '#2bd1ff'], ['#b32bff', '#ff2b8a'], ['#c9971c', '#ffe27a']];   // pack colours when a pack has no colors
    // ======================================================================

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const FALLBACK_IMG = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="350"><rect width="100%" height="100%" fill="#000"/><text x="50%" y="50%" fill="#8b949e" font-family="sans-serif" font-size="16" text-anchor="middle">No image</text></svg>');
    document.addEventListener('error', (e) => {
      const el = e.target;
      if (el.tagName === 'IMG' && !el.dataset.fb) { el.dataset.fb = '1'; el.src = FALLBACK_IMG; }
    }, true);

    const val = (item, ...keys) => { for (const k of keys) { const v = (item[k] || '').trim(); if (v) return v; } return ''; };
    const nameOf = (c) => val(c, 'Character Name', 'Character');
    const imageOf = (c) => {
      const raw = val(c, 'Image Link / Name', 'Image Link');
      if (!raw) return '';
      if (/^https?:\/\//i.test(raw)) return raw;
      return './Images/' + raw.replace(/^(\.\/)?images\//i, '').replace(/[#?]/g, (x) => encodeURIComponent(x));
    };
    // A character's folder path from the Folders column. Characters with no folder are in "Not Sorted".
    const folderPath = (c) => { const parts = val(c, 'Folders', 'Folder').split(/\s*,\s*/).filter(Boolean).map((x) => x.toLowerCase()); return parts.length ? parts : ['not sorted']; };
    // True if the folder spec ("Dragon Ball" or a path like "Marvel, MCU") appears in the character's path
    const inFolder = (path, spec) => { const want = String(spec).split(/\s*,\s*/).filter(Boolean).map((x) => x.toLowerCase()); return want.length > 0 && path.some((_, i) => want.every((w, j) => path[i + j] === w)); };
    const famOf = (tierText) => { const r = parseTier(tierText); return r ? Math.floor(r.rank / SLOT) : null; };
    const flagsOf = (key) => key.split('||')[1] || '';
    const levelOfRank = (rank) => RARITIES.reduce((lvl, r, i) => rank >= r.min ? i : lvl, 0);
    // what a card sells for: its rarity's coin value times the multiplier of every finish it has
    const sellMult = (flags) => VARIANTS.reduce((m, v) => flags.includes(v[0]) ? m * v[3] : m, 1);
    const sellPrice = (e, flags = '') => Math.max(1, Math.round(RARITIES[e.level].value * sellMult(flags)));
    // how rare a card is overall (used for "rarest first")
    const rarityScore = (e, flags) => VARIANTS.reduce((m, v) => flags.includes(v[0]) ? m / v[2] : m, 1 / RARITIES[e.level].chance);
    const fmtTime = (ms) => { const s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

    // ---- Saved game (kept in this browser, survives refreshes) ----
    const KEY = 'powerscaling-cards-v2';
    let state = { coins: START_COINS, cards: {}, ready: {}, packs: {}, next: {} };   // cards: "Name||flags" -> copies; ready: pack id -> time it can be opened again
    try {
      const saved = JSON.parse(localStorage.getItem(KEY));
      if (saved && typeof saved.coins === 'number') state = { coins: saved.coins, cards: saved.cards || {}, ready: saved.ready || {}, packs: saved.packs || {}, next: saved.next || {} };
      else { const old = JSON.parse(localStorage.getItem('powerscaling-cards-v1')); if (old) state.cards = old; }   // keep cards from the first version
    } catch (err) { /* start fresh */ }
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (err) { /* storage unavailable */ } };

    // ---- Characters and pulling ----
    let loaded = false, busy = false;
    const byName = new Map();   // name -> { c, fam, w }
    const poolCache = {};

    function prepare(chars) {
      chars.forEach((c) => {
        const name = nameOf(c), t = parseTier(val(c, 'Tier / Tier range', 'Tier'));
        if (!t || !name || byName.has(name)) return;   // characters without a recognised tier can't be pulled
        byName.set(name, { c, fam: Math.floor(t.rank / SLOT), level: levelOfRank(t.rank) });
      });
    }

    // Which characters a pack can give, grouped by rarity, with the chance of each rarity
    function poolFor(pack) {
      if (poolCache[pack.id]) return poolCache[pack.id];
      const names = pack.characters && new Set(pack.characters.map((n) => n.toLowerCase()));
      const lo = (pack.minTier && famOf(pack.minTier)) ?? -Infinity, hi = (pack.maxTier && famOf(pack.maxTier)) ?? Infinity;
      const folders = [].concat(pack.folders || pack.folder || []);   // one folder, or several
      const luck = pack.luck || 1;                                    // above 1 = rarer cards show up more often
      const groups = RARITIES.map(() => []);
      [...byName.values()]
        .filter((e) => e.fam >= lo && e.fam <= hi && (!names || names.has(nameOf(e.c).toLowerCase())) && (!folders.length || folders.some((f) => inFolder(folderPath(e.c), f))))
        .forEach((e) => groups[e.level].push(e));
      // a rarity with no characters in this pack is skipped, and the others share its chance
      const odds = RARITIES.map((r, i) => groups[i].length ? r.chance * Math.pow(luck, i) : 0);
      return (poolCache[pack.id] = { groups, odds, sum: odds.reduce((a, b) => a + b, 0), pool: groups.flat() });
    }

    function pullOne({ groups, odds, sum }) {
      let r = Math.random() * sum, i = 0;
      for (; i < odds.length - 1; i++) { r -= odds[i]; if (r < 0) break; }
      while (!groups[i].length) i--;
      const e = groups[i][Math.floor(Math.random() * groups[i].length)];
      const flags = VARIANTS.filter((v) => Math.random() < v[2]).map((v) => v[0]).join('');
      return { e, flags };
    }

    // ---- Drawing ----
    function cardHtml(e, flags, count, isNew, extra = '') {
      const c = e.c, has = (k) => flags.includes(k);
      const cls = ['tcard', has('s') && 'shiny', has('f') && 'foil', has('b') && 'goldborder', has('g') && 'fullgold'].filter(Boolean).join(' ');
      const chips = [RARITIES[e.level].name].concat(VARIANTS.filter((v) => has(v[0])).map((v) => v[1])).map((t) => `<span class="chip">${t}</span>`).join('');
      return `<div class="${cls}">${isNew ? '<div class="new">NEW</div>' : ''}${count > 1 ? `<div class="count">&times;${count}</div>` : ''}
        <div class="art"><img src="${esc(imageOf(c) || FALLBACK_IMG)}" alt="${esc(nameOf(c))}" loading="lazy"></div>
        <h3>${esc(nameOf(c))}</h3><div class="chips">${chips}</div>
        <div class="stat"><span>Tier</span>${esc(val(c, 'Tier / Tier range', 'Tier') || '—')}</div>
        <div class="stat"><span>AP</span>${esc(val(c, 'AP (Attack Potency)', 'AP') || '—')}</div>
        <div class="stat"><span>Speed</span>${esc(val(c, 'Speed') || '—')}</div>${extra}</div>`;
    }

    // Text shown on a pack: where its cards come from
    function sourceText(p) {
      const parts = [].concat(p.folders || p.folder || []);
      if (p.characters && p.characters.length) parts.push(p.characters.length + ' chosen characters');
      if (p.minTier || p.maxTier) parts.push('tiers ' + (p.minTier || 'lowest') + ' to ' + (p.maxTier || 'highest'));
      return parts.length ? parts.join(', ') : 'Everything';
    }

    // One card as it is dealt in a pack: face down, with a glow on the back for the good ones
    function flipHtml(e, flags, isNew, i, packName) {
      const lvl = e.level, glow = flags.includes('g') ? 'glow-gold' : lvl >= 2 ? 'glow-' + lvl : '';
      return `<div class="flip ${glow}" style="--i:${i}"><div class="flip-inner"><div class="face back">${esc(packName)}</div><div class="face front">${cardHtml(e, flags, 0, isNew)}</div></div></div>`;
    }

    // The pack artwork
    function packHtml(p, cls = '', count = 0) {
      const [c1, c2] = p.colors || PALETTE[PACKS.indexOf(p) % PALETTE.length];
      return `<div class="pk ${cls}" style="--c1:${esc(c1)};--c2:${esc(c2)}"><div class="pk-shine"></div>${count > 1 ? `<div class="pk-count">&times;${count}</div>` : ''}
        <div class="pk-label"><div class="pk-star">&#9733;</div><div class="pk-name">${esc(p.name)}</div><div class="pk-size">${p.size} CARDS</div></div></div>`;
    }

    const everyText = (p) => p.cooldown ? ' every ' + (p.cooldown % 60 ? p.cooldown + ' sec' : p.cooldown / 60 + ' min') : '';

    // The Shop sells packs that cost coins. Free packs live in the Open tab.
    function renderShop() {
      const paid = PACKS.filter((p) => p.cost > 0);
      $('shop-packs').innerHTML = paid.length ? paid.map((p) => `<div class="shop-item">${packHtml(p)}
        <p class="muted" style="margin:0">${esc(p.desc || '')}</p><div class="muted">Pulls from: ${esc(sourceText(p))}</div>
        <div>${p.cost} coins${everyText(p)}${isFinite(holdOf(p)) ? ' \u00b7 holds up to ' + holdOf(p) : ''}</div>
        <button class="btn primary" data-buy="${esc(p.id)}" disabled>Buy</button></div>`).join('') : '<p class="muted">No packs for sale right now.</p>';
    }

    // Open tab: the free packs (always here) plus any packs you bought
    const holdOf = (p) => p.hold ?? (p.cost ? Infinity : 1);   // how many of this pack you can keep
    const isRegen = (p) => !p.cost && p.cooldown > 0;           // a free pack that refills over time

    // Gives free packs earned since last time (also while the page was closed), up to the hold limit.
    // Returns true if the number of packs you hold changed.
    function updateRegen() {
      const now = Date.now();
      let gained = false, changed = false;
      PACKS.filter(isRegen).forEach((p) => {
        const hold = holdOf(p), cd = p.cooldown * 1000;
        if (state.packs[p.id] === undefined) {   // first time: start with one ready (or carry over the old timer)
          const old = state.ready[p.id] || 0;
          state.packs[p.id] = old > now ? 0 : 1;
          state.next[p.id] = old > now ? old : now + cd;
          gained = changed = true;
        }
        let n = state.packs[p.id];
        if (n > hold) { n = state.packs[p.id] = hold; gained = changed = true; }
        if (n >= hold) { if (state.next[p.id] != null) { delete state.next[p.id]; changed = true; } return; }   // full: the timer stops
        if (state.next[p.id] == null) { state.next[p.id] = now + cd; changed = true; }
        while (n < hold && now >= state.next[p.id]) { n++; state.next[p.id] += cd; gained = changed = true; }
        if (n >= hold) delete state.next[p.id];
        state.packs[p.id] = n;
      });
      if (changed) save();
      return gained;
    }

    // Open tab: the free packs (always listed) plus any packs you bought
    function renderOwned() {
      const items = PACKS.filter((p) => !p.cost || (state.packs[p.id] || 0) > 0);
      $('owned').innerHTML = items.length
        ? items.map((p) => `<div class="own-item">${packHtml(p, '', p.cost || isRegen(p) ? state.packs[p.id] : 0)}
            <div class="muted">Pulls from: ${esc(sourceText(p))}</div>
            ${p.cost ? '' : isRegen(p) ? `<div class="muted" data-regen="${esc(p.id)}"></div>` : '<div>Free, no wait</div>'}
            <button class="btn primary" data-open="${esc(p.id)}">Open</button></div>`).join('')
        : '<p class="muted">You don\u2019t own any packs. Get some in the Shop!</p>';
    }

    function refreshPacks() {
      const now = Date.now();
      document.querySelectorAll('[data-buy]').forEach((btn) => {
        const p = PACKS.find((x) => x.id === btn.dataset.buy), wait = Math.max(0, (state.ready[p.id] || 0) - now);
        let label = `Buy (${p.cost} coins)`, off = false;
        if (!loaded) { label = 'Loading...'; off = true; }
        else if (!poolFor(p).pool.length) { label = 'No characters match'; off = true; }
        else if ((state.packs[p.id] || 0) >= holdOf(p)) { label = 'Pack full'; off = true; }
        else if (wait > 0) { label = 'Ready in ' + fmtTime(wait); off = true; }
        else if (state.coins < p.cost) { label = `Need ${p.cost} coins`; off = true; }
        btn.textContent = label;
        btn.disabled = off;
      });
      document.querySelectorAll('[data-open]').forEach((btn) => {
        const p = PACKS.find((x) => x.id === btn.dataset.open), stock = p.cost || isRegen(p), n = state.packs[p.id] || 0;
        let label = stock ? 'Open' : 'Open (free)', off = false;
        if (!loaded) { label = 'Loading...'; off = true; }
        else if (busy) { label = 'Opening...'; off = true; }
        else if (!poolFor(p).pool.length) { label = 'No characters match'; off = true; }
        else if (stock && n <= 0) { label = state.next[p.id] ? 'Next in ' + fmtTime(state.next[p.id] - now) : 'None left'; off = true; }
        btn.textContent = label;
        btn.disabled = off;
      });
      document.querySelectorAll('[data-regen]').forEach((el) => {
        const p = PACKS.find((x) => x.id === el.dataset.regen), n = state.packs[p.id] || 0, hold = holdOf(p), nx = state.next[p.id];
        el.textContent = n >= hold ? `Full (${n}/${hold})` : `${n}/${hold} stored` + (nx ? ` \u00b7 next in ${fmtTime(Math.max(0, nx - now))}` : '');
      });
    }

    function renderCollection() {
      const rows = Object.entries(state.cards).map(([key, n]) => {
        const [name, flags = ''] = key.split('||'), e = byName.get(name);
        // rarest first: how unlikely the character is, times the odds of each rarer version
        return e && { key, e, flags, n, score: rarityScore(e, flags) };
      }).filter(Boolean);
      const mode = $('sort').value, nm = (r) => nameOf(r.e.c), byScore = (a, b) => b.score - a.score;
      rows.sort(mode === 'az' ? (a, b) => nm(a).localeCompare(nm(b)) || byScore(a, b)
        : mode === 'za' ? (a, b) => nm(b).localeCompare(nm(a)) || byScore(a, b)
        : mode === 'price-desc' ? (a, b) => sellPrice(b.e, b.flags) - sellPrice(a.e, a.flags) || byScore(a, b)
        : mode === 'price-asc' ? (a, b) => sellPrice(a.e, a.flags) - sellPrice(b.e, b.flags) || byScore(b, a)
        : byScore);
      $('stats').textContent = rows.length ? `· ${rows.reduce((s, r) => s + r.n, 0)} cards, ${rows.length} unique` : '';
      $('collection').innerHTML = rows.length
        ? rows.map((r) => cardHtml(r.e, r.flags, r.n, false, `<button class="btn" data-sell="${esc(r.key)}">Sell 1 for ${sellPrice(r.e, r.flags).toLocaleString()} coins</button>`)).join('')
        : '<p class="muted">No cards yet. Open a pack!</p>';
    }

    // ---- Card shop: a small selection of cards you can buy outright. It changes every CARD_SHOP_MINUTES. ----
    let stockSlot = null, stock = [];
    const buyPrice = (e) => sellPrice(e, '') * CARD_BUY_MARKUP;
    const currentSlot = () => Math.floor(Date.now() / (CARD_SHOP_MINUTES * 60000));

    function makeStock(slot) {
      let a = (slot * 2654435761) >>> 0;   // same time slot = same cards (in every tab and on every visit)
      const rnd = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
      const groups = RARITIES.map(() => []), picks = [];
      [...byName.values()].forEach((e) => groups[e.level].push(e));
      while (picks.length < CARD_SHOP_SIZE && groups.some((g) => g.length)) {
        const odds = RARITIES.map((r, i) => groups[i].length ? r.chance : 0);
        let r = rnd() * odds.reduce((x, y) => x + y, 0), i = 0;
        for (; i < odds.length - 1; i++) { r -= odds[i]; if (r < 0) break; }
        while (!groups[i].length) i--;
        picks.push(groups[i].splice(Math.floor(rnd() * groups[i].length), 1)[0]);
      }
      return picks;
    }

    function renderCardShop() {
      if (!loaded) { $('shop-cards').innerHTML = '<p class="muted">Loading...</p>'; return; }
      if (currentSlot() !== stockSlot) { stockSlot = currentSlot(); stock = makeStock(stockSlot); }
      $('shop-cards').innerHTML = stock.map((e) => cardHtml(e, '', 0, false, `<button class="btn primary" data-buycard="${esc(nameOf(e.c))}">Buy</button>`)).join('');
      refreshCardShop();
    }

    function refreshCardShop() {
      if (!loaded) return;
      if (currentSlot() !== stockSlot) { renderCardShop(); return; }
      $('card-timer').textContent = '\u00b7 new cards in ' + fmtTime((stockSlot + 1) * CARD_SHOP_MINUTES * 60000 - Date.now());
      document.querySelectorAll('[data-buycard]').forEach((btn) => {
        const price = buyPrice(byName.get(btn.dataset.buycard));
        btn.textContent = state.coins < price ? `Need ${price.toLocaleString()} coins` : `Buy for ${price.toLocaleString()} coins`;
        btn.disabled = state.coins < price;
      });
    }

    function renderAll() {
      $('coins').textContent = state.coins.toLocaleString();
      const owned = PACKS.reduce((t, p) => t + (state.packs[p.id] || 0), 0);
      $('tab-packs').textContent = 'Open Packs' + (owned ? ` (${owned})` : '');
      renderOwned();
      refreshPacks();
      refreshCardShop();
      renderCollection();
    }

    // ---- Actions ----
    function buyPack(p) {
      if (!loaded || (state.ready[p.id] || 0) > Date.now() || state.coins < p.cost || !poolFor(p).pool.length || (state.packs[p.id] || 0) >= holdOf(p)) return;
      state.coins -= p.cost;
      if (p.cooldown) state.ready[p.id] = Date.now() + p.cooldown * 1000;
      state.packs[p.id] = (state.packs[p.id] || 0) + 1;
      save();
      renderAll();
    }

    function buyCard(name) {
      const e = byName.get(name);
      if (!e || state.coins < buyPrice(e)) return;
      state.coins -= buyPrice(e);
      const key = name + '||';
      state.cards[key] = (state.cards[key] || 0) + 1;
      save();
      renderAll();
    }

    function openPack(p) {
      if (!loaded || busy) return;
      const pool = poolFor(p);
      if (!pool.pool.length) return;
      if (p.cost || isRegen(p)) {   // a pack you own (bought, or earned for free over time)
        if (!(state.packs[p.id] > 0)) return;
        state.packs[p.id]--;
        updateRegen();   // starts the refill timer if a free pack was full
      }                  // a free pack with no wait can always be opened
      const pulls = [];
      for (let i = 0; i < p.size; i++) {
        const { e, flags } = pullOne(pool), key = nameOf(e.c) + '||' + flags;
        pulls.push({ e, flags, isNew: !state.cards[key] });
        state.cards[key] = (state.cards[key] || 0) + 1;
      }
      busy = true;
      save();
      renderAll();
      // the pack shakes, then the cards are dealt face down for you to flip
      $('pack-box').hidden = false;
      $('pack-box').scrollIntoView({ behavior: 'smooth', block: 'start' });
      $('reveal').hidden = true;
      $('pack').innerHTML = `<div class="pack-wrap">${packHtml(p, 'shake')}</div>`;
      setTimeout(() => {
        $('pack').innerHTML = pulls.map((x, i) => flipHtml(x.e, x.flags, x.isNew, i, p.name)).join('');
        $('reveal').hidden = false;
        busy = false;
        refreshPacks();
      }, 1000);
    }

    function sellOne(key) {
      const n = state.cards[key], e = byName.get(key.split('||')[0]);
      if (!n || !e) return;
      const price = sellPrice(e, flagsOf(key));
      if (n === 1 && !confirm(`Sell your last copy of ${nameOf(e.c)} for ${price.toLocaleString()} coins?`)) return;
      state.coins += price;
      if (n === 1) delete state.cards[key]; else state.cards[key] = n - 1;
      save();
      renderAll();
    }

    $('shop-packs').addEventListener('click', (e) => { const b = e.target.closest('[data-buy]'); if (b) buyPack(PACKS.find((p) => p.id === b.dataset.buy)); });
    $('shop-cards').addEventListener('click', (e) => { const b = e.target.closest('[data-buycard]'); if (b) buyCard(b.dataset.buycard); });
    $('owned').addEventListener('click', (e) => { const b = e.target.closest('[data-open]'); if (b) openPack(PACKS.find((p) => p.id === b.dataset.open)); });
    $('pack').addEventListener('click', (e) => { const f = e.target.closest('.flip'); if (f) f.classList.add('flipped'); });
    $('reveal').addEventListener('click', () => {
      document.querySelectorAll('#pack .flip:not(.flipped)').forEach((f, i) => setTimeout(() => f.classList.add('flipped'), i * 200));
    });
    $('collection').addEventListener('click', (e) => { const b = e.target.closest('[data-sell]'); if (b) sellOne(b.dataset.sell); });

    $('sort').addEventListener('change', renderCollection);
    $('sell-dupes').addEventListener('click', () => {
      let coins = 0, cards = 0;
      Object.entries(state.cards).forEach(([key, n]) => { const e = byName.get(key.split('||')[0]); if (e && n > 1) { coins += (n - 1) * sellPrice(e, flagsOf(key)); cards += n - 1; } });
      if (!cards) { alert('You have no duplicates to sell.'); return; }
      if (!confirm(`Sell ${cards} duplicate cards for ${coins.toLocaleString()} coins? You keep one copy of each.`)) return;
      Object.keys(state.cards).forEach((key) => { if (byName.has(key.split('||')[0]) && state.cards[key] > 1) state.cards[key] = 1; });
      state.coins += coins;
      save();
      renderAll();
    });

    $('reset').addEventListener('click', () => {
      if (!confirm(`Reset everything? This deletes all your cards and sets your coins back to ${START_COINS}. It can\u2019t be undone.`)) return;
      state = { coins: START_COINS, cards: {}, ready: {}, packs: {}, next: {} };
      save();
      $('pack-box').hidden = true;
      renderAll();
    });

    // Coins can also be earned on the Compare page (Who's Stronger?), so pick up changes made in another tab
    window.addEventListener('storage', (e) => {
      if (e.key !== KEY) return;
      try {
        const s = JSON.parse(e.newValue);
        if (s && typeof s.coins === 'number') { state = { coins: s.coins, cards: s.cards || {}, ready: s.ready || {}, packs: s.packs || {}, next: s.next || {} }; updateRegen(); renderAll(); }
      } catch (err) { /* ignore */ }
    });

    // ---- Tabs: #shop, #packs (open your packs), #collection ----
    const TABS = ['shop', 'packs', 'collection'];
    function showTab() {
      let id = location.hash.slice(1);
      if (!TABS.includes(id)) id = 'packs';   // the Open tab is home (the free pack lives there)
      TABS.forEach((t) => {
        $('panel-' + t).hidden = t !== id;
        $('tab-' + t).setAttribute('aria-selected', String(t === id));
      });
    }
    TABS.forEach((t) => $('tab-' + t).addEventListener('click', () => { location.hash = '#' + t; }));
    window.addEventListener('hashchange', showTab);

    // ---- Start ----
    updateRegen();
    renderShop();
    renderCardShop();
    showTab();
    renderAll();
    save();   // a brand-new player's starting coins are saved straight away
    setInterval(() => { if (updateRegen()) renderAll(); refreshPacks(); refreshCardShop(); }, 1000);   // a free pack arrived? update the Open tab

    if (typeof Papa === 'undefined' || typeof parseTier === 'undefined') $('status').textContent = 'Couldn\u2019t load the card game files.';
    else Papa.parse(SHEET_CSV_URL, {
      download: true, header: true, skipEmptyLines: true,
      complete: (r) => {
        prepare(r.data.filter((i) => nameOf(i)));
        loaded = true;
        renderCardShop();
        $('status').textContent = `${byName.size} characters can be pulled.`;
        renderAll();
      },
      error: () => { $('status').textContent = 'Couldn\u2019t load the characters.'; }
    });
  </script>
</body>
</html>
