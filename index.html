<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Powerscaling Database</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-main: #c9d1d9;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --tier-badge: #238636;
      --tag-bg: #21262d;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }

    .container { max-width: 1100px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 30px; }
    h1 { color: #fff; margin-bottom: 15px; }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    #search {
      width: 100%;
      max-width: 400px;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: #fff;
      font-size: 1rem;
      outline: none;
    }
    #search:focus { border-color: var(--accent); }

    #sort-select {
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: #fff;
      font-size: 1rem;
      outline: none;
      cursor: pointer;
    }
    #sort-select:focus { border-color: var(--accent); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .card:hover { transform: translateY(-4px); border-color: var(--accent); }

    .card-img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      background: #000;
    }

    .card-body { padding: 16px; }
    .card-title { margin: 0 0 6px 0; color: #fff; font-size: 1.25rem; }

    .badge {
      display: inline-block;
      background: var(--tier-badge);
      color: #fff;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: bold;
    }

    .tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .tag {
      background: var(--tag-bg);
      border: 1px solid var(--border-color);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .tag:hover { background: var(--border-color); color: #fff; }

    .hidden { display: none !important; }

    .back-btn {
      background: var(--card-bg);
      color: var(--accent);
      border: 1px solid var(--border-color);
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      margin-bottom: 20px;
    }
    .back-btn:hover { background: var(--border-color); color: #fff; }

    .profile-header {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .profile-img {
      width: 100%;
      max-width: 300px;
      height: 350px;
      object-fit: cover;
      border-radius: 8px;
      background: #000;
    }

    .profile-info { flex: 1; min-width: 280px; }
    .profile-info h1 { margin-top: 0; font-size: 2.2rem; }

    .stats-section {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }

    .stat-box {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      padding: 12px 16px;
      border-radius: 8px;
    }

    .stat-label {
      color: var(--text-muted);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .stat-value { color: #fff; font-size: 1rem; }
    .full-width { grid-column: 1 / -1; }
  </style>
</head>
<body>

  <div class="container">
    <!-- Roster View -->
    <div id="roster-view">
      <header>
        <h1>Powerscaling Database</h1>
        <div class="controls">
          <input type="text" id="search" placeholder="Search by character name, tier, or tags..." oninput="filterAndSortRoster()">
          <select id="sort-select" onchange="filterAndSortRoster()">
            <option value="tier-desc">Tier (Strongest to Weakest / Tier 0 to 11)</option>
            <option value="tier-asc">Tier (Weakest to Strongest / Tier 11 to 0)</option>
            <option value="name-asc">Alphabetical (A - Z)</option>
            <option value="name-desc">Alphabetical (Z - A)</option>
          </select>
        </div>
      </header>
      <div id="character-grid" class="grid"></div>
    </div>

    <!-- Profile View -->
    <div id="profile-view" class="hidden">
      <button class="back-btn" onclick="showRoster()">← Back to Roster</button>
      <div id="profile-content"></div>
    </div>
  </div>

  <script>
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQWRS4v9F9SJ-Y4wUOO3efaf3UXCItz8EX4wK4QV6lnHX37MQMrchewnvjC9IcwYnehddX5VjBAzUxi/pub?output=csv';

    let characterData = [];

    const getCharName = (item) => item['Character Name'] || item.Character || '';
    const getTier = (item) => item['Tier / Tier range'] || item.Tier || 'N/A';
    const getAP = (item) => item['AP (Attack Potency)'] || item.AP || 'N/A';
    const getSpeed = (item) => item['Speed'] || item.Speed || 'N/A';
    const getDurability = (item) => item['Durability'] || item.Durability || 'N/A';
    const getStriking = (item) => item['Striking Strength'] || item['Striking Strength'] || 'N/A';
    const getLifting = (item) => item['Lifting Strength'] || item['Lifting Strength'] || 'N/A';
    const getStamina = (item) => item['Stamina'] || item.Stamina || 'N/A';
    const getRange = (item) => item['Range'] || item.Range || 'N/A';
    const getIntel = (item) => item['Intelligence'] || item.Intelligence || 'N/A';
    const getAbilities = (item) => item['Abilities'] || item['Hax / Abilities'] || 'N/A';
    const getEquip = (item) => item['Standard Equipment'] || item.Equipment || 'N/A';
    const getFeats = (item) => item['External links for primary feats'] || item['Feat / Proof Link'] || '';
    const getNotes = (item) => item['Notes'] || 'None';
    const getTags = (item) => item['Tags'] || item.Tags || '';
    
    const getImage = (item) => {
      const rawVal = item['Image Link / Name'] || item['Image Link'] || '';
      if (!rawVal.trim()) return '';
      const cleanFileName = rawVal.trim().replace(/^(\.\/)?(Images|images)\//, '');
      return `./Images/${cleanFileName}`;
    };

    async function loadDatabase() {
      Papa.parse(SHEET_CSV_URL, {
        download: true,
        header: true,
        complete: (results) => {
          characterData = results.data.filter(item => getCharName(item).trim() !== '');
          filterAndSortRoster();
        }
      });
    }

    function renderRoster(data) {
      const grid = document.getElementById('character-grid');
      grid.innerHTML = '';

      if (data.length === 0) {
        grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">No characters found.</p>';
        return;
      }

      data.forEach(item => {
        const charName = getCharName(item);
        const imageSrc = getImage(item) || 'https://via.placeholder.com/300x350?text=No+Image';
        const rawTags = getTags(item);
        const tagsArray = rawTags.split(',').map(t => t.replace(/"/g, '').trim()).filter(t => t.length > 0);

        const card = document.createElement('div');
        card.className = 'card';

        card.innerHTML = `
          <img class="card-img" src="${imageSrc}" alt="${charName}" onerror="this.src='https://via.placeholder.com/300x350?text=Image+Not+Found'">
          <div class="card-body" onclick="showProfile('${charName.replace(/'/g, "\\'")}')">
            <h2 class="card-title">${charName}</h2>
            <span class="badge">Tier ${getTier(item)}</span>
            <div class="tags-container">
              ${tagsArray.map(tag => `<span class="tag" onclick="event.stopPropagation(); searchByTag('${tag}')">${tag}</span>`).join('')}
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function showProfile(characterName) {
      const character = characterData.find(item => getCharName(item) === characterName);
      if (!character) return;

      document.getElementById('roster-view').classList.add('hidden');
      document.getElementById('profile-view').classList.remove('hidden');

      const charName = getCharName(character);
      const imageSrc = getImage(character) || 'https://via.placeholder.com/300x350?text=No+Image';
      const proofLink = getFeats(character) ? `<a href="${getFeats(character)}" target="_blank" style="color: var(--accent);">View Feat / Calculation Proof</a>` : 'N/A';
      const rawTags = getTags(character);
      const tagsArray = rawTags.split(',').map(t => t.replace(/"/g, '').trim()).filter(t => t.length > 0);

      const profileContent = document.getElementById('profile-content');
      profileContent.innerHTML = `
        <div class="profile-header">
          <img class="profile-img" src="${imageSrc}" alt="${charName}" onerror="this.src='https://via.placeholder.com/300x350?text=Image+Not+Found'">
          <div class="profile-info">
            <h1>${charName}</h1>
            <div style="margin-top: 15px;"><span class="badge" style="font-size: 1rem;">Tier ${getTier(character)}</span></div>
            <div class="tags-container" style="margin-top: 15px;">
              ${tagsArray.map(tag => `<span class="tag" onclick="searchByTag('${tag}')">${tag}</span>`).join('')}
            </div>
          </div>
        </div>

        <div class="stats-section">
          <h2>Combat Metrics & Powerscaling</h2>
          <div class="stats-grid">
            <div class="stat-box"><div class="stat-label">Attack Potency (AP)</div><div class="stat-value">${getAP(character)}</div></div>
            <div class="stat-box"><div class="stat-label">Speed</div><div class="stat-value">${getSpeed(character)}</div></div>
            <div class="stat-box"><div class="stat-label">Durability</div><div class="stat-value">${getDurability(character)}</div></div>
            <div class="stat-box"><div class="stat-label">Striking Strength</div><div class="stat-value">${getStriking(character)}</div></div>
            <div class="stat-box"><div class="stat-label">Lifting Strength</div><div class="stat-value">${getLifting(character)}</div></div>
            <div class="stat-box"><div class="stat-label">Standard Equipment</div><div class="stat-value">${getEquip(character)}</div></div>
            <div class="stat-box full-width"><div class="stat-label">Abilities / Hax</div><div class="stat-value">${getAbilities(character)}</div></div>
            <div class="stat-box full-width"><div class="stat-label">Feats & Primary Calculation Links</div><div class="stat-value">${proofLink}</div></div>
            <div class="stat-box full-width"><div class="stat-label">Notes / Additional Context</div><div class="stat-value">${getNotes(character)}</div></div>
          </div>
        </div>
      `;
      window.scrollTo(0, 0);
    }

    function showRoster() {
      document.getElementById('profile-view').classList.add('hidden');
      document.getElementById('roster-view').classList.remove('hidden');
    }

    // Official VS Battles Wiki Tier Ranking Map (Higher score = Stronger tier)
    function parseTierWeight(tierStr) {
      if (!tierStr) return 0;
      let t = tierStr.toUpperCase().trim();

      // Exact hierarchical weights matching VS Battles Wiki
      const mapping = {
        '0': 1000,
        'HIGH 1-A': 910, '1-A': 900, 'LOW 1-A': 890,
        'HIGH 1-B': 860, '1-B': 850,
        'HIGH 1-C': 820, '1-C': 810, 'LOW 1-C': 800,
        '2-A': 730, '2-B': 720, '2-C': 710, 'LOW 2-C': 700,
        'HIGH 3-A': 640, '3-A': 630, '3-B': 620, '3-C': 610,
        'HIGH 4-A': 540, '4-A': 530, '4-B': 520, 'HIGH 4-C': 515, '4-C': 510, 'LOW 4-C': 505,
        'HIGH 5-A': 445, '5-A': 440, '5-B': 430, 'LOW 5-B': 420, '5-C': 410,
        'HIGH 6-A': 365, '6-A': 360, 'HIGH 6-B': 355, '6-B': 350, 'LOW 6-B': 345, 'HIGH 6-C': 340, '6-C': 335,
        'HIGH 7-A': 275, '7-A': 270, '7-B': 265, 'LOW 7-B': 260, 'HIGH 7-C': 255, '7-C': 250, 'LOW 7-C': 245,
        'HIGH 8-C': 190, '8-A': 185, '8-B': 180, '8-C': 175,
        '9-A': 125, '9-B': 120, '9-C': 115,
        '10-A': 75, '10-B': 70, '10-C': 65,
        '11-A': 25, '11-B': 20, '11-C': 15
      };

      for (let key in mapping) {
        if (t.includes(key)) {
          return mapping[key];
        }
      }
      return 50; // default fallback
    }

    function filterAndSortRoster() {
      const query = document.getElementById('search').value.toLowerCase();
      const sortValue = document.getElementById('sort-select').value;

      let filtered = characterData.filter(item =>
        getCharName(item).toLowerCase().includes(query) ||
        getTier(item).toLowerCase().includes(query) ||
        getTags(item).toLowerCase().includes(query)
      );

      filtered.sort((a, b) => {
        const nameA = getCharName(a).toLowerCase();
        const nameB = getCharName(b).toLowerCase();

        if (sortValue === 'name-asc') {
          return nameA.localeCompare(nameB);
        } else if (sortValue === 'name-desc') {
          return nameB.localeCompare(nameA);
        } else {
          const weightA = parseTierWeight(getTier(a));
          const weightB = parseTierWeight(getTier(b));

          if (sortValue === 'tier-desc') {
            // Strongest to Weakest (Tier 0 -> Tier 11)
            return weightB - weightA;
          } else {
            // Weakest to Strongest (Tier 11 -> Tier 0)
            return weightA - weightB;
          }
        }
      });

      renderRoster(filtered);
    }

    function searchByTag(tag) {
      showRoster();
      const searchInput = document.getElementById('search');
      searchInput.value = tag;
      filterAndSortRoster();
    }

    loadDatabase();
  </script>
</body>
</html>
