<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compare - Powerscaling Database</title>
  <link rel="stylesheet" href="site.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <script src="tiers.js"></script>
  <style>
    .sec-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .sec-head h2 { margin: 0; }
    .matchup { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: start; }
    .vs { align-self: center; color: var(--text-muted); font-weight: 700; letter-spacing: 0.1em; }
    .pick { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-main); font-size: 1rem; }
    .pick:focus { outline: none; border-color: var(--accent); }
    .fighter { margin-top: 12px; }
    .fighter img { width: 100%; max-height: 320px; object-fit: cover; border-radius: 10px; background: #000; border: 1px solid var(--border-color); }
    .fighter h3 { color: #fff; margin: 12px 0 8px; }
    .row { background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
    .lbl { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 2px; }
    .val { color: #fff; white-space: pre-line; }
    .btn { background: var(--tag-bg); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 16px; cursor: pointer; font-size: 0.95rem; }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn.small { padding: 4px 10px; font-size: 0.8rem; }
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--border-color); margin-bottom: 20px; }
    .tab { background: none; border: none; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--text-muted); padding: 10px 16px; cursor: pointer; font-size: 0.95rem; }
    .tab:hover { color: var(--text-main); }
    .tab[aria-selected="true"] { color: #fff; border-bottom-color: var(--accent); }
    .pick-btn { width: 100%; text-align: left; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-main); font-size: 1rem; cursor: pointer; }
    .pick-btn:hover, .pick-btn:focus { border-color: var(--accent); outline: none; }
    .browser { margin-top: 8px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-color); padding: 10px; max-height: 320px; overflow: auto; }
    .group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 8px; font-size: 0.85rem; }
    .crumb-btn { background: none; border: none; padding: 0; color: var(--accent); cursor: pointer; font-size: 0.85rem; }
    .crumb-cur { color: #fff; font-weight: 600; }
    .opt { background: var(--tag-bg); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 0.85rem; }
    .opt:hover { border-color: var(--accent); color: var(--accent); }
    .opt span { color: var(--text-muted); margin-left: 6px; }
    .opt.char { background: var(--card-bg); }
    .pick-row { display: flex; gap: 8px; }
    .pick-row .pick-btn { flex: 1; min-width: 0; }
    .rand-btn { white-space: nowrap; }
    .browser-search { width: 100%; padding: 8px 10px; margin-bottom: 10px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-main); font-size: 0.9rem; }
    .browser-search:focus { outline: none; border-color: var(--accent); }
    .guess-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .guess-head h2 { margin: 0; }
    .streak { color: var(--text-muted); }
    .streak b { color: #fff; font-size: 1.3rem; }
    .gcard { background: var(--bg-color); border: 2px solid var(--border-color); border-radius: 12px; padding: 12px; text-align: center; }
    .gcard img { width: 100%; max-height: 300px; object-fit: cover; border-radius: 8px; background: #000; }
    .gcard h3 { color: #fff; margin: 10px 0; }
    .gcard .btn { width: 100%; }
    .gcard.win { border-color: #238636; }
    .gcard.lose { border-color: #da3633; }
    .reveal { margin-top: 10px; color: var(--text-muted); font-size: 0.9rem; white-space: pre-line; }
    .guess-msg { text-align: center; font-weight: 600; min-height: 1.5em; margin: 14px 0 10px; }
    .guess-msg.ok { color: #3fb950; }
    .guess-msg.bad { color: #f85149; }
    a.btn { text-decoration: none; display: inline-block; }
    .sets-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
    .set-card { background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 10px; padding: 14px; color: var(--text-main); text-decoration: none; display: flex; flex-direction: column; gap: 4px; }
    .set-card:hover { border-color: var(--accent); }
    .set-card span { color: var(--text-muted); font-size: 0.85rem; }
    .set-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
    .g-picker { margin: 14px 0; }
    .g-result { margin-bottom: 18px; }
    .g-card { border: 2px solid transparent; border-radius: 12px; padding: 8px; }
    .g-card.win { border-color: #238636; }
    .g-card.lose { border-color: #da3633; }
    .g-card.tie { border-color: #d29922; }
    .g-card.unk { border-color: var(--border-color); }
    .g-badge { margin-top: 8px; font-weight: 600; font-size: 0.9rem; color: var(--text-muted); }
    .g-card.win .g-badge { color: #3fb950; }
    .g-card.lose .g-badge { color: #f85149; }
    .g-card.tie .g-badge { color: #d29922; }
    @media (max-width: 700px) { .matchup { grid-template-columns: 1fr; } .vs { justify-self: center; } }
  </style>
</head>
<body>
  <nav class="site-nav">
    <a class="brand" href="index.html">Powerscaling Database</a>
    <div class="links">
      <a href="index.html">Home</a>
      <a href="database.html">Characters</a>
      <a href="compare.html" aria-current="page">Compare</a>
      <a href="cards.html">Cards</a>
      <a href="calculators.html">Calculators</a>
      <a href="terms.html">Terms</a>
      <a href="settings.html">Settings</a>
    </div>
  </nav>

  <main class="container">
    <header>
      <h1>Compare</h1>
      <p class="muted" id="status">Loading characters...</p>
    </header>

    <div class="tabs" id="tabs" role="tablist"></div>
    <div id="panels"></div>
  </main>

  <script>
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQWRS4v9F9SJ-Y4wUOO3efaf3UXCItz8EX4wK4QV6lnHX37MQMrchewnvjC9IcwYnehddX5VjBAzUxi/pub?gid=2100327724&single=true&output=csv';
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const FALLBACK_IMG = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="350"><rect width="100%" height="100%" fill="#000"/><text x="50%" y="50%" fill="#8b949e" font-family="sans-serif" font-size="16" text-anchor="middle">No image</text></svg>');

    document.addEventListener('error', (e) => {
      const el = e.target;
      if (el.tagName === 'IMG' && !el.dataset.fb) { el.dataset.fb = '1'; el.src = FALLBACK_IMG; }
    }, true);

    const val = (item, ...keys) => { for (const k of keys) { const v = (item[k] || '').trim(); if (v) return v; } return ''; };
    const isEmpty = (v) => !v || /^(none|n\/a)$/i.test(v.trim());   // "None" fields are not shown
    const nameOf = (item) => val(item, 'Character Name', 'Character');
    const imageOf = (item) => {
      const raw = val(item, 'Image Link / Name', 'Image Link');
      if (!raw) return '';
      if (/^https?:\/\//i.test(raw)) return raw;
      return './Images/' + raw.replace(/^(\.\/)?images\//i, '').replace(/[#?]/g, (c) => encodeURIComponent(c));
    };

    const FIELDS = [
      ['Attack Potency', ['AP (Attack Potency)', 'AP']],
      ['Durability', ['Durability']],
      ['Speed', ['Speed']],
      ['Abilities', ['Abilities', 'Hax / Abilities']],
      ['Items', ['Standard Equipment', 'Equipment']]
    ];

        function fighterHtml(c) {
      const rows = FIELDS.map(([label, keys]) => {
        const v = val(c, ...keys);
        return isEmpty(v) ? '' : `<div class="row"><div class="lbl">${label}</div><div class="val">${esc(v)}</div></div>`;
      }).join('');
      return `<img src="${esc(imageOf(c) || FALLBACK_IMG)}" alt="${esc(nameOf(c))}"><h3>${esc(nameOf(c))}</h3>${rows}`;
    }

    // ---- Tabs: each comparison type is one entry in TABS. To add a type, write a build function and add it below. ----
    // ---- Folder tree, built from the "Folders" column (e.g. Marvel, MCU, Phase 1, Iron Man (2008)) ----
    const newNode = (name) => ({ name, kids: new Map(), chars: [], count: 0 });
    let root = newNode('Home');
    let allChars = [];
    const refreshers = [];

    function buildTree(chars) {
      allChars = chars;
      root = newNode('Home');
      chars.forEach((c) => {
        let node = root;
        node.count++;
        const parts = val(c, 'Folders', 'Folder').split(/\s*,\s*/).filter(Boolean);
        (parts.length ? parts : ['Not Sorted']).forEach((name) => {
          const key = name.toLowerCase().replace(/\s+/g, ' ');
          if (!node.kids.has(key)) node.kids.set(key, newNode(name));
          node = node.kids.get(key);
          node.count++;
        });
        node.chars.push(c);   // characters with no folder end up in "Not Sorted"
      });
    }

    // ---- Character picker: browse folders, search, or pick at random. Calls onPick(character). ----
    function createPicker(host, label, onPick) {
      host.innerHTML = `<div class="pick-row"><button type="button" class="pick-btn">${esc(label)} &#9662;</button><button type="button" class="btn rand-btn" title="Pick a random character">Random</button></div>
        <div class="browser" hidden><input type="search" class="browser-search" placeholder="Search characters..." autocomplete="off" aria-label="Search characters"><div class="browser-list"></div></div>`;
      const btn = host.querySelector('.pick-btn'), browser = host.querySelector('.browser');
      const search = host.querySelector('.browser-search'), list = host.querySelector('.browser-list');
      let path = [], shown = [];

      function render() {
        if (!root.count) { list.innerHTML = '<p class="muted">Loading characters...</p>'; return; }
        // Typing searches every character, ignoring folders; clear the box to go back to the folders
        const q = search.value.trim().toLowerCase();
        if (q) {
          const matches = allChars.filter((c) => nameOf(c).toLowerCase().includes(q)).sort((a, b) => nameOf(a).localeCompare(nameOf(b)));
          shown = matches.slice(0, 100);
          list.innerHTML = `<div class="group muted">${matches.length ? matches.length + ' found' + (matches.length > 100 ? ' (showing 100)' : '') : 'No matches.'}</div>` +
            (shown.length ? `<div class="group">${shown.map((c, i) => `<button type="button" class="opt char" data-i="${i}">${esc(nameOf(c))}</button>`).join('')}</div>` : '');
          return;
        }
        let n = root;
        const trail = [{ name: 'Home', path: [] }].concat(path.map((k, i) => { n = n.kids.get(k); return { name: n.name, path: path.slice(0, i + 1) }; }));
        const crumbs = trail.map((t, i) => i === trail.length - 1
          ? `<span class="crumb-cur">${esc(t.name)}</span>`
          : `<button type="button" class="crumb-btn" data-path="${esc(JSON.stringify(t.path))}">${esc(t.name)}</button>`).join('<span class="muted">\u203A</span>');
        const folders = [...n.kids.entries()].sort((a, b) => a[1].name.localeCompare(b[1].name))
          .map(([k, f]) => `<button type="button" class="opt" data-path="${esc(JSON.stringify([...path, k]))}">${esc(f.name)}<span>${f.count}</span></button>`).join('');
        shown = [...n.chars].sort((a, b) => nameOf(a).localeCompare(nameOf(b)));
        const chars = shown.map((c, i) => `<button type="button" class="opt char" data-i="${i}">${esc(nameOf(c))}</button>`).join('');
        list.innerHTML = `<div class="group">${crumbs}</div>` + (folders ? `<div class="group">${folders}</div>` : '') + (chars ? `<div class="group">${chars}</div>` : '');
      }

      function choose(ch) {
        search.value = '';
        btn.textContent = nameOf(ch) + ' \u25BE';
        browser.hidden = true;
        onPick(ch);
      }
      host.querySelector('.rand-btn').addEventListener('click', () => {
        if (allChars.length) choose(allChars[Math.floor(Math.random() * allChars.length)]);
      });
      btn.addEventListener('click', () => { browser.hidden = !browser.hidden; if (!browser.hidden) render(); });
      browser.addEventListener('click', (e) => {
        const f = e.target.closest('[data-path]');
        if (f) { path = JSON.parse(f.dataset.path); return render(); }
        const c = e.target.closest('[data-i]');
        if (c) choose(shown[+c.dataset.i]);
      });
      search.addEventListener('input', render);
      refreshers.push(() => { if (!browser.hidden) render(); });
    }

    // ---- Compare tab: two pickers, side by side ----
    function buildCompare(el) {
      const side = () => '<div class="side"><div class="picker"></div><div class="fighter"></div></div>';
      el.innerHTML = `<div class="matchup">${side()}<div class="vs">VS</div>${side()}</div>`;
      el.querySelectorAll('.side').forEach((s, i) => {
        const box = s.querySelector('.fighter');
        createPicker(s.querySelector('.picker'), `Choose character ${i + 1}`, (ch) => { box.innerHTML = fighterHtml(ch); });
      });
    }

    // ---- Guess tab: pick which of two random characters is stronger (by tier) ----
    function buildGuess(el) {
      el.innerHTML = `<div class="guess-head"><h2>Who’s stronger?</h2><div class="streak">Streak: <b class="streak-n">0</b> &nbsp;&middot;&nbsp; Best: <b class="best-n">0</b> &nbsp;&middot;&nbsp; Difficulty: <b class="gap-n">1</b></div></div>
        <p class="muted" style="margin: 0 0 14px;">Every correct guess earns coins for the Cards game, equal to your current streak.</p>
        <div class="matchup"><div class="gcard"></div><div class="vs">VS</div><div class="gcard"></div></div>
        <p class="guess-msg muted"></p>
        <div style="text-align:center"><button type="button" class="btn next-btn" hidden>Next matchup</button></div>`;
      const cards = el.querySelectorAll('.gcard'), msg = el.querySelector('.guess-msg');
      const nextBtn = el.querySelector('.next-btn'), streakEl = el.querySelector('.streak-n'), bestEl = el.querySelector('.best-n'), gapEl = el.querySelector('.gap-n');
      let pair = [], answered = false, streak = 0;
      // Personal best is saved in this browser so it survives a refresh
      // Coins go into the Cards game's saved data (same browser), so they show up on the Cards page
      const COINS_PER_STREAK = 1;   // coins earned per point of streak (1 = a correct guess at streak 6 pays 6 coins)
      function addCoins(n) {
        try {
          const KEY = 'powerscaling-cards-v2';
          let s = JSON.parse(localStorage.getItem(KEY));
          if (!s || typeof s.coins !== 'number') s = { coins: 100, cards: JSON.parse(localStorage.getItem('powerscaling-cards-v1')) || {}, ready: {} };
          s.coins += n;
          localStorage.setItem(KEY, JSON.stringify(s));
        } catch (err) { /* storage unavailable: no coins this time */ }
        return n;
      }
      const BEST_KEY = 'powerscaling-guess-best';
      let best = 0;
      try { best = parseInt(localStorage.getItem(BEST_KEY), 10) || 0; } catch (err) { best = 0; }
      bestEl.textContent = best;
      const tierOf = (c) => val(c, 'Tier / Tier range', 'Tier');
      const tw = (c) => parseTierWeight(tierOf(c));
      const say = (text, cls) => { msg.textContent = text; msg.className = 'guess-msg ' + (cls || 'muted'); };
      const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
      // Difficulty: the biggest allowed tier gap starts at 50 and shrinks by 1 for every 5 correct in a row, down to 1 (difficulty 50)
      const maxGap = () => Math.max(1, 50 - Math.floor(streak / 5));
      const showGap = () => { const level = Math.min(50, Math.floor(streak / 5) + 1); gapEl.textContent = level >= 50 ? '50 (max)' : level; };

      function newRound() {
        nextBtn.hidden = true;
        if (!allChars.length) { say('Loading characters...'); return; }
        const pool = allChars.filter((c) => tw(c) !== null);   // only characters with a recognised tier
        const w = new Map(pool.map((c) => [c, tw(c)]));
        const st = new Map(pool.map((c) => [c, parseTierStep(tierOf(c))]));
        // Two characters whose tiers differ by at least 1 and at most `limit` steps in the tier list
        const findPair = (limit) => {
          for (let t = 0; t < 100; t++) {
            const x = pick(pool);
            const near = pool.filter((c) => { if (w.get(c) === w.get(x)) return false; return Math.max(1, Math.abs(st.get(c) - st.get(x))) <= limit; });
            if (near.length) return [x, pick(near)];
          }
          return null;
        };
        // If the sheet has no pair that close, fall back to any two different tiers so the game keeps going
        const found = pool.length >= 2 && (findPair(maxGap()) || findPair(Infinity));
        if (!found) { say('Not enough characters with different tiers to play yet.'); return; }
        const [a, b] = found;
        showGap();
        pair = [a, b];
        answered = false;
        say('Click the character you think is stronger.');
        cards.forEach((card, i) => {
          card.className = 'gcard';
          card.innerHTML = `<img src="${esc(imageOf(pair[i]) || FALLBACK_IMG)}" alt="${esc(nameOf(pair[i]))}"><h3>${esc(nameOf(pair[i]))}</h3><button type="button" class="btn guess-btn" data-i="${i}">Stronger</button><div class="reveal"></div>`;
        });
      }

      el.addEventListener('click', (e) => {
        const g = e.target.closest('.guess-btn');
        if (!g || answered) return;
        answered = true;
        const win = tw(pair[0]) > tw(pair[1]) ? 0 : 1;
        const correct = +g.dataset.i === win;
        const before = streak;
        const reward = correct ? addCoins((before + 1) * COINS_PER_STREAK) : 0;   // the longer the streak, the more it pays
        streak = correct ? streak + 1 : 0;   // a wrong guess resets the counter
        streakEl.textContent = streak;
        showGap();
        let newBest = false;
        if (streak > best) {
          best = streak;
          newBest = true;
          bestEl.textContent = best;
          try { localStorage.setItem(BEST_KEY, String(best)); } catch (err) { /* storage unavailable: best just won't persist */ }
        }
        cards.forEach((card, k) => {
          card.classList.add(k === win ? 'win' : 'lose');
          const ap = val(pair[k], 'AP (Attack Potency)', 'AP');
          card.querySelector('.reveal').textContent = 'Tier ' + tierOf(pair[k]) + (isEmpty(ap) ? '' : '\nAP: ' + ap);
          card.querySelector('.guess-btn').disabled = true;
        });
        say(correct ? 'Correct! Streak: ' + streak + ' \u00b7 +' + reward + (reward === 1 ? ' coin' : ' coins') + (newBest ? ' (new personal best!)' : '') : 'Wrong. Your streak of ' + before + ' was reset to 0.', correct ? 'ok' : 'bad');
        nextBtn.hidden = false;
      });
      nextBtn.addEventListener('click', newRound);
      refreshers.push(() => { if (!pair.length) newRound(); });   // start once the sheet has loaded
      newRound();
    }

    // ---- Gauntlet Matchups tab: sets of characters listed in the "Gauntlet Matchups" tab of the Google Sheet ----
    // Paste the gid number of the "Gauntlet Matchups" tab here (the number after gid= in the address bar while that tab is open)
    const SETS_GID = '1150615926';
    const SETS_CSV_URL = SETS_GID ? `https://docs.google.com/spreadsheets/d/e/2PACX-1vQWRS4v9F9SJ-Y4wUOO3efaf3UXCItz8EX4wK4QV6lnHX37MQMrchewnvjC9IcwYnehddX5VjBAzUxi/pub?gid=${SETS_GID}&single=true&output=csv` : '';
    let SETS = null;        // null until the sets tab has loaded
    let setsError = false;
    const tierText = (c) => val(c, 'Tier / Tier range', 'Tier');

    function buildGauntlet(el) {
      el.innerHTML = '<div class="sets-list"></div><div class="set-view" hidden></div>';
      const listEl = el.querySelector('.sets-list'), viewEl = el.querySelector('.set-view');

      function render() {
        if (!SETS_CSV_URL) { listEl.hidden = false; viewEl.hidden = true; listEl.innerHTML = '<p class="muted">No sets yet. Put the gid of the Gauntlet Matchups tab into SETS_GID in compare.html.</p>'; return; }
        if (SETS === null || !allChars.length) { listEl.hidden = false; viewEl.hidden = true; listEl.innerHTML = '<p class="muted">Loading...</p>'; return; }
        const m = location.hash.match(/^#gauntlet\/(.+)$/);
        let wanted = '';
        try { wanted = m ? decodeURIComponent(m[1]) : ''; } catch (err) { wanted = ''; }
        const set = SETS.find((x) => x.slug === wanted);
        listEl.hidden = !!set;
        viewEl.hidden = !set;
        if (!set) {
          listEl.innerHTML = SETS.length
            ? SETS.map((x) => `<a class="set-card" href="#gauntlet/${esc(x.slug)}"><b>${esc(x.name)}</b><span>${x.names.length} characters</span></a>`).join('')
            : `<p class="muted">${setsError ? "Couldn't load the sets sheet." : 'No sets in the sheet yet.'}</p>`;
          return;
        }
        const byName = new Map(allChars.map((c) => [nameOf(c).toLowerCase(), c]));
        const found = set.names.map((n) => byName.get(n.toLowerCase())).filter(Boolean);
        const missing = set.names.filter((n) => !byName.has(n.toLowerCase()));
        viewEl.innerHTML = `<div class="sec-head"><h2>${esc(set.name)}</h2><a class="btn small" href="#gauntlet">All sets</a></div>` +
          (missing.length ? `<p class="muted">Not found in the character sheet: ${esc(missing.join(', '))}</p>` : '') +
          `<p class="muted">Pick a character to see how many of these they can beat. Compared by tier: a higher tier wins, the same tier is a tie.</p>
           <div class="g-picker"></div><div class="g-result"></div>
           <div class="set-grid">${found.map((c) => `<div class="fighter g-card">${fighterHtml(c)}<div class="g-badge"></div></div>`).join('')}</div>`;

        const cards = viewEl.querySelectorAll('.g-card'), result = viewEl.querySelector('.g-result');
        createPicker(viewEl.querySelector('.g-picker'), 'Choose your character', (ch) => {
          const mine = parseTierWeight(tierText(ch));
          let wins = 0, ties = 0;
          cards.forEach((card, i) => {
            const theirs = parseTierWeight(tierText(found[i]));
            let cls = 'unk', text = 'Can’t compare (no recognised tier)';
            if (mine !== null && theirs !== null) {
              if (mine > theirs) { cls = 'win'; text = 'Beaten'; wins++; }
              else if (mine < theirs) { cls = 'lose'; text = 'Loses'; }
              else { cls = 'tie'; text = 'Tie'; ties++; }
              text += ' · their tier: ' + tierText(found[i]);
            }
            card.className = 'fighter g-card ' + cls;
            card.querySelector('.g-badge').textContent = text;
          });
          result.innerHTML = mine === null
            ? `<p class="muted">${esc(nameOf(ch))} doesn’t have a recognised tier, so there’s nothing to compare.</p>`
            : `<div class="tier-out">${esc(nameOf(ch))} beats ${wins} of ${found.length}</div>
               <p class="muted">Tier ${esc(tierText(ch))}${ties ? ` · ${ties} tie${ties > 1 ? 's' : ''}` : ''}${wins === found.length && found.length ? ' · cleared the gauntlet!' : ''}</p>`;
        });
      }
      window.addEventListener('hashchange', render);
      refreshers.push(render);
      render();
    }

    const TABS = [
      { id: 'compare', title: 'Compare', build: buildCompare },
      { id: 'guess', title: 'Who’s Stronger?', build: buildGuess },
      { id: 'gauntlet', title: 'Gauntlet Matchups', build: buildGauntlet }
    ];

    TABS.forEach((t) => {
      const btn = document.createElement('button');
      btn.className = 'tab';
      btn.id = 'tab-' + t.id;
      btn.textContent = t.title;
      btn.setAttribute('role', 'tab');
      btn.addEventListener('click', () => { location.hash = '#' + t.id; });
      $('tabs').appendChild(btn);

      const panel = document.createElement('section');
      panel.className = 'panel';
      panel.id = 'panel-' + t.id;
      t.build(panel);   // built once, so picks are kept when switching tabs
      $('panels').appendChild(panel);
    });

    function showTab() {
      const first = location.hash.split('/')[0];
      const id = (TABS.find((t) => '#' + t.id === first) || TABS[0]).id;
      TABS.forEach((t) => {
        $('panel-' + t.id).hidden = t.id !== id;
        $('tab-' + t.id).setAttribute('aria-selected', String(t.id === id));
      });
    }
    window.addEventListener('hashchange', showTab);
    showTab();

    // ---- Load the sets tab (name + list of characters per row) ----
    function loadSets() {
      if (!SETS_CSV_URL || typeof Papa === 'undefined') return;
      Papa.parse(SETS_CSV_URL, {
        download: true, header: true, skipEmptyLines: true,
        complete: (r) => {
          const used = new Set();
          SETS = r.data.map((row) => {
            const name = (row['Gauntlet Name'] || row['Name'] || row['Set'] || row[Object.keys(row)[0]] || '').trim();
            // Character names can be separated by commas (not the ones inside parentheses), line breaks, semicolons or |
            const names = (row['Characters'] || row['Character List'] || '').split(/\r?\n|;|\||,(?![^()]*\))/).map((x) => x.trim()).filter(Boolean);
            return { name, names };
          }).filter((x) => x.name && x.names.length).map((x) => {
            const base = x.name.normalize('NFKD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'set';
            let slug = base, n = 2;
            while (used.has(slug)) slug = `${base}-${n++}`;
            used.add(slug);
            return { ...x, slug };
          });
          refreshers.forEach((f) => f());
        },
        error: () => { SETS = []; setsError = true; refreshers.forEach((f) => f()); }
      });
    }
    loadSets();

    // ---- Load characters from the sheet ----
    function fail(msg) { $('status').textContent = "Couldn't load characters. " + (msg || ''); }

    if (typeof Papa === 'undefined') fail('The CSV library did not load.');
    else Papa.parse(SHEET_CSV_URL, {
      download: true, header: true, skipEmptyLines: true,
      complete: (r) => {
        const chars = r.data.filter((i) => nameOf(i));
        buildTree(chars);
        $('status').textContent = `${chars.length} characters available. Pick two characters by browsing the folders.`;
        refreshers.forEach((f) => f());
      },
      error: (err) => fail(err && err.message)
    });
  </script>
</body>
</html>
