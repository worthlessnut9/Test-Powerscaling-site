<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculators - Powerscaling Database</title>
  <link rel="stylesheet" href="site.css">
  <style>
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--border-color); margin-bottom: 20px; }
    .tab { background: none; border: none; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--text-muted); padding: 10px 16px; cursor: pointer; font-size: 0.95rem; }
    .tab:hover { color: var(--text-main); }
    .tab[aria-selected="true"] { color: #fff; border-bottom-color: var(--accent); }
    .calc-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 20px; }
    .calc-in, .calc-sel { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-main); font-size: 1rem; }
    .calc-in { flex: 1; min-width: 160px; }
    .calc-sel { min-width: 160px; }
    .calc-in:focus, .calc-sel:focus { outline: none; border-color: var(--accent); }
    .tier-out { font-size: 1.8rem; font-weight: 700; color: #fff; }
    .table-wrap { overflow-x: auto; }
    .calc-table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 0.9rem; }
    .calc-table th, .calc-table td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border-color); white-space: nowrap; }
    .calc-table th { color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; }
    .subtabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .subtabs .tab { border: 1px solid var(--border-color); border-radius: 6px; padding: 6px 12px; font-size: 0.9rem; margin-bottom: 0; }
    .subtabs .tab[aria-selected="true"] { background: var(--tag-bg); color: #fff; border-color: var(--accent); }
  </style>
</head>
<body>
  <nav class="site-nav">
    <a class="brand" href="index.html">Powerscaling Database</a>
    <div class="links">
      <a href="index.html">Home</a>
      <a href="database.html">Characters</a>
      <a href="compare.html">Compare</a>
      <a href="calculators.html" aria-current="page">Calculators</a>
      <a href="terms.html">Terms</a>
    </div>
  </nav>
  <main class="container">
    <header>
      <h1>Calculators</h1>
    </header>

    <div class="tabs" id="tabs" role="tablist"></div>
    <div id="panels"></div>
  </main>
  <script>
    const C = 299792458;   // speed of light, m/s

    // ---- Tier data. Each row is [name, lower bound, note]. A value belongs to the last tier whose lower bound it reaches. ----
    // Speed tiers: lower bounds in m/s. The relativistic tiers use exact fractions of c.
    const SPEED_TIERS = [
      ['Immobile', 0], ['Below Average Human', 0], ['Average Human', 5], ['Athletic Human', 7.7], ['Peak Human', 10.03], ['Superhuman', 12.43],
      ['Subsonic (Faster than the Eye)', 34.3], ['Subsonic+', 171.5], ['Transonic', 308.7], ['Supersonic', 377.3], ['Supersonic+', 857.5],
      ['Hypersonic', 1715], ['Hypersonic+', 3430], ['High Hypersonic', 8575], ['High Hypersonic+', 17150], ['Massively Hypersonic', 34300],
      ['Massively Hypersonic+', 343000], ['Sub-Relativistic', C * 0.01], ['Sub-Relativistic+', C * 0.05], ['Relativistic', C * 0.1],
      ['Relativistic+', C * 0.5], ['Speed of Light', C], ['FTL', C], ['FTL+', C * 10], ['Massively FTL', C * 100], ['Massively FTL+', C * 1000]
    ];
    const SPEED_UNITS = [['m/s', 1], ['km/h', 1 / 3.6], ['mph', 0.44704], ['Mach', 343], ['% of light speed', C / 100], ['× light speed', C]];

    // Strength tiers: lower bounds in Joules; the note is the level name.
    const STRENGTH_TIERS = [
      ['10-C', 0, 'Below Average Human'], ['10-B', 6e1, 'Human'], ['10-A', 1.06e2, 'Athlete'], ['9-C', 3e2, 'Street'], ['9-B', 1.5e4, 'Wall'],
      ['9-A', 2.092e7, 'Small Building'], ['8-C', 1.046e9, 'Building'], ['High 8-C', 8.368e9, 'Large Building'], ['8-B', 4.6024e10, 'City Block'],
      ['8-A', 4.184e11, 'Multi-City Block'], ['Low 7-C', 4.184e12, 'Small Town'], ['7-C', 2.42672e13, 'Town'], ['High 7-C', 4.184e14, 'Large Town'],
      ['Low 7-B', 4.184e15, 'Small City'], ['7-B', 2.63592e16, 'City'], ['7-A', 4.184e17, 'Mountain'], ['High 7-A', 4.184e18, 'Large Mountain'],
      ['6-C', 1.79912e19, 'Island'], ['High 6-C', 4.184e20, 'Large Island'], ['Low 6-B', 4.184e21, 'Small Country'], ['6-B', 2.9288e22, 'Country'],
      ['High 6-B', 4.184e23, 'Large Country'], ['6-A', 3.17984e24, 'Continent'], ['High 6-A', 1.855604e25, 'Multi-Continent'], ['5-C', 1.24e29, 'Moon'],
      ['Low 5-B', 1.81e30, 'Small Planet'], ['5-B', 2.487e32, 'Planet'], ['5-A', 1.59e34, 'Large Planet'], ['High 5-A', 6.906e37, 'Brown Dwarf'],
      ['Low 4-C', 3.139e40, 'Small Star'], ['4-C', 5.693e41, 'Star'], ['High 4-C', 3.182e42, 'Large Star'], ['4-B', 2.923e45, 'Solar System'],
      ['4-A', 2.008e57, 'Multi-Solar System'], ['3-C', 1.053e66, 'Galaxy'], ['3-B', 8.593e68, 'Multi-Galaxy'], ['3-A', 2.825e92, 'Universe']
    ];
    // Units in Joules (1 ton of TNT = 4.184e9 J, 1 Foe = 1e44 J)
    const TNT_NAMES = ['Tons of TNT', 'Kilotons', 'Megatons', 'Gigatons', 'Teratons', 'Petatons', 'Exatons', 'Zettatons', 'Yottatons', 'Ronnatons', 'Quettatons'];
    const STRENGTH_UNITS = [
      ['Joules', 1], ['Kilojoules', 1e3], ['Megajoules', 1e6], ['Gigajoules', 1e9],
      ...TNT_NAMES.map((n, i) => [n, Number('4.184e' + (9 + 3 * i))]),
      ['Foe', 1e44], ['TeraFoe', 1e56], ['ZettaFoe', 1e65], ['YottaFoe', 1e68], ['QuettaexaFoe', 1e92]
    ];

    const SPEED = { title: 'Speed Tier Calculator', hint: 'Enter a speed and pick its unit to see which speed tier it falls in.', placeholder: 'e.g. 1500',
      tiers: SPEED_TIERS, exact: ['Immobile', 'Speed of Light'], units: SPEED_UNITS, rows: SPEED_UNITS };
    const STRENGTH = { title: 'Strength Tier Calculator', hint: 'Enter an amount of energy and pick its unit to see which strength tier it falls in.', placeholder: 'e.g. 5 (or 1e20)',
      tiers: STRENGTH_TIERS, exact: [], units: STRENGTH_UNITS,
      rows: [['Joules', 1], ['Tons of TNT', 4.184e9], ['Megatons', 4.184e15], ['Foe', 1e44]] };

    // ---- Calculator ----
    const near = (a, b) => Math.abs(a - b) <= Math.abs(b) * 1e-12;   // tolerance so values typed exactly on a boundary land in the higher tier

    function fmt(n) {
      if (n === 0) return '0';
      const a = Math.abs(n);
      if (a >= 1e-3 && a < 1e7) return Number(n.toPrecision(5)).toLocaleString('en-US', { maximumFractionDigits: 10 });
      const [m, e] = n.toExponential(4).split('e');
      return `${m.replace(/\.?0+$/, '')} &times; 10<sup>${Number(e)}</sup>`;
    }

    function buildCalc(panel, cfg) {
      const tiers = cfg.tiers.map(([name, lo, note]) => ({ name, lo, note: note || '', exact: cfg.exact.includes(name) }));
      panel.innerHTML = `<h2>${cfg.title}</h2><p class="muted">${cfg.hint}</p>
        <div class="calc-row">
          <input class="calc-in" type="text" inputmode="decimal" placeholder="${cfg.placeholder}" aria-label="Value" autocomplete="off">
          <select class="calc-sel" aria-label="Unit">${cfg.units.map(([n], i) => `<option value="${i}">${n}</option>`).join('')}</select>
        </div>
        <div class="calc-out"></div>`;
      const input = panel.querySelector('.calc-in'), sel = panel.querySelector('.calc-sel'), out = panel.querySelector('.calc-out');

      function update() {
        const raw = input.value.trim().replace(/,/g, '');
        if (!raw) { out.innerHTML = '<p class="muted">Enter a value to see its tier.</p>'; return; }
        const x = Number(raw);
        if (!Number.isFinite(x) || x < 0) { out.innerHTML = '<p class="muted">Enter a number that is 0 or higher.</p>'; return; }
        const v = x * cfg.units[sel.value][1];
        if (!Number.isFinite(v)) { out.innerHTML = '<p class="muted">That number is too large to calculate.</p>'; return; }

        let idx = 0;
        const ex = tiers.findIndex((t) => t.exact && near(v, t.lo));
        if (ex >= 0) idx = ex;
        else tiers.forEach((t, i) => { if (!t.exact && (v >= t.lo || near(v, t.lo))) idx = i; });

        const t = tiers[idx], next = tiers[idx + 1];
        const range = (f) => t.exact ? fmt(t.lo / f) : next ? `${fmt(t.lo / f)} &ndash; ${fmt(next.lo / f)}` : `${fmt(t.lo / f)} and above`;
        const rows = cfg.rows.map(([label, f]) => `<tr><td>${label}</td><td>${fmt(v / f)}</td><td>${range(f)}</td></tr>`).join('');
        out.innerHTML = `<div class="tier-out">${t.name}</div>${t.note ? `<div class="muted">${t.note}</div>` : ''}
          <div class="table-wrap"><table class="calc-table"><thead><tr><th>Unit</th><th>Your value</th><th>Tier range</th></tr></thead><tbody>${rows}</tbody></table></div>`;
      }
      input.addEventListener('input', update);
      sel.addEventListener('change', update);
      update();
    }

    // Top-level tabs ("groups"), each with its own row of sub-tabs. A sub-tab with a build function makes its own content;
    // otherwise it shows "Coming soon". To add another calculator, add a line to the group's tabs.
    const GROUPS = [
      { id: 'strength', title: 'Strength', tabs: [{ id: 'direct-input', title: 'Direct Input', build: (panel) => buildCalc(panel, STRENGTH) }] },
      { id: 'speed', title: 'Speed', tabs: [{ id: 'direct-input', title: 'Direct Input', build: (panel) => buildCalc(panel, SPEED) }] }
    ];

    const byId = (id) => document.getElementById(id);

    GROUPS.forEach((g) => {
      const top = document.createElement('button');
      top.className = 'tab';
      top.id = 'tab-' + g.id;
      top.textContent = g.title;
      top.setAttribute('role', 'tab');
      top.addEventListener('click', () => { location.hash = '#' + g.id; });
      byId('tabs').appendChild(top);

      const box = document.createElement('div');
      box.id = 'group-' + g.id;
      const sub = document.createElement('div');
      sub.className = 'subtabs';
      sub.setAttribute('role', 'tablist');
      box.appendChild(sub);

      g.tabs.forEach((t) => {
        const btn = document.createElement('button');
        btn.className = 'tab';
        btn.id = 'tab-' + g.id + '-' + t.id;
        btn.textContent = t.title;
        btn.setAttribute('role', 'tab');
        btn.addEventListener('click', () => { location.hash = '#' + g.id + '/' + t.id; });
        sub.appendChild(btn);

        const panel = document.createElement('section');
        panel.className = 'panel';
        panel.id = 'panel-' + g.id + '-' + t.id;
        if (t.build) t.build(panel);
        else panel.innerHTML = `<h2>${t.title}</h2><p class="muted">Coming soon.</p>`;
        box.appendChild(panel);
      });
      byId('panels').appendChild(box);
    });

    // Links look like calculators.html#speed/direct-input
    function showTab() {
      const [gid, tid] = location.hash.slice(1).split('/');
      const group = GROUPS.find((g) => g.id === gid) || GROUPS[0];
      const tab = group.tabs.find((t) => t.id === tid) || group.tabs[0];
      GROUPS.forEach((g) => {
        byId('group-' + g.id).hidden = g !== group;
        byId('tab-' + g.id).setAttribute('aria-selected', String(g === group));
      });
      group.tabs.forEach((t) => {
        byId('panel-' + group.id + '-' + t.id).hidden = t !== tab;
        byId('tab-' + group.id + '-' + t.id).setAttribute('aria-selected', String(t === tab));
      });
    }
    window.addEventListener('hashchange', showTab);
    showTab();
  </script>
</body>
</html>
